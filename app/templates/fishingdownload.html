    <ul>
         钓鱼天气app是一款帮助钓鱼人合理科学钓鱼的软件。
    </ul>
    <ul>
鱼类活动跟很多天气情况有关，水温和大气压的影响情况最为明显，但是气温对水温的影响比较滞后和缓慢，大气压的变化则比较直观。大气压越高水中溶氧度越高，鱼类活动越活跃。风速风向也是一个重要的因素，微风吹佛水面增加水的溶氧度，天冷吹南风天热吹北风都非常有利钓鱼。最后降雨和湿度对钓鱼也有一定的影响。


          </ul>

    <ul>
        另外，有资料指出鱼类在日出日落月出月落的前后45分钟内活动比较活跃，在月相为满月和新月的特别活跃
    </ul>
