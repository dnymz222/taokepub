            padding: 0;

        }

            padding: 0;

        }

            padding: 0;
        }

            padding: 0;

        }

        .goodsitem {

            width: 100%;
            height: 80px;

        }

        .goodsitem .goods {

            display: flex;

            height: 100%;
            width: 100%;

            flex-direction: column;

        }

        .goodsitem .goods .goodstitle {

            height: 54px;
            text-indent: 1em;
            margin-left:5px;
            margin-right:5px;
            overflow:hidden;

        }

          margin-left: 5px;
          margin-right: 5px;
          margin-bottom: 10px;

        }

          margin-right: 6px;

        }

          background-color: #fc4b36;
          font-size: 15px;
          height: 20px;
          margin-right: 6px;
          margin-left: 6px;
          line-height: 20px;

          color: #fff;
          float: right;
          padding-left: 5px;
          padding-right: 5px;
          border-radius: 3px;



        }


        .goodsitem .price .orinprice {
          color: #999999;
          text-decoration:line-through;
          font-size: 15px;
          margin-left: 6px;
          margin-right:6px;

        }

        .goodsitem .price .sellcount {

            color: #999999;
            margin-right: 10px;

            font-size: 15px;

            right: 0px;
            left: auto;

        }


        .detailheader {
            height: 24px;
            width: 100%;
            align-items: baseline;
        }

        .detailheader h3 {

            text-align: center;
            color: #999999;
            font-size: 14px;
        }



         .headerimage {

            width: 100%;
        }

         .headerimage image {

             width: 300px;

        }

            width: 100%;
            height: 6px;
            background-color: #f2f2f2;
        }
        .whiteseperate {

            width: 100%;
            height: 6px;

        }

        .smallseperate {
            width: 100%;
            height: 1px;
            background-color: #f2f2f2;
        }


        .bannerdownload {

            width: 100%;
            height: 44px;
            background-color: #4cae4c;


        }

        .download {
            width: 96%;
            height: 44px;
            margin-top: 0px;
            padding-top: 0px;
            background-color: #4cae4c;

        }

            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            text-decoration: none;
            background-color: #4cae4c;
