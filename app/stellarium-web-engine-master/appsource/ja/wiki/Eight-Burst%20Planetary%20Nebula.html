<div class="wi-intro"><p>NGC 3132（Caldwell 74）は、ほ座にある明るくよく研究された惑星状星雲である。地球からの距離は約3800光年と推定されている。別名をEight-Burst Nebula 、南のリング星雲(八の字星雲)（Southern Ring Nebula ）とも言う。</p></div><div class="wi-rest"><h2>惑星状星雲核</h2><p>NGC 3132の画像では、星雲の中央に近接した10等級と16等級の2つの恒星が見える。2つのうち暗い方が白色矮星の惑星状星雲核である。この約10万度の熱い恒星は外層を吹き飛ばし、強い紫外線放射で星雲を輝かせている。</p></div>
