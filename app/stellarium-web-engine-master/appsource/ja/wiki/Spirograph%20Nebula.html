<div class="wi-intro"><p>IC 418は、うさぎ座に位置する惑星状星雲である。英名のSpirograph Nebulaという名前は、スピログラフの描くパターンに似た入り組んだ模様に由来する。IC 418は、太陽系から約3,600 光年離れたところにあり、0.3 光年にわたって広がっている。</p></div><div class="wi-rest"><h2>歴史</h2><p>数百万年前には、IC 418は恐らくごく普通の赤色巨星であった。核の燃料を使い果たした後、将来白色矮星になる熱い核を残して、外層が外側に拡大を始めた。</p><h2>構造</h2><p>内部には異なる化学元素が含まれる。画像中の赤色は最も冷たい電離した窒素を、緑色は水素を、青色は最も熱い電離した酸素の分布を示している 。</p></div>
