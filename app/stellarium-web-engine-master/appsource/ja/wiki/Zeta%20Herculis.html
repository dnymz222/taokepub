<div class="wi-intro"><p>ヘルクレス座ζ星は、ヘルクレス座の恒星で3等星。</p></div><div class="wi-rest"><h2>特徴</h2><p>この星は2重星であり、2つの星の離角は1秒より大きい。伴星のζ星Bは、平均で15天文単位離れ、公転周期34.5年とされる。離心率は大きく、2星の距離は、近点で8天文単位、遠点で21天文単位となる。このような環境では惑星は存在できない可能性が高い。 この星が属し、またこの星の名が冠されている『Zeta Herculis moving group』には、ペルセウス座、はちぶんぎ座、おおかみ座といった、遠く離れた星が含まれている。</p></div>
