<div class="wi-intro"><p>NGC 3918は、ケンタウルス座の明るい惑星状星雲である。"Blue Planetary"または"The Southerner"と呼ばれる。極南の惑星状星雲としては最も明るい。この星雲は、1834年3月にジョン・ハーシェルが発見した。視直径は8から10秒である。小さな望遠鏡でも容易に観測することができる。 分光観測により、NGC 3918は16.4 ± 0.2 km/sで近づいていることが明らかになったが、星雲自体は24 km/sの速度で拡大している。中央の星は地球からの距離が1.5kpc（4900光年）、V等級14.6等級、光度6000L☉と推定されているが、光学的には見えない。</p></div><div class="wi-rest"></div>
