<div class="wi-intro"><p>おとめ座ζ星は、おとめ座の恒星で3等星。 スピカのほぼ北に位置し、γ星とで正三角形を描く。また、ろくぶんぎ座α星同様に天の赤道の近くに位置している。歳差運動により、1883年2月より天の赤道から南側に位置する事となった。</p></div><div class="wi-rest"><h2>特徴</h2><p>他のA型星で見られるような惑星系の可能性を示唆する塵状の円盤は観測されていない。</p><h2>名称</h2><p>Hezeという由来不明の名称を持つ。2018年6月1日、国際天文学連合の恒星の命名に関するワーキンググループ (Working Group on Star Names, WGSN) は、Heze をおとめ座ζ星Aの固有名として正式に定めた。</p></div>
