<div class="wi-intro"><p>NGC 7041 is a lenticular galaxy located about 80 million light-years away in the constellation of Indus. NGC 7041 was discovered by astronomer John Herschel on July 7, 1834. NGC 7041 is part of the Indus Triplet of galaxies which contains the nearby galaxy NGC 7049 and the galaxy NGC 7029.</p></div><div class="wi-rest"></div>
