<div class="wi-intro"><p>NGC 245 is a spiral galaxy located in the constellation Cetus. It was discovered on October 1, 1785 by William Herschel. It is part of a galaxy group known as LGG 13. It has at least 7 confirmed members which are NGC 259, NGC 271, NGC 279, NGC 307, Mk 557 and UGC 505.</p></div><div class="wi-rest"></div>
