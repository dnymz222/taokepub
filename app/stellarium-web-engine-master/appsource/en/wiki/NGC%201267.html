<div class="wi-intro"><p>NGC 1267 is an elliptical galaxy located about 220 million light-years away in the constellation Perseus. NGC 1267 was discovered by astronomer Heinrich d'Arrest on February 14, 1863. NGC 1267 is a member of the Perseus Cluster and is possibly interacting with the spiral galaxy NGC 1268.</p></div><div class="wi-rest"></div>
