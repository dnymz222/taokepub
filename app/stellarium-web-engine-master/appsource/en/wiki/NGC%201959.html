<div class="wi-intro"><p>NGC 1959 (also known as ESO 56-SC120) is an open cluster located in the Mensa constellation which is part of the Large Magellanic Cloud. It was discovered by John Herschel on December 23, 1834. Its apparent magnitude is 12.2, and its size is 0.50 arc minutes.</p></div><div class="wi-rest"></div>
