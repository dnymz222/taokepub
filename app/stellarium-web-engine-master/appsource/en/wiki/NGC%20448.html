<div class="wi-intro"><p>NGC 448 is a lenticular galaxy of type S0 (edge-on) located approximately 88.45 ± 23.63 Mly (27.120 ± 7.246 Mpc) away in the constellation Cetus. It was discovered on September 2, 1886 by Lewis Swift. It was described by Dreyer as "pretty bright, very small, [and] a little extended."</p></div><div class="wi-rest"></div>
