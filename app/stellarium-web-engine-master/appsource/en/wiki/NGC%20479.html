<div class="wi-intro"><p>NGC 479 (also known as UGC 893, MCG 1-4-31, ZWG 411.31, PGC 4905) is a spiral galaxy in the constellation Pisces. It was discovered by German astronomer Albert Marth on October 27, 1864. It is about 240 million light-years away from Earth.</p></div><div class="wi-rest"></div>
