<div class="wi-intro"><p>NGC 767 is a barred spiral galaxy located in the constellation Cetus about 241 million light years from the Milky Way. It was discovered by the American astronomer Francis Leavenworth in 1886. One supernova has been observed in NGC 767: SN 2019lre (type II, mag. 19.2).</p></div><div class="wi-rest"></div>
