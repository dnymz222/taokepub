<div class="wi-intro"><p>NGC 2512 is a spiral galaxy in the constellation of Cancer. It was discovered on February 10, 1787, by William Herschel.</p></div><div class="wi-rest"><h2>LDC 548 galaxy group</h2><p>NGC 2512 is a member of the LDC 547 galaxy group, which contains a total of four member galaxies, including NGC 2486, NGC 2487, and NGC 2498.</p></div>
