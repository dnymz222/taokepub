<div class="wi-intro"><p>NGC 6044 is a lenticular galaxy located about 465 million light-years away in the constellation Hercules. NGC 6044 was discovered by astronomer Lewis Swift on June 27, 1886. It was then rediscovered by astronomer Guillaume Bigourdan on June 8, 1888. NGC 6044 is a member of the Hercules Cluster.</p></div><div class="wi-rest"></div>
