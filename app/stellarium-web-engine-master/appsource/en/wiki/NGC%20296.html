<div class="wi-intro"><p>NGC 296 is a low surface brightness unbarred spiral galaxy in the constellation of Pisces. The designation NGC 295 is sometimes mistakenly used for NGC 296.</p></div><div class="wi-rest"><h2>Supernova</h2><p>One supernova has been observed in NGC 296:</p><p>SN 2023lzn (Type II, mag. 18.5) was discovered by ATLAS on 28 June 2023.</p></div>
