<div class="wi-intro"><p>102P/Shoemaker, also known as Shoemaker 1, is a Jupiter-family comet with a 7.47-year orbit around the Sun. It was first seen in 1984, and then again in 1991. Images taken of it in 1999 were not recognized until 2006 when it was once again observed. It was unexpectedly dim in each of these returns.</p></div><div class="wi-rest"></div>
