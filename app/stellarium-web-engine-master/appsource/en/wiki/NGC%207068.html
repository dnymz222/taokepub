<div class="wi-intro"><p>NGC 7068 is a spiral galaxy located about 215 million light-years away in the constellation of Pegasus. NGC 7068 was discovered by astronomer Albert Marth on November 7, 1863. On June 26, 2013 a Type Ia supernova designated as SN 2013ei was discovered in NGC 7068.</p></div><div class="wi-rest"></div>
