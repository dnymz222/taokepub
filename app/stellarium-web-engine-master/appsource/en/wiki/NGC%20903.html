<div class="wi-intro"><p>NGC 903 is a lenticular galaxy in the constellation Aries. It is estimated to be about 230 million light-years from the Milky Way and has a diameter of approximately 35,000 ly. NGC 903 was discovered on 13 December 1884 by the astronomer Edouard Stephan.</p></div><div class="wi-rest"></div>
