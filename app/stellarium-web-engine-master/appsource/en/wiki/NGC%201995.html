<div class="wi-intro"><p>NGC 1995 (also known as PGC 3325910) is a double star located in the Pictor constellation. It was discovered by John Herschel on December 28, 1834. Its size is 0.78 arc minutes. In some sources, such as VizieR, NGC 1995 is misidentified as the nearby lenticular galaxy NGC 1998.</p></div><div class="wi-rest"></div>
