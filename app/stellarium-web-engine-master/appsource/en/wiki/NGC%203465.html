<div class="wi-intro"><p>NGC 3465 is a spiral galaxy in constellation Draco. It was discovered on April 2, 1801, by William Herschel.</p></div><div class="wi-rest"><h2>Supernova</h2><p>One supernova has been observed in NGC 3465: SN 2004bc (Type Ia, mag. 16.5) was discovered by Federico Manzini on 1 April 2004.</p></div>
