<div class="wi-intro"><p>NGC 304 is a lenticular galaxy in the constellation Andromeda. It was discovered on October 23, 1878, by Édouard Stephan.</p></div><div class="wi-rest"><h2>Supernova</h2><p>One supernova has been observed in NGC 304:</p><p>SN 2021dnn (Type Ia, mag. 15.838), was discovered by ATLAS on 22 February 2021.</p></div>
