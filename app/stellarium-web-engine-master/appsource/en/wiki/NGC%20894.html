<div class="wi-intro"><p>NGC 895 is an unbarred spiral galaxy located around 98 million light-years away in the constellation Cetus. NGC 895 was discovered November 28, 1856 by R. J. Mitchell. NGC 895 is not known to have much star-formation, and is not known to have an active galactic nuclei.</p></div><div class="wi-rest"></div>
