<div class="wi-intro"><p>NGC 3463 is a unbarred spiral galaxy in the constellation Hydra. It is classified as a type SAb galaxy. It was discovered on the 26th of March, 1835, by John Herschel. He described it as "faint, small, round, gradually a little brighter middle". NGC 3463 is proposed member of the NGC 3393 Group.</p></div><div class="wi-rest"></div>
