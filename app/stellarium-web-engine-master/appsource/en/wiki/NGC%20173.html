<div class="wi-intro"><p>NGC 173 is an unbarred spiral galaxy located approximately 3.8 million light-years away in the constellation Cetus. NGC 173 is part of a galaxy group known as NGC 192 Group or LGG 10, together with 4 core members: NGC 192, NGC 196, NGC 201, NGC 237 and 1 possible member: NGC 197.</p></div><div class="wi-rest"></div>
