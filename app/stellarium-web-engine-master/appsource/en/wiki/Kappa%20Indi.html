<div class="wi-intro"><p>The Bayer designation Kappa Indi (κ Indi / Kappa Ind / κ Ind) can refer to two different stars in the constellation Indus:</p><p>κ1 Indi, a quadruple system more commonly known as BG Indi, with an apparent magnitude of 6.12 κ2 Indi, a red giant with an apparent magnitude of 5.62</p></div><div class="wi-rest"></div>
