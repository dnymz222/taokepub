<div class="wi-intro"><p>NGC 53 is a ringed barred spiral galaxy in the constellation Tucana. It was discovered by John Herschel on 15 September 1836. He described it as "very faint, small, extended". The galaxy is approximately 120,000 light-years across, making it about as large as the Milky Way.</p></div><div class="wi-rest"></div>
