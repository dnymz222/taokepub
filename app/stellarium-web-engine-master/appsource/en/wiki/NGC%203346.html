<div class="wi-intro"><p>NGC 3346 is a barred spiral galaxy in Leo. It is classified as a type SAc galaxy. It was discovered by William Herschel in 1784. It is estimated to be 16.67 kiloparsecs in diameter. NGC 3346 is part of the NGC 3338 Group. This group also contains NGC 3338, NGC 3389, UGC 5832, and MRK 1263.</p></div><div class="wi-rest"></div>
