<div class="wi-intro"><p>NGC 1334 is a spiral galaxy located about 185 million light-years away in the constellation Perseus. It was discovered by astronomer Heinrich d'Arrest on February 14, 1863. NGC 1334 is a member of the Perseus Cluster and is a starburst galaxy. It also appears to have a complex distorted structure.</p></div><div class="wi-rest"></div>
