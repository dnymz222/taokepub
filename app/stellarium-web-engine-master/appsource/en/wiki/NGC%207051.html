<div class="wi-intro"><p>NGC 7051 is a barred spiral galaxy located about 100 million light-years away in the constellation of Aquarius. It was discovered by astronomer John Herschel on July 30, 1827. On June 18, 2002 a type II supernova designated as SN 2002dq was discovered in NGC 7051.</p></div><div class="wi-rest"></div>
