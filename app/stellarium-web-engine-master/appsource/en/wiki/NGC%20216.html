<div class="wi-intro"><p>NGC 216 is a lenticular galaxy located approximately 68.8 million light-years from the Sun in the constellation Cetus. It was discovered on December 9, 1784, by William Herschel. It has the appearance of a dusty disk galaxy being viewed from edge-on with a peculiar, one-sided bar.</p></div><div class="wi-rest"></div>
