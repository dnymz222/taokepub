<div class="wi-intro"><p>NGC 165 is a barred spiral galaxy located in the constellation Cetus. It was discovered in 1882 by Wilhelm Tempel and was described by as "faint, large, star in centre, eastern of 2" by John Louis Emil Dreyer. One supernova has been observed in NGC 165: SN 2021acnz (type Ib, mag. 19.2).</p></div><div class="wi-rest"></div>
