<div class="wi-intro"><p>NGC 3271 is a barred lenticular galaxy in the constellation Antlia. At magnitude 11.7, it is the brightest galaxy in the Antlia Cluster, which lies about 40.7 megaparsecs (132.7 million light-years) away. It was discovered on May 1, 1834 by the astronomer John Herschel.</p></div><div class="wi-rest"></div>
