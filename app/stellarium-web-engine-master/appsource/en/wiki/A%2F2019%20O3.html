<div class="wi-intro"><p>C/2019 O3 (Palomar) is a distant Oort cloud comet that came to perihelion on 8 March 2021 at a distance of 8.82 AU (1.319 billion km) from the Sun. It is discovered from the Palomar Observatory in July 2019, and is one of eight comets named after it.</p></div><div class="wi-rest"></div>
