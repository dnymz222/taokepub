<div class="wi-intro"><p>NGC 26 is a spiral galaxy in the Pegasus constellation. It was discovered on 14 September 1865 by Heinrich Louis d'Arrest.</p></div><div class="wi-rest"><h2>NGC 23 group</h2><p>NGC 26 is part of the NGC 23 group (also known as LGG 2) that includes at least 6 other galaxies: NGC 1, NGC 23, UGC 69, UGC 79, UGC 110, and UGC 127.</p><h2>Gallery</h2></div>
