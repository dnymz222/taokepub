<div class="wi-intro"><p>NGC 7025 is a spiral galaxy located about 210 million light-years away from Earth in the constellation Delphinus. NGC 7025 is also classified as a LINER galaxy. The galaxy has an estimated diameter of 161,830 light-years. It was discovered by astronomer Albert Marth on September 17, 1863.</p></div><div class="wi-rest"><h2>Gallery</h2></div>
