<div class="wi-intro"><p>NGC 1997 (also known as ESO 86-SC1) is an open cluster located in the Dorado constellation which is part of the Large Magellanic Cloud. It was discovered by John Herschel on November 30, 1834. Its apparent magnitude is 13.43 and its size is 1.80 arc minutes.</p></div><div class="wi-rest"></div>
