<div class="wi-intro"><p>NGC 7031 is a small open cluster located in the Cygnus constellation. It was discovered by German-British astronomer William Herschel on September 21, 1788. It is located at a distance of about 2,934 light-years (900pc) from the Sun and 29,000 light-years from the Galactic Center.</p></div><div class="wi-rest"></div>
