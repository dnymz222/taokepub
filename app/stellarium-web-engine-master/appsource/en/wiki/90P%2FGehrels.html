<div class="wi-intro"><p>90P/Gehrels, also known as Gehrels 1, is a Jupiter-family comet with a 14.9 year orbital period around the Sun. Its nucleus is about 5.28 km (3.28 mi) in diameter. It last came to perihelion in 2017 and will next come to perihelion in 2032.</p></div><div class="wi-rest"></div>
