<div class="wi-intro"><p>NGC 498 is a lenticular galaxy located about 260 million light-years away from Earth, in the constellation Pisces. NGC 498 was discovered by astronomer R. J. Mitchell on October 23, 1856. NGC 498 is a member of the NGC 507 Group which is part of the Perseus–Pisces Supercluster.</p></div><div class="wi-rest"></div>
