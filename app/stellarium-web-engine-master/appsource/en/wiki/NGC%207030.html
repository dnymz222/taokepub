<div class="wi-intro"><p>NGC 7030 is a barred spiral galaxy located about 380 million light-years away in the constellation Capricornus. NGC 7030 has an estimated diameter of 133,510 light-years. NGC 7030 was discovered by astronomer Francis Preserved Leavenworth on September 3, 1885.</p></div><div class="wi-rest"></div>
