<div class="wi-intro"><p>NGC 327 is a spiral galaxy in the constellation Cetus. It was discovered on September 27, 1864 by Albert Marth. It is described by Dreyer as "faint, small, extended." It is nearby galaxies NGC 329, NGC 325 and NGC 321. One supernova has been observed in NGC 327: SN 2021aclv (type Ia, mag. 17.3).</p></div><div class="wi-rest"></div>
