<div class="wi-intro"><p>NGC 7019 is a spiral galaxy located about 480 million light-years away in the constellation of Capricornus. It was discovered by American astronomer Francis Leavenworth in 1886. It is host to a supermassive black hole with an estimated mass of 7.5 × 107 M☉.</p></div><div class="wi-rest"></div>
