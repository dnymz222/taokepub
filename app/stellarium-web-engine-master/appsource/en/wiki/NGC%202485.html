<div class="wi-intro"><p>NGC 2485 is a spiral galaxy located in the constellation of Canis Minor. It is located 233 million light-years away from Earth and has an estimated diameter of 110,000 light-years. NGC 2485 was discovered on March 25, 1864, by Albert Marth and has an approximate surface magnitude of 13.08.</p></div><div class="wi-rest"></div>
