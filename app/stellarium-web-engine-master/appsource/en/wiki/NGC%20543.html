<div class="wi-intro"><p>NGC 543 is an elliptical galaxy located around 324 million light-years away in the constellation Cetus. NGC 543 was discovered by German astronomer Heinrich Louis d'Arrest on October 31, 1864. It is not known to have much star formation, and it is a member of the galaxy cluster Abell 194.</p></div><div class="wi-rest"></div>
