<div class="wi-intro"><p>NGC 271 is a barred spiral galaxy in the constellation Cetus. It was discovered on October 1, 1785 by William Herschel. NGC 271 is part of a galaxy group known as LGG 13. It has at least 7 members, which are NGC 259, NGC 245, NGC 279, NGC 307, Mk 557 and UGC 505.</p></div><div class="wi-rest"></div>
