<div class="wi-intro"><p>NGC 194 is an elliptical galaxy located in the constellation Pisces. It was discovered on December 25, 1790 by William Herschel. NGC 194 is part of a galaxy group known as NGC 198 Group or LGG 9, together with NGC 182, NGC 198 and NGC 200.</p></div><div class="wi-rest"></div>
