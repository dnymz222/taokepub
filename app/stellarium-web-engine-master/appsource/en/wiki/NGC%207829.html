<div class="wi-intro"><p>NGC 7829 is a lenticular galaxy in the constellation Cetus. NGC 7829 was discovered by American astronomer Francis Leavenworth in 1886. NGC 7829 forms with its neighbor NGC 7828 a pair of gravitationally interacting galaxies. The pair appears in Halton Arp's Atlas of Peculiar Galaxies as Arp 144.</p></div><div class="wi-rest"></div>
