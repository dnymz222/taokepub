<div class="wi-intro"><p>NGC 4084 is an elliptical galaxy located 315 million light-years away in the constellation Coma Berenices. NGC 4084 was discovered by astronomer Heinrich d'Arrest on April 26, 1865. NGC 4084 is an isolated member of the Coma Supercluster and is classified as a LINER galaxy.</p></div><div class="wi-rest"></div>
