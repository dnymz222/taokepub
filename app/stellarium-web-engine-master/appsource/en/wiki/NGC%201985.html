<div class="wi-intro"><p>NGC 1985 (also known as 2MASS J05374779+3159200) is a reflection nebula located in the constellation Auriga. It was discovered by William Herschel on December 13, 1790. It has an apparent magnitude of 12.8 and is about 40 arcseconds in diameter.</p></div><div class="wi-rest"></div>
