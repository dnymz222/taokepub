<div class="wi-intro"><p>NGC 1979 (also known as ESO 487-24) is a lenticular galaxy in the Lepus constellation. It is about 78 million light-years from the Milky Way. It was discovered by William Herschel on 20 November 1784 and its size is 1.8 by 1.8 arc minutes.</p></div><div class="wi-rest"></div>
