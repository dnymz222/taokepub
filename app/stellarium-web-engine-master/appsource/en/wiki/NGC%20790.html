<div class="wi-intro"><p>NGC 790 is a lenticular galaxy in the constellation Cetus. It is estimated to be 233 million light-years from the Milky Way and has a diameter of approximately 90,000 light years. NGC 790 was discovered on September 10, 1785 by the German-British astronomer William Herschel.</p></div><div class="wi-rest"></div>
