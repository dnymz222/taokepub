<div class="wi-intro"><p>NGC 6304 is a globular cluster in the constellation Ophiuchus. William Herschel discovered this star cluster using an 18.5-inch (47 cm) f/13 speculum reflector telescope in 1786. It is about 19,000 light-years away, near the Milky Way's central bulge.</p></div><div class="wi-rest"></div>
