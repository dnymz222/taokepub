<div class="wi-intro"><p>NGC 279 is a lenticular galaxy in the constellation Cetus. It was discovered on October 1, 1785 by William Herschel. NGC 279 is part of a galaxy group known as LGG 13. It's members are NGC 259, NGC 271, NGC 245, NGC 307, Mk 557 and UGC 505.</p></div><div class="wi-rest"></div>
