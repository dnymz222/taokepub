<div class="wi-intro"><p>IC 447 is a reflection nebula located in the constellation Monoceros. It includes several massive B-type stars and forms one end of the Monoceros R1 Molecular Cloud, with IC 446 at the opposite end. IC 447 may have been formed by more massive members of the young open cluster Collinder 95.</p></div><div class="wi-rest"></div>
