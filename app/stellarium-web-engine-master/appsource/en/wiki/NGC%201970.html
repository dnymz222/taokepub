<div class="wi-intro"><p>NGC 1970 (also known as ESO 56-SC127) is a bright open cluster and emission nebula in the Dorado constellation in the Large Magellanic Cloud. It was discovered by John Herschel on January 31, 1835. Its apparent size is 8.0. It is commonly known as the Tulip Nebula.</p></div><div class="wi-rest"></div>
