<div class="wi-intro"><p>NGC 4343 is an unbarred spiral galaxy in the constellation Virgo. It was discovered by the astronomer William Herschel on April 13, 1784. At a distance of 80 million light-years (25 Mpc), it is located in the Virgo Cluster. It contains an active galactic nucleus.</p></div><div class="wi-rest"><h2>Gallery</h2></div>
