<div class="wi-intro"><p>(230965) 2004 XA192 is a Kuiper-belt object with a diameter of 339+120−95 km. It has an absolute magnitude of approximately 4.42, and albedo around 26%. It was discovered on 12 December 2004 at Palomar Observatory. It is currently at 35.8 AU from the Sun, near its perihelion.</p></div><div class="wi-rest"></div>
