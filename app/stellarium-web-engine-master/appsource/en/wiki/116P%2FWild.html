<div class="wi-intro"><p>116P/Wild, also known as Wild 4, is a periodic comet in the Solar System. It fits the definition of an Encke-type comet with (TJupiter &gt; 3; a &lt; aJupiter). On 4 November 2042, the comet will pass about 0.029 AU (4.3 million km; 2.7 million mi) from 1 Ceres.</p></div><div class="wi-rest"></div>
