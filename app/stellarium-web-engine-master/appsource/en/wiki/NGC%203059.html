<div class="wi-intro"><p>NGC 3059 is a barred spiral galaxy. It is located in the constellation of Carina. The galaxy can be described as being faint, large, and irregularly round. It was discovered on February 22, 1835, by John Herschel. The galaxy has been calculated to be 45 - 50 million lightyears from Earth.</p></div><div class="wi-rest"></div>
