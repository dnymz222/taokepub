<div class="wi-intro"><p>NGC 4086 is a lenticular galaxy located 330 million light-years away in the constellation Coma Berenices. NGC 4086 was discovered by astronomer Heinrich d'Arrest on May 2, 1864 and is a member of the NGC 4065 Group. NGC 4086 is classified as a LINER galaxy.</p></div><div class="wi-rest"></div>
