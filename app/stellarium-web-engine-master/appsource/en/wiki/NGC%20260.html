<div class="wi-intro"><p>NGC 260 is a spiral galaxy located in the constellation Andromeda. It was discovered on August 27, 1865 by Heinrich d'Arrest. It is part of a galaxy group known as LGG 12, which has 5 core members, which are NGC 252, UGC 470, UGC 501 and CGCG 500-92</p></div><div class="wi-rest"></div>
