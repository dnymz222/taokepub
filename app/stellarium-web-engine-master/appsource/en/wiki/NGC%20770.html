<div class="wi-intro"><p>NGC 770 is an elliptical galaxy in the constellation Aries. It is around 120 million light years from the Milky Way and has a diameter of around 36,000 ly. NGC 770 is gravitationally linked to NGC 772. The galaxy was discovered on November 3, 1855 by R. J. Mitchell.</p></div><div class="wi-rest"></div>
