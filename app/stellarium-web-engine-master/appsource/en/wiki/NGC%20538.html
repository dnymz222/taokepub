<div class="wi-intro"><p>NGC 538 is a barred spiral galaxy in the constellation of Cetus. It is located about 250 million light-years from the Milky Way with a diameter of approximately 95,000 ly. NGC 538 was discovered by the American astronomer Lewis Swift in 1886. NGC 538 is estimated to be about 2.5 billion years old.</p></div><div class="wi-rest"></div>
