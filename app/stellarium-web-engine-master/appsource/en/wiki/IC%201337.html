<div class="wi-intro"><p>IC 1337 is an intermediate spiral galaxy in the constellation Capricornus. The galaxy is located close to the celestial equator. It was discovered by Stéphane Javelle on July 22, 1892.</p><p>One supernova has been observed in IC 1337: SN 2019gwl (type II, mag. 19.15).</p></div><div class="wi-rest"></div>
