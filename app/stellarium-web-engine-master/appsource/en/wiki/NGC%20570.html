<div class="wi-intro"><p>NGC 570 is a barred spiral galaxy. It is located in the Cetus constellation about 250 million light-years from the Milky Way. It was discovered by the American astronomer George Mary Searle in 1867. One supernova has been observed in NGC 570: SN 2021qwh (type Ia, mag. 18.45).</p></div><div class="wi-rest"></div>
