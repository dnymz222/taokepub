<div class="wi-intro"><p>NGC 423 is a lenticular galaxy of type S0/a? located in the constellation Sculptor. It was discovered on November 14, 1835 by John Herschel. It was described by Dreyer as "extremely faint, small, extended, gradually a little brighter middle, eastern of 2.", the other being NGC 418.</p></div><div class="wi-rest"></div>
