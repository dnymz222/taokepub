<div class="wi-intro"><p>NGC 7797 is a Hubble-type SAb-SAc spiral galaxy that is located in the constellation Pisces. It is estimated to be 400 million light-years from the Milky Way and has a diameter of about 115,000 light-years. It was discovered by astronomer William Herschel on December 6, 1790.</p></div><div class="wi-rest"></div>
