<div class="wi-intro"><p>NGC 7087 is a barred spiral galaxy located about 215 million light-years away in the constellation of Grus. NGC 7087 was discovered by astronomer John Herschel on September 4, 1834. NGC 7087 is a member of a group of galaxies known as the NGC 7087 group.</p></div><div class="wi-rest"></div>
