<div class="wi-intro"><p>NGC 5966 is an elliptical galaxy in the constellation Boötes. NGC 5966 is its New General Catalogue designation. The galaxy was discovered by William Herschel on March 18, 1787. Based on its redshift, it is located about 220 million light-years (67 Mpc) away from the Sun.</p></div><div class="wi-rest"><h2>Gallery</h2></div>
