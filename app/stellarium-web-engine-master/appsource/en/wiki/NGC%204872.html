<div class="wi-intro"><p>NGC 4872 is a barred lenticular galaxy located about 310 million light-years away in the constellation of Coma Berenices. NGC 4872 has been indicated to contain an active galactic nucleus. NGC 4872 was discovered by astronomer Heinrich d'Arrest. It is a member of the Coma Cluster.</p></div><div class="wi-rest"></div>
