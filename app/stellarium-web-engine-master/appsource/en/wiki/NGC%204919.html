<div class="wi-intro"><p>NGC 4919 is a lenticular galaxy located about 340 million light-years away in the constellation of Coma Berenices. NGC 4919 was discovered by astronomer Heinrich d'Arrest on May 5, 1864. NGC 4919 is a member of the Coma Cluster.</p></div><div class="wi-rest"><h2>Other images</h2></div>
