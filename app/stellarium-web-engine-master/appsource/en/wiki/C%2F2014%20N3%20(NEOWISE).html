<div class="wi-intro"><p>Comet NEOWISE, formally designated as C/2014 N3, is a distant non-periodic comet that came to perihelion at a distance of 3.88 AU (580 million km) from the Sun on 13 March 2015. It is one of several comets discovered by the NEOWISE space telescope.</p></div><div class="wi-rest"></div>
