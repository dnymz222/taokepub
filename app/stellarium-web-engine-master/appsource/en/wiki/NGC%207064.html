<div class="wi-intro"><p>NGC 7064 is a nearby edge-on barred spiral galaxy located about 35 million light-years away in the constellation of Indus. NGC 7064 has an estimated diameter of 51,000 light-years. NGC 7064 was discovered by astronomer John Herschel on July 8, 1834.</p></div><div class="wi-rest"></div>
