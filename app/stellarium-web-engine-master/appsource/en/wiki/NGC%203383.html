<div class="wi-intro"><p>NGC 3383 is a barred spiral galaxy in the constellation Hydra. It was discovered by John Herschel. NGC 3383 is member of the NGC 3393 Group. One supernova has been observed in NGC 3383: SN 2022ydu (Type II, mag. 17.861) was discovered by ATLAS on 20 October 2022.</p></div><div class="wi-rest"></div>
