<div class="wi-intro"><p>NGC 7096 is a grand-design spiral galaxy located about 130 million light-years away in the constellation of Indus. NGC 7096 is also part of a group of galaxies that contains the galaxy NGC 7083. NGC 7096 was discovered by astronomer John Herschel on August 31, 1836.</p></div><div class="wi-rest"></div>
