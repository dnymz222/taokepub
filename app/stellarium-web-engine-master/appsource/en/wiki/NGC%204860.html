<div class="wi-intro"><p>NGC 4860 is an elliptical galaxy in the constellation Coma Berenices. The galaxy was discovered on 21 April 1865 by Heinrich Louis d'Arrest. With its distance from Earth being approximately 110 million parsecs, NGC 4860 belongs to the Coma Cluster, which consists of over 1,000 identified galaxies.</p></div><div class="wi-rest"></div>
