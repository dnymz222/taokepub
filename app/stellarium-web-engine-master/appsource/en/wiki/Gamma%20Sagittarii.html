<div class="wi-intro"><p>The Bayer designation γ Sagittarii (Gamma Sagittarii) is shared by two stars in the constellation Sagittarius:</p><p>γ1 Sagittarii (Dhanusaragra), a Cepheid variable better-known as W Sagittarii γ2 Sagittarii (Alnasl), an orange giant</p><p>"-": none The two stars are separated by slightly under one degree.</p></div><div class="wi-rest"></div>
