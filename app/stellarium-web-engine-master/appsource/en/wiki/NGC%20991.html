<div class="wi-intro"><p>NGC 991 is an intermediate spiral galaxy the constellation Cetus. This galaxy was discovered by astronomer William Herschel in 1785.</p></div><div class="wi-rest"><h2>Supernova</h2><p>One supernova has been observed in NGC 991: SN 1984L (Type Ib, mag. 14) was discovered by Robert Evans on 28 August 1984.</p></div>
