<div class="wi-intro"><p>NGC 3558 is an elliptical or a lenticular galaxy located 440 million light-years away in the constellation Ursa Major. It was discovered by the astronomer Heinrich d'Arrest on April 15, 1866. It is a member of the galaxy cluster Abell 1185 and is classified as a LINER galaxy.</p></div><div class="wi-rest"></div>
