<div class="wi-intro"><p>NGC 109 is a spiral galaxy estimated to be about 240 million light-years away in the constellation of Andromeda. It was discovered by Heinrich d'Arrest in 1861 and its magnitude is 13.7. One supernova has been observed in NGC 109: SN 2019upw (type Ia, mag. 17.5).</p></div><div class="wi-rest"></div>
