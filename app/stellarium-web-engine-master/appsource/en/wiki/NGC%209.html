<div class="wi-intro"><p>NGC 9 is a spiral galaxy about 140 million light-years away in the Pegasus constellation. It was discovered on 27 September 1865 by Russian astronomer Otto Wilhelm von Struve.</p></div><div class="wi-rest"><h2>Supernova</h2><p>One supernova has been observed in NGC 9: SN 2021zju (type Ib, mag. 18.15).</p></div>
