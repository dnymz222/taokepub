<div class="wi-intro"><p>NGC 5879 is an unbarred spiral galaxy in the constellation Draco. The galaxy was discovered in 1788 by William Herschel. It is a member of the NGC 5866 Group. One supernova has been observed in NGC 5879: SN 1954C (type unknown, mag. 14.9) was discovered by Paul Wild on 27 September 1954.</p></div><div class="wi-rest"></div>
