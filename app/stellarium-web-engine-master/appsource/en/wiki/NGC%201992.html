<div class="wi-intro"><p>NGC 1992 (also known as PGC 17466) is a lenticular galaxy located in the Columba constellation. It was discovered by John Herschel on November 19, 1835. It is about 473 million light years from the Milky Way, Its apparent magnitude is 14.65 and its size is 1.0 x 0.7 arc minutes.</p></div><div class="wi-rest"></div>
