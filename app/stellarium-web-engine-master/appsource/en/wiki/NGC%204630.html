<div class="wi-intro"><p>NGC 4630 is an irregular galaxy located about 54 million light-years away in the constellation of Virgo. NGC 4630 was discovered by astronomer William Herschel on February 2, 1786. NGC 4630 is part of the Virgo II Groups which form a southern extension of the Virgo Cluster.</p></div><div class="wi-rest"></div>
