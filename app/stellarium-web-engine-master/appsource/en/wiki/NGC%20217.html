<div class="wi-intro"><p>NGC 217 is a spiral or lenticular galaxy located approximately 178 light-years from the Solar System in the constellation Cetus. It was discovered on November 28, 1785 by William Herschel. NGC 217 is part of galaxy group known as LGG 8, together with NGC 151, MCG 2-2-30 and MCG 2-2-38.</p></div><div class="wi-rest"></div>
