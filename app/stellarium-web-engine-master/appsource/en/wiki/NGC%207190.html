<div class="wi-intro"><p>NGC 7190 is a barred lenticular galaxy registered in the New General Catalogue. It is located in the direction of the Pegasus constellation. It was discovered by the French astronomer Édouard Stephan on 28 September 1870 using an 80.01 cm (31.5 inch) reflector.</p></div><div class="wi-rest"></div>
