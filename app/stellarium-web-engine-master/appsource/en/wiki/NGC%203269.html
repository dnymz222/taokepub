<div class="wi-intro"><p>NGC 3269 is a barred spiral or lenticular galaxy in the constellation Antlia. It is a member of the Antlia Cluster, which lies about 40.7 megaparsecs (132.7 million light-years) away. It was discovered by British astronomer John Herschel on 1 May 1834.</p></div><div class="wi-rest"></div>
