<div class="wi-intro"><p>NGC 3844 is a lenticular galaxy located about 320 million light-years away in the constellation Leo. The galaxy was discovered by astronomer Heinrich d'Arrest on May 8, 1864. NGC 3844 is a member of the Leo Cluster and is likely to be a low-luminosity AGN (LLAGN).</p></div><div class="wi-rest"></div>
