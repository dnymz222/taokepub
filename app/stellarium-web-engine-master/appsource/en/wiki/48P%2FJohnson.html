<div class="wi-intro"><p>48P/Johnson is a periodic comet in the Solar System. The comet's nucleus is estimated to be approximately 5.74 km (3.57 mi) in diameter, according to Lamy, Fernandez, and Weaver. David C. Jewitt and Scott S. Sheppard, however, estimate the nucleus to have dimensions of 6.0 × 4.4 km (3.7 × 2.7 mi).</p></div><div class="wi-rest"></div>
