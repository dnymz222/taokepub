<div class="wi-intro"><p>NGC 3412 is a barred lenticular galaxy located in the constellation Leo. It was discovered on April 8, 1784, by the German-British astronomer William Herschel. The galaxy is inclined at an angle of 55.3°±2.1° with the major axis aligned along a position angle of 151.0°±0.9°.</p></div><div class="wi-rest"></div>
