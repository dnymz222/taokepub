<div class="wi-intro"><p>n Herculis, also known as 28 Herculis, is a mercury-manganese star in the constellation Hercules at a distance of approximately 381 light-years (about 117 parsecs) from the Sun. The apparent magnitude of the star is +5.6. Once in the constellation Ophiuchus, it was also catalogued as 11 Ophiuchi.</p></div><div class="wi-rest"></div>
