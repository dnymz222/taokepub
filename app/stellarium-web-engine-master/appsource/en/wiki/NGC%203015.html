<div class="wi-intro"><p>NGC 3015 (also known as UGC 5261) is an intermediate spiral galaxy in the constellation Sextans. It was discovered on April 23, 1864 by Albert Marth.</p></div><div class="wi-rest"><h2>Supernova</h2><p>One supernova has been observed in NGC 3015: SN 2019vjl (Type II, mag. 17.3) was discovered by ASAS-SN on 23 November 2019.</p></div>
