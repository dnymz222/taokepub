<div class="wi-intro"><p>NGC 4873 is a lenticular galaxy located about 270 million light-years away in the constellation of Coma Berenices. NGC 4873 was discovered by astronomer Heinrich d'Arrest on May 10, 1863. The galaxy is a member of the Coma Cluster.</p></div><div class="wi-rest"><h2>Other images</h2></div>
