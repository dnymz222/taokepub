<div class="wi-intro"><p>NGC 3666 is an unbarred spiral galaxy in the constellation Leo. It was discovered by William Herschel on March 15, 1784. It is a member of the Leo II Groups, a series of galaxies and galaxy clusters strung out from the right edge of the Virgo Supercluster.</p></div><div class="wi-rest"><h2>Gallery</h2></div>
