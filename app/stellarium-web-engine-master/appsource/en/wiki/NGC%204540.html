<div class="wi-intro"><p>NGC 4540 is a spiral galaxy with type 1 Seyfert activity located about 64 million light-years away in the constellation Coma Berenices. NGC 4540 was discovered by astronomer William Herschel on March 21, 1784 and is a member of the Virgo Cluster.</p></div><div class="wi-rest"></div>
