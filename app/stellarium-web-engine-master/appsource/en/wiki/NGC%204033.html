<div class="wi-intro"><p>NGC 4033 is an elliptical galaxy located in the constellation Corvus. It was discovered on 31 December 1785, by William Herschel.</p></div><div class="wi-rest"><h2>Group</h2><p>NGC 4033 is a member of the NGC 4038 Group, a group of galaxies located in the constellations of Corvus and Crater.</p><h2>Gallery</h2></div>
