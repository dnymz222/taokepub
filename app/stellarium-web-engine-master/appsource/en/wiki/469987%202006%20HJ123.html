<div class="wi-intro"><p>(469987) 2006 HJ123 is a trans-Neptunian object (TNO). It was discovered in 2006 by Marc W. Buie. The object is a plutino (in 2:3 resonance with Neptune). The size of 2006 HJ123 was measured by the Herschel Space Telescope to be 283+142−111 km.</p></div><div class="wi-rest"></div>
