<div class="wi-intro"><p>NGC 1403 is a lenticular or elliptical galaxy in the constellation Eridanus. It was discovered in 1886 by Francis Preserved Leavenworth. It was thought to be a "very faint, extremely small, nebulous star" by John Louis Emil Dreyer, the compiler of the New General Catalogue.</p></div><div class="wi-rest"></div>
