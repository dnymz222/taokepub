<div class="wi-intro"><p>NGC 234 is a spiral galaxy located in the constellation Pisces. It was discovered on October 14, 1784, by William Herschel.</p></div><div class="wi-rest"><h2>Supernova</h2><p>One supernova has been observed in NGC 234:</p><p>SN 2021abze (Type II, mag. 16.632) was discovered by ATLAS on 22 October 2021.</p></div>
