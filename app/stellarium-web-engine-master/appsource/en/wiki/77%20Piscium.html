<div class="wi-intro"><p>77 Piscium is a multiple star system in the constellation of Pisces. The star system is located at a distance of 144 and 143 light years from the Earth based on parallax, but is drifting closer with a heliocentric radial velocity of −7.59 and −7.19 km/s.</p></div><div class="wi-rest"></div>
