<div class="wi-intro"><p>NGC 5790 is a lenticular galaxy located 541 million light-years away in the Boötes constellation. It was discovered on 16 May 1884 by French astronomer Édouard Stephan. The galaxy is approximately 180,000 light-years across. NGC 5790 is a type 2 Seyfert galaxy according to the SIMBAD database.</p></div><div class="wi-rest"></div>
