<div class="wi-intro"><p>NGC 191A (also PGC 2332, IC 1563, MCG -2-2-76 of ARP 127) is a lenticular galaxy in the constellation Cetus.</p></div><div class="wi-rest"><h2>Supernova</h2><p>One supernova has been observed in NGC 191A. SN 2006ej (Type Ia, mag. 16.4) was discovered by Lick Observatory Supernova Search (LOSS) on 23 August 2006.</p></div>
