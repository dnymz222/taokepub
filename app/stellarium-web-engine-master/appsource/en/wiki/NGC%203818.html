<div class="wi-intro"><p>NGC 3818 is an elliptical galaxy in the constellation Virgo. It is at a distance of about 118 million light-years away from Earth. In the center of NGC 3818 lies a supermassive black hole. NGC 3818 was discovered by William Herschel on March 5, 1785.</p></div><div class="wi-rest"></div>
