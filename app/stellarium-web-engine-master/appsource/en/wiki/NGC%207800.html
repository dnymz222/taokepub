<div class="wi-intro"><p>NGC 7800 is an irregular galaxy located around 70 million light-years away in the constellation Pegasus. It was discovered on the 24th of December in 1783 by William Herschel. NGC 7800 is not known to have an active galactic nucleus, and is not known to have much star-forming regions.</p></div><div class="wi-rest"></div>
