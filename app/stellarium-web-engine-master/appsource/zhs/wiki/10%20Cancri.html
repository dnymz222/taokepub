<div class="wi-intro"><p>水位增六（巨蟹座Mu2）是一颗单独的黄色恒星，位置在黄道星座的巨蟹座内。它是肉眼可见的恒星，视星等+5.30等，依据从地球测得的周年视差42.94毫角秒，这颗恒星与太阳的距离是76光年。水位增六将在60万年后，以最接近的4.9 pc（16 ly）距离掠过太阳。 估计它的年龄是56亿年，它已演化成G型次巨星，类型为C2IV。。它的质量是1.2倍太阳质量，和1.8倍的太阳半径 。 水位增六有相对较高的金属量 – 天文学家所谓的金属是除了氢和氦之外的其他元素，比太阳的丰度高出29% 。它的辐射量 太阳亮度的3.45倍3.45，表面的有效温度是5,809k。</p></div><div class="wi-rest"></div>
