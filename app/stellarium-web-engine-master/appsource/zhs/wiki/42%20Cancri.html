<div class="wi-intro"><p>积尸增二也称为巨蟹座42，是在黄道星座巨蟹座的一颗恒星 。其视星等为6.83，比肉眼可见的正常下限更暗。根据视差，这颗恒星距离太阳约616光年，并且以+35公里/秒的径向速度进一步漂移。积尸增二是鬼宿星团（NGC 2632）的成员之一 。 这颗恒星的恒星分类是A7 III，匹配处于巨星阶段的A型星。然而，这可能是对主序星恒星的错误分类。它也被归类为光谱联星，然而没有发表轨道元素。估计积尸增二的年龄为6亿300万年，并且以195公里/秒的投影转速快速旋转。这颗恒星的质量是太阳的2.39倍，半径是太阳的4.2倍。它正以7,607K的有效温度 ，从其光球层辐射的亮度是太阳光度的51.5倍。</p></div><div class="wi-rest"></div>
