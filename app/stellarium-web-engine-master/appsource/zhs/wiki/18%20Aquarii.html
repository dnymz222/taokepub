<div class="wi-intro"><p>天垒城六（宝瓶座18，18 Aquarii）是在天球赤道上的星座，宝瓶座的一颗发出黄白色光的巨大恒星。宝瓶座18的名称来自英国天文学家约翰·佛兰斯蒂德在1712年首度发表的佛氏命名法。这颗恒星的视星等为5.49等，因此肉眼难以看见，它与地球的距离约为154光年（47秒差距）。 这是一颗F-型主序星，光谱类型为F0V。估计它的年龄为4亿8,000万岁，并有很高的自转率，投影自转速度高达每秒138公里。它的质量是太阳质量的1.54倍，来自有效温度7,194K的光球表面辐射量是太阳光度的11.8倍。</p></div><div class="wi-rest"></div>
