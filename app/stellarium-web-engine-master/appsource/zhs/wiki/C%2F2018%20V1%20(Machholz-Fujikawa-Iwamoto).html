<div class="wi-intro"><p>C/2018 V1（梅克贺兹-藤川-岩本，Machholz-Fujikawa-Iwamoto）是一颗轨道为抛物线的彗星，它于2018年11月7日被唐纳德·梅克赫兹发现，并将于2018年12月3日通过近日点。据估计，从11月中旬至12月中旬的星等亮度在8至10等之间。</p></div><div class="wi-rest"><h2>发现历史</h2><p>共有三位业馀天文学家发现这颗新彗星：唐纳德·梅克赫兹在美国亚利桑那州，藤川繁久与岩本雅之在日本分别发现。这三位业馀天文学家观测的结果，产生的彗星名字是梅克贺兹-藤川-岩本。 在美国的梅克贺兹使用的是18.5英寸的反射式望远镜 。</p><h2>相关条目</h2><p>抛物线彗星列表</p></div>
