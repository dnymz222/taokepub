<div class="wi-intro"><p>NGC 4889，也称为科德韦尔35，是一个分类为E-4的超巨椭圆星系，是后发星系团中最亮的星系，和在后发座中的科德韦尔天体。它的星等是+11.4等，天球赤道座标的位置是赤经13h00.1m，赤纬+27°59'。它的位置接近肉眼可见的后发座β星 (光谱：G-型)，星系NGC 4874 (后发座星系团的另一个星系)，和银河北极，至地球的距离大约是3亿800万光年。这个星系团主体的退行速度大约是7000公里/秒，而NGC 4889本身的退行速度是6495公里/秒。星系中心的超大质量黑洞，估计有210亿倍太阳质量。</p></div><div class="wi-rest"><h2>注解</h2></div>
