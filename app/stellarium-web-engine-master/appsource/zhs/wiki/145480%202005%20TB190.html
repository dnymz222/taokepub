<div class="wi-intro"><p>小行星145480（2005 TB190）是一颗海王星外天体（TNO），绝对星等为4.4等。</p></div><div class="wi-rest"><h2>轨道</h2><p>小行星145480被深度黄道巡天（DES）归类为独立天体，因为它的轨道似乎超出与海王星之间显著的引力交互作用。然而，如果海王星向外迁移，那么就会有一段时间海王星的偏心率更高。小行星145480的远日点位于104个天文单位。 2007年，Emel’yanenko和Kiseleva的模拟显示，小行星145480与海王星发生4:1共振的可能性不到1%。 小行星145480曾在七次冲被观测到202次。小行星145480于2017年1月到达近日点。2005年发现前观测纪录可以追溯到2001年11月。</p></div>
