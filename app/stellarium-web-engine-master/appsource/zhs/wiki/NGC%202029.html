<div class="wi-intro"><p>NGC 2029，即ESO 56-EN156，是位于剑鱼座的发射星云，并且是大麦哲伦星系的一部份。NGC 2029和NGC 2032、NGC 2035以及NGC 2040都是由星云和恒星组成的复合体的一部份。NGC 2029由天文学家詹姆士·敦洛普发现于1826年9月27日。NGC 2029的视星等为12.29，视直径2.25角分。 NGC 2029和NGC 2030在天球上的座标在赫歇尔父子的星云和星团总表与之后修订并使用至今的NGC天体表中是颠倒的。原本编号GC 2029的NGC 2030是内部嵌入一个星团的独立星云，在天球上位于NGC 2029北方1.5度距离。</p></div><div class="wi-rest"></div>
