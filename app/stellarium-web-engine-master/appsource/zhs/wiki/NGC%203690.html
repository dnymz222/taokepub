<div class="wi-intro"><p>阿普 299 (也称为IC 694和NGC 3690) 是一对在大熊座内距离地球大约1亿3千4百万光年远的星系。 IC 694是主要的星系，而NGC 3690是附属的星系，它们都是有棒不规则星系。 在阿普 299发生碰撞之后，迅速的在星系内引发了恒星诞生，并且已经发现了6颗超新星 (SN 1992bu、SN 1993G、SN 1998T、SN 1999D 4颗在NGC 3690内，SN 1990al和SN 2005U在IC 694内)。</p></div><div class="wi-rest"><h2>相关条目</h2><p>触须星系 双鼠星系 涡状星系</p></div>
