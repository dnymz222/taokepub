<div class="wi-intro"><p>丹尼尔彗星（33P/Daniel）是一颗周期彗星，由美国纽泽西州普林斯顿大学哈尔斯特德天文台扎克厄斯·丹尼尔（Zaccheus Daniel）于1909年12月7日发现，估计星等为9等。丹尼尔彗星彗核直径估计为2.6公里。 在丹尼尔彗星被发现之后，科学家曾预测1916年、1923年和1930年的回归，但每次都失准。 1937年1月31日，静冈县岛田市清水真一根据东京广瀬秀雄计算出的新轨道后，再次成功发现丹尼尔彗星。 此后1957年至1971年间的回归都成功被观测到。 自首次发现以来，丹尼尔彗星由于多次与木星近距离接触，轨道周期稳步增加。</p></div><div class="wi-rest"></div>
