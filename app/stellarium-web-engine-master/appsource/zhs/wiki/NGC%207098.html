<div class="wi-intro"><p>NGC 7098是一个双重棒旋星系 ，距离地球约9500万光年，天球上位于南极座 。NGC 7098的直径推测为152400光年。该星系由天文学家约翰·赫歇尔发现于1835年9月22日。</p></div><div class="wi-rest"><h2>概要</h2><p>NGC 7098最明显的特征就是他的特殊棒状结构。它的棒状结构像拥有非常突出且接近直线的柄状宽椭圆形物体。在棒状结构的周围发现了由4个紧密缠绕的旋臂组成的内环。在内环以外区域中可明确被观察到的外环则似乎是因为两个旋臂的包围而组成。这两个环结构似乎都受到新恒星形成的影响。然而，在NGC 7098的核心区域则没有新恒星形成，观测结果显示这是该区域缺乏尘埃所导致。</p></div>
