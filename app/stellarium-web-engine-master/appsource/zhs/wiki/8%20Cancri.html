<div class="wi-intro"><p>水位三也称为巨蟹座8，是在黄道星座巨蟹座的一颗白色调的恒星。它的视星等为+5.14，这表明在适当的观看条件下，肉眼可以看到这颗黯淡的恒星。根据其每年15.20mas的视差偏移，确定到这颗恒星的距离大约是215光年。+21公里/秒的径向速度表明它正在远离太阳。 这是一颗A型主序星，其恒星分类为A1V。这是一颗年轻的恒星，估计年龄只有1亿4400万年，并且具有173公里/秒的投影旋转速度的高自旋率。水位三的质量是2.37倍的太阳质量，和从光球层以10,352K的有效温度 辐射出36.6倍太阳光度。</p></div><div class="wi-rest"></div>
