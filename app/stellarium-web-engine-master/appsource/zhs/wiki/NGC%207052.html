<div class="wi-intro"><p>NGC 7052是一个位于狐狸座的椭圆星系。该星系由威廉·赫歇尔发现于1784年，距离地球约1.91亿光年。天文学家在该星系中心发现质量大约是</p><p>3.70</p><p>− 1.50</p><p>+ 2.60</p><p>{\displaystyle 3.70_{-1.50}^{+2.60}}</p><p>亿倍太阳质量的超大质量黑洞。该黑洞外围的气体与尘埃盘质量大约是太阳的300万倍。 NGC 7052还是个无限电波源，但中心喷流并不垂直银河盘面。这可能是因为NGC 7052曾经和邻近星系碰撞过。</p></div><div class="wi-rest"></div>
