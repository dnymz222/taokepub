<div class="wi-intro"><p>天大将军二，或称为英仙座φ（Phi Persei、φ Persei、 φ Per），是一颗位于英仙座的 B2Vpe 恒星（Be星），视星等4等。距离地球约716光年。因为它在天球上附近的亮星不多，且它距离仙后座、仙女座较近，反而远离英仙座主要恒星之故，约翰·佛兰斯蒂德编号时并未将天大将军二编号。</p></div><div class="wi-rest"><h2>恒星状况</h2><p>天大将军二是由光谱类型 B2 的视星等4.01蓝色主序星和一颗B型次矮星组成的联星系统。主星的半径是太阳的9.3倍。天大将军二也是一颗在光度和光谱中快速变化的变星。 天大将军二在之后被编号为仙女座54（54 Andromedae）。</p></div>
