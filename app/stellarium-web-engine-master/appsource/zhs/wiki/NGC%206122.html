<div class="wi-intro"><p>NGC 6122是位于星座北冕座的螺旋星系，距离约48,400万光年。NGC 6122是由天文学家纪尧姆·比古尔当于1886年5月6日发现的，其直径为211,000光年。NGC 6122没有太多的恒星形成，也没有活动星系核。 到目前为止，NGC 6122只是一颗超新星SN 2003ge的宿主星系。天文学家蒂姆·帕克特（英语：Tim Puckett）和亚利克斯·朗格西斯（英语：Alex Langoussis）于2003年6月21日发现了它。它位于星系核心以西8.8角秒，以北0.1角秒处。这颗超新星是Ia型。</p></div><div class="wi-rest"></div>
