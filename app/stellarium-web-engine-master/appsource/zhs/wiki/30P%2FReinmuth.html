<div class="wi-intro"><p>30P/雷睦斯彗星也称为雷睦斯一号彗星，是卡尔·雷睦斯在1928年2月22日于太阳系发现的一颗周期彗星。</p></div><div class="wi-rest"><h2>观测史</h2><p>最初计算的轨道周期为25年，但最后修订为7年，并且被怀疑是自从1915年就失踪的69P/泰勒彗星。经由乔治·范·比斯布鲁克进一步的计算，才确认这是一颗新发现的彗星。. 1935年出现时并不利于观测，这颗彗星在1937年接近木星，使近日点的距离和轨道周期增加。 由于误判，错过了1942年的回归，但后续的每次回归都被观测到。</p><h2>物理性质</h2><p>估计这颗彗星的彗核直径约为7.8公里。</p></div>
