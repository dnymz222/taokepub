<div class="wi-intro"><p>NGC 7020是一个棒状透镜状星系，位于孔雀座，距离地球约1亿4千万光年。天文学家约翰·赫歇尔发现于1836年8月31日发现NGC 7020。</p></div><div class="wi-rest"><h2>性质</h2><p>NGC 7020有一个巨大外环，围绕著内侧明亮的六边形区域，该区域包含一个内环，可能还有一条棒旋。外环与星系内测的六边形区域完全分离，特征为无数絮状螺旋。外还的估计直径为110,000光年 (33.6 kpc)。该环比星系的其他部分更加多节且更偏蓝色，显示星系最近发生恒星形成的位置。 该星系似乎不含电离气体，这对于早期型星系来说相当普遍。</p></div>
