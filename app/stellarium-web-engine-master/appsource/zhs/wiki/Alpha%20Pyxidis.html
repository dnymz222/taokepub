<div class="wi-intro"><p>罗盘座α，又名CD-32 5651，HD 74575、SAO 199546、HR 3468，是罗盘座的一颗恒星，视星等为3.68，位于银经254.99，银纬5.77，其B1900.0坐标为赤经8h 39m 34.4s，赤纬-32° 5.77′ 33″。这个恒星虽然只是一个4等的暗星，但实际上这个恒星距离远至850光年，是一个相当大的蓝色巨星。其光谱分类为B1.5III。它的绝对星等约为-3.39，在可见光波段比太阳要亮1908倍大，因此它的生命将十分短暂，最后会成为一个壮丽的超新星。</p></div><div class="wi-rest"></div>
