<div class="wi-intro"><p>NGC 4414 是后发座的一个螺旋星系，距离地球6200万光年。超新星SN 1974G是目前在NGC 4414内第一颗被发现的超新星。 1995年，哈伯太空望远镜拍摄了NGC 4414星系的影像，是确定星系距离的主要任务之一。1999年，哈伯太空望远镜执行哈伯遗产计画的一部分，再次拍摄了该星系的影像，协助天文学家研究造父变星。由于年轻恒星的不断形成，NGC 4414外臂呈现蓝色，并包含一个可能的亮蓝变星，其绝对星等为−10等。</p></div><div class="wi-rest"><h2>超新星</h2><p>2013年6月7日， Ciabattari, Mazzoni, Donati, Petroni在NGC4414发现一颗Ⅱ型超新星SN2013df。</p></div>
