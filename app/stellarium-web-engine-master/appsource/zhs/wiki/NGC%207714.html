<div class="wi-intro"><p>NGC 7714是位于双鱼座的一个螺旋星系。它相对于宇宙微波背景的速度为2430±26 km/s，对应的哈伯距离为116.9 ±8.31百万光年（35.85 ± 2.54 Mpc）。此外，五次非红移测量得出的距离为92.24±8.69百万光年（28.280±2.664 Mpc）。NGC 7714由英国天文学家约翰·赫歇尔于1830年9月18日发现。 NGC 7714和NGC 7715是交互作用星系。这对星系包含在赫顿·阿普的《特殊星系图集》，列为阿普284。NGC 7714似乎是一个高度扭曲的螺旋星系，可能是一个棒旋星系。NGC 7715 的类型尚不确定，可能是边缘螺旋星系或不规则星系。</p></div><div class="wi-rest"></div>
