<div class="wi-intro"><p>羽林军一（宝瓶座29，29 Aquarii ）是在天球赤道上的星座宝瓶座的一对联星。29 Aquarii是佛氏命名法赋予的名称；它还是一颗变星，依变星命名法称为宝瓶座DX。这两颗恒星的轨道平面接近视线的方向，因而形成大陵五型变星。系统中的主星是一颗A型主序星，类型为A2V；它的伴星是颗巨星，类型为 K0III。两者互绕的轨道周期为0.94501日。 这对联星的变异是在1965年首度被德国班贝格Remeis-Observatory的W. Strohmeier注意到。稍后，他发现变异是因为联星中的主星被伴星遮蔽造成的。</p></div><div class="wi-rest"></div>
