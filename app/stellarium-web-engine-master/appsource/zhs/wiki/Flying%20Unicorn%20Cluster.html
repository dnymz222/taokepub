<div class="wi-intro"><p>NGC 6709是赤道星座天鹰座中，位于恒星天市左垣六（也称为“吴越”，天鹰座ζ）西南约5°处的一个疏散星团。它位于银河系的中心方向距离地球3,510光年。 该星团的川普勒分类为IV 2 m，被认为是中等丰富拥有305颗恒星成员。它的年龄大约是1亿4100万年；与昴宿星团差不多。NGC 6709的核半径为2.2 ly（0.68 pc），潮汐半径为26.4 ly（8.08 pc）。它包含两颗Be星，且其中一颗是壳层星。有一颗成员是红巨星的候选者。 1984年11月13日傍晚，大卫·李维（英语：David H. Levy）在距离这个星团不到一度之处发现了他的第一颗彗星。</p></div><div class="wi-rest"><h2>图集</h2></div>
