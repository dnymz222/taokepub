<div class="wi-intro"><p>鲸鱼座κ2 （κ2 Ceti）是位于天球赤道星座鲸鱼座的一颗孤独的黄巨星。它的视星等为5.66，虽然微弱但在足够黑暗的场所仍可用裸眼看见。基于从地球上观测的恒星视差为10.11mas的，它距离太阳约为320 光年。</p></div><div class="wi-rest"><h2>术语</h2><p>鲸鱼座κ2 曾经被称为金牛座g2。</p><h2>特点</h2><p>这是一颗演化中的G型巨星，恒星分类为G8III。它是水平分支上的红群聚恒星，这表明它正在其核心通过氦融合产生能量。这颗恒星的质量是太阳的2.46倍，并且已经膨胀到太阳半径的8.2倍。在5,007k的有效温度下，它从光球发出的辐射是太阳光度的42倍。</p></div>
