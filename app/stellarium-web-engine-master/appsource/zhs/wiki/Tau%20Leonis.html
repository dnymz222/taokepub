<div class="wi-intro"><p>明堂一（τ Leo）是黄道星座狮子座中的一颗恒星。因为它位于黄道附近，所以它会被月球掩蔽，发生月掩星的事件。它的视星等为5.00，其亮度足以用肉眼看到。使用视差测量值估计到这颗恒星的距离是560光年。它以− 9公里/秒的径向速度朝向太阳移动。 这是颗G型的巨星，恒星分类为G8IIIa ，现时位于赫罗图的红巨星分支。它的质量约为太阳质量的390%。这颗恒星比太阳年轻得多，年龄约为1.9亿年。做为一颗演化的巨星，它已经膨胀到约太阳半径的25倍，辐射量是太阳光度的330倍。外大气层的有效温度为4910K。</p></div><div class="wi-rest"></div>
