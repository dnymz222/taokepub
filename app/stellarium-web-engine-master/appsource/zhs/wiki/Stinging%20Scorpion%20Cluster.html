<div class="wi-intro"><p>NGC 2451 是在船尾座的一个疏散星团，天球座标为赤经7时45.4分，赤纬-14度58分，视觉观测大小约45角分，亮度约2.8视星等。早在1654年之前就已经被乔瓦尼·巴皮斯塔·霍迪纳发现，约翰·赫歇尔在1835年也记录了它。在1994年，它被怀疑其实是位在相同视线方向上的两个疏散星团。1996年此一怀疑得到证实，这两个疏散星团分别标示为NGC 2451A和NGC 2451B，与地球的距离分别是600光年和1,200光年。 星团内的最亮星是弧矢三，是一个3.6等橘色巨星。</p></div><div class="wi-rest"></div>
