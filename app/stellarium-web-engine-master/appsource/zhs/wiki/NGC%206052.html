<div class="wi-intro"><p>NGC 6052是一对正在碰撞中的星系，在天球上位于武仙座，距离地球约4亿光年 。该星系由威廉·赫歇尔发现余1784年6月11日。NGC天体表的编辑者约翰·路易·埃米尔·德雷耳形容该天体是“微弱、相当大、不规则圆形” 。 NGC 6052的两个成员星系分别被编号为NGC 6052A和NGC 6052B。而这两个星系被彼此的重力相互吸引、碰撞等交互作用。NGC 6052已经到达星系合并的的晚期阶段，两个成员星系已经无法明确分辨。 NGC 6052内曾经发现无线电波相当强烈的超新星SN 1982aa。</p></div><div class="wi-rest"><h2>图集</h2></div>
