<div class="wi-intro"><p>玉夫座ι，拉丁化为Iota Sculptoris，缩写为ι Scl，是在南天星座玉夫座的一颗孤独的恒星。它是一个昏暗的橙色光点，视星等为5.18，肉眼可见。根据视差，这颗恒星距离太阳约336光年，并且正以+21公里/秒的径向速度远离中。 这是一颗衰老的巨星，其恒星分类为K0III，现时位于赫罗图的红巨星分支。它的质量是太阳质量的2.9倍，并且已经膨胀到太阳半径的12倍。这颗恒星在5020 K的有效温度下，从其扩大的光球层辐射出97倍于太阳的光度。这颗恒星的座标位置是 X射线发射的来源，因此最有可能（99.4%的几率）是X射线的发射源。</p></div><div class="wi-rest"></div>
