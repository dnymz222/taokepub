<div class="wi-intro"><p>轩辕十三 （η Leo，η Leonis）是在星座狮子座的一颗4等星，距离地球大约1,270 光年远。</p></div><div class="wi-rest"><h2>性能</h2><p>轩辕十三是一颗白色的超巨星，恒星分类为A0Ib。自1943年以来，这颗恒星的光谱一直是其它恒星分类的标准参考星之一。虽然它的视星等是3.5，使它成为一颗肉眼可见相对暗淡的恒星，但它的光度几乎是太阳的20,000倍，绝对星等为 -5.60。 依巴谷卫星天体测量数据估计，轩辕十三距离地球大约390秒差距，或1,270光年。 轩辕十三显然是一个多星系统，但成员的数量和它们的分离是未确定的。</p></div>
