<div class="wi-intro"><p>小鬼星云是英国天文学家威廉·赫歇尔在蛇夫座发现的一个行星状星云 。 浑圆如行星的形状使得星云的亮度相对微弱，而且行星状星云与行星也没有关系。它们是类太阳恒星在生命结束时被创造出来的，它是频死恒星抛置太空的外壳，而恒星的核心裸露出成为白矮星。在星云的中心附近可以看见转换成的白矮星，其辐射出的强烈紫外线和能量使膨胀的星云发光。星云主环的直径约为1光年，被电离的氧、氢和氮原子分别发射出蓝色、绿色和红色的光。 不要将小鬼星云和鬼星云（幽灵星云，Sh2-136）或鬼头星云（NGC 2080）混淆在一起。</p></div><div class="wi-rest"></div>
