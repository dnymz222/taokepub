<div class="wi-intro"><p>昴宿五是金牛座中的疏散星团昴宿星团内的一颗恒星，与地球的距离大约是440光年。 昴宿五是颗蓝白色的B型次巨星，平均视星等为+4.14。理查德·辛革莱·阿伦描述这颗恒星像是清澈的紫白色。他的亮度是太阳的630倍，表面温度14,000K，质量大约是4.5太阳质量，半径超过太阳的4倍。他是一颗变星，分类为仙王β型变星，光度的变化只有0.01等。 包围著昴宿五的是玛亚的星云，这是目前正在经过昴宿星团的星云的一部份，在昴宿五周围是这个星云最明亮的区域，在IC星表中的序号是IC 349。</p></div><div class="wi-rest"></div>
