<div class="wi-intro"><p>轸（zhěn）宿（xiù）一（γ Crv、乌鸦座γ）是乌鸦座之中最亮的恒星。 乌鸦座γ的英语传统命名为“Gienah”来自于阿拉伯语الجناح الغراب اليمن（al-janāħ al-ghirāb al-yaman），意为“乌鸦的右翼”，但是现代的星图却把它当作乌鸦的左翼。其英文名Gienah与天鹅座ε完全相同。Gienah Corvi（或Gienah Ghurab）可以用来区分天鹅座的Gienah（天津九）。</p></div><div class="wi-rest"><h2>占星术</h2><p>在占星术里，乌鸦座γ的效果相似于火星和土星，宣扬著贪念和诡计。它是其中一颗中世纪时的伯利恒星，有著乌鸦状的卡巴拉符号。</p></div>
