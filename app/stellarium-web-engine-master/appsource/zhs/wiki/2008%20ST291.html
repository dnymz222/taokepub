<div class="wi-intro"><p>小行星528381（2008 ST291）是一颗太阳系海王星外天体，绝对星等为4.3等，2008 ST291可能是矮行星。</p></div><div class="wi-rest"><h2>轨道</h2><p>2008 ST291于1954年通过近日点，目前距离太阳59天文单位。2016年，22008 ST291将距离太阳超过60天文单位。天文学家已经观测过3次22008 ST291冲。</p><h2>物理性质</h2><p>因为天文学家尚无法得知2008 ST291的反射率，所以2008 ST291大小仍不清楚，直径可能介于370公里至820公里之间。</p></div>
