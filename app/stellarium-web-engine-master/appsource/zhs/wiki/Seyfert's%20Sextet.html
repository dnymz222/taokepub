<div class="wi-intro"><p>西佛六重星系（Seyfert's Sextet）是个距离1.9亿光年远的星系集团 ，位置在巨蛇座的头部。这个集团看起来有六个星系，但是其中一个是背景的星系，而另一个"星系"实际上只是其中一个星系分离了的一部分。引力的相互作用在这些星系之间应该已经进行了数亿年的时间。最后，这些星系将合并成为一个椭圆星系。</p></div><div class="wi-rest"><h2>发现</h2><p>这个星系集团是卡尔·基南·西佛使用范德堡大学巴纳德天文台的摄影干片发现的。当这个结果在1951年首度发表时，这个集团是当时被辨认出的最紧密集团。</p><h2>成员</h2><h2>相关条目</h2><p>罗伯特四重星系 史蒂芬五重星系</p></div>
