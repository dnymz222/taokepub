<div class="wi-intro"><p>NGC 6047是位于星座武仙座 的一个椭圆星系，距离地球约4.3亿光年。它是天文学家路易斯·斯威夫特在1886年6月27日发现的。NGC 6047是武仙座星系团的成员。 NGC 6047具有独特的星系形态，这表明它最近经历了一次合并。它可能与距离约320,000 ly（97 kpc）的NGC 6045有著交互作用 。NGC 6047有两条无线电喷流，和分类为FR I 电波星系，喷流似乎具有Z形结构。</p></div><div class="wi-rest"><h2>相关条目</h2><p>NGC天体列表 (6000-6999) NGC 1128</p></div>
