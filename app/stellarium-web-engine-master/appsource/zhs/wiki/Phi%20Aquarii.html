<div class="wi-intro"><p>垒壁阵八（英语：Phi Aquarii，是源自拉丁化拜耳命名法名称。）是在天球赤道星座宝瓶座中的联星系统。它的综合视星等为+4.223，因此肉眼可见。视差量测表明，它与地球的距离大致为 222光年（68秒差距），并且它以+2.5km/s的径向速度漂移得更远。它位于黄道以南1.05度，因此受到月掩星的影响，会被月球遮蔽。 它是一个光谱联星的恒星系统，估计周期为2,500天。主星是一颗红巨星，恒星分类为M1.5 III。这颗恒星的质量与太阳相同，但其演化使外层已经膨胀到太阳的35倍大。在3715K的表面有效温度下，它的辐射亮度是太阳的208倍，使其具有M型恒星的红色色调。</p></div><div class="wi-rest"></div>
