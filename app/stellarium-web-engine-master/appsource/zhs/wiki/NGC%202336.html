<div class="wi-intro"><p>NGC 2336是位于鹿豹座的棒旋星系，距离地球约1亿光年，直径约为20万光年。威廉·坦普尔于1876年发现该星系。</p></div><div class="wi-rest"><h2>超新星</h2><p>天文学家在NGC 2336内曾发现一颗超新星SN 1987L。它于1987年8月16日由美国业馀天文学家James Dana Patchick使用自制的17.5"杜布森反射式望远镜发现，视星等为14.2等。这颗超新星是由史蒂夫·H·卢卡斯(Steve H. Lucas) 发起的“太阳搜索(SUNSEARCH)”计划发现的。威廉·赫歇耳望远镜于1987年10月20日至21日进行的光谱分析判断它是一颗Ia型超新星。</p></div>
