<div class="wi-intro"><p>NGC 6624是一个位于人马座的球状星团，由威廉·赫歇尔发现于1784年6月24日。该星团视星等7.6</p></div><div class="wi-rest"><h2>概要</h2><p>NGC 6624内已经发现6颗脉冲星，第一颗被发现的是PSR J1823-3021A。该星团内还有轨道周期只有11.5分的低质量X射线联星 4U 1820-30。 NGC 6624在小型望远镜中是一个模糊的点，如果是双筒望远镜则看起来像恒星。它的核心区域恒星分布相当紧密，在天球上的位置是在箕宿二东南方0.8度，距离银心约3800光年（1170秒差距）。</p></div>
