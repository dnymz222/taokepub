<div class="wi-intro"><p>红蜘蛛星云（Red Spider Nebula），即 NGC 6537，是一个位于人马座的行星状星云。</p></div><div class="wi-rest"><h2>概要</h2><p>红蜘蛛星云中心的白矮星会产生温度高达10000 K的强烈恒星风，速度达到每秒300公里，产生振幅1千亿公里高的震波。这样的恒星风使星云的形状成为独特的蜘蛛形，并且使星云扩张。 星云内白矮星表面温度预估高达50万K，超过太阳表面温度的50倍，是目前已知表面温度最高的恒星之一。 大规模的震波塑造了双瓣状的星云达到约3000光年远的距离。 红蜘蛛星云和地球的距离目前仍未精确测定，部分天文学家估计约4000光年。</p></div>
