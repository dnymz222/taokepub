<div class="wi-intro"><p>天鹰座η (η Aql / η Aquilae)是在天鹰座的一颗恒星，中国星名天桴四，属牛宿，星官天桴。在过去，它曾经是安迪努斯座(已废弃的星座)的成员。 这是一颗造父变星，视星等以7.176641天为周期在3.6 至 4.4等之间变化。与仙王座δ、双子座ζ和天龙座β，都是肉眼可见的造父变星，也就是说，这些恒星不仅肉眼可见，而且变光的范围通过肉眼能够察觉。其他的一些造父变星，像是北极星，虽然亮度大但是光度的变化很小。 它与地球的距离大约1200光年，是一颗黄-白色的超巨星，发光度大约为太阳的3000倍，直径为太阳的60倍。</p></div><div class="wi-rest"><h2>位置</h2><p>这颗恒星在星座内的位置：</p></div>
