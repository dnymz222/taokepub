<div class="wi-intro"><p>周鼎一 （β Com / 后发座β）是后发座的一颗主序矮星，距离地球约30光年。希腊字母的β通常标示星座中视星等第二亮的星，但是周鼎一比后发座α（+5.22等）还亮。 这颗恒星与我们的太阳相似，只是还稍微大一点，绝对星等亮一点。观察色球活动的短期变化，认为这颗恒星经历著不同的自转，周期大约在11–13天。这颗恒星表面的活动周期是16.6年，相较于太阳的11年也较长些，但它可能也有9.6年的第二个活动周期。曾经一度认为这颗恒星有颗光谱伴星，但是精准的径向速度测量排除了这个可能，不仅没有侦测到行星环绕著它，也没有证据显示有尘埃盘的存在。</p></div><div class="wi-rest"></div>
