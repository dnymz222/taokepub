<div class="wi-intro"><p>NGC 2366是位于鹿豹座的一个不规则星系。 天文学家对NGC 2366及NGC 2363的各种成分感到困惑。NGC 2366南端是大而明亮的HII区域，称为马克仁 71 (Mrk 71)。 在马克仁 71西边是另一个矮星系NGC 2363，它正在与NGC 2366 相互作用。H.G. Corwin指出有两个星系且清楚地有两个NGC编号：“我们只需要习惯将HII 区域称为马克仁 71（或其他名称），因为它不是我们这些年来一直误认的NGC 2363。” 在马克仁71 的区域内，有两个超星团 (SSC)，分别命名为“A”和“B”或“Knot A”和“Knot B”。</p></div><div class="wi-rest"></div>
