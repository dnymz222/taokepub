<div class="wi-intro"><p>小狮座11 是一个位于小狮座的恒星系统，距离地球36.6光年。它是肉眼可见的暗淡黄色恒星，视星等为5.54。该系统正以+14.4公里/秒的日心径向速度远离地球。它具有相对较高的自行，以每年0.764弧秒的速度穿越天球。 主星是一颗G 型主序星，恒星分类为G8V，质量略小于太阳，亮度略低于太阳。这是一颗猎犬座RS型变星，其光度在18天内变化了0.033星等。与太阳相比，它的质量比氦大的元素多一倍多——天文学家称其为恒星的金属丰度。 有一个伴星，一颗视星等14的红矮星，比主星暗得多。这对天体的轨道周期为201年，偏心率为0.88。</p></div><div class="wi-rest"></div>
