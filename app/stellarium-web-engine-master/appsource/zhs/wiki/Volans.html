<div class="wi-intro"><p>飞鱼座（Volans）是荷兰人彼得·德克斯宗·凯泽和弗雷德里克·德·豪特曼于1595年-1597年观测和创立的12个南天星座之一,1603年被包括在拜耳恒星命名中。该星座部分恒星属于中国近南极星区飞鱼星官。</p></div><div class="wi-rest"><h2>重要主星</h2><p>来源：The Bright Star Catalogue, 5th Revised Ed., The Hipparcos Catalogue, ESA SP-1200</p><h2>深空天体</h2><p>NGC 2442/2443：中间螺旋星系 NGC 2397：螺旋星系</p></div>
