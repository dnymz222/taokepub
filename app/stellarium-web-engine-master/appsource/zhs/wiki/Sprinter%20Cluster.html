<div class="wi-intro"><p>NGC 2516或钻石星团是尼可拉·路易·拉卡伊于1751-52年间在南天船底座发现的疏散星团。 由于这些恒星有很高的清晰度，因此被称为钻石星团。这个星团本身在黑暗的夜空中用裸眼就能看见，但是使用双筒望远镜的效果会更好。钻石星团包含两颗美丽的5等红巨星和三对双星，但至少需要一只小的望远镜才能分辨这些双星。 NGC 2516和最近在蛇夫座附近发现的星团Mamajek 2有相似的年龄和金属量。最近，E. Jilinksi和合作者提出了动力学上的证据，认为这两个恒星集团都是在1亿3,500万年前经由相同的恒星产生过程形成的。</p></div><div class="wi-rest"></div>
