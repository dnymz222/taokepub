<div class="wi-intro"><p>NGC 4488是一个透镜星系距离大约6,000光年，位置在星座室女座。天文学家威廉·赫雪尔 1785年12月28日发现这个星系。NGC 4488是室女座星系团的成员。</p></div><div class="wi-rest"><h2>结构</h2><p>NGC 4488类似于星系LEDA 74886，有一个不寻常的矩形结构。这个星系没有内盘。它还有两个对角相对的臂，表明NGC 4488与另一个星系有引力相互作用。</p><h2>相关条目</h2><p>NGC天体列表 (4000-4999) LEDA 74886 特殊星系</p></div>
