<div class="wi-intro"><p>糠（蛇夫座45）是在天球赤道星座蛇夫座的一颗孤独、紧邻著南侧天蝎座边界的恒星。它有拜耳名称“蛇夫座d”，而“蛇夫座45”是它的佛氏名称。在过去，它被命名为望远镜座θ。这个天体肉眼可见，是一颗微弱的黄白色恒星，视星等为4.28等。根据恒星视差，它距离太阳约111.6 光年。这颗恒星正以+38公里/秒的径向速度远离地球。 这个天体的恒星分类为F5III-IV，对F型恒星与光度进行匹配，显示出次巨星和巨星的混合特征。它是颗年龄12亿，质量是1.7太阳质量，和半径是3.2倍太阳半径。这颗恒星正从其光球以6,7505 K的有效温度辐射出的光度是19倍太阳光度。它以65公里/秒的预计转速旋转。</p></div><div class="wi-rest"></div>
