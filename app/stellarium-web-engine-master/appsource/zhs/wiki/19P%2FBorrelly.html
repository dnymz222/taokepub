<div class="wi-intro"><p>包瑞利彗星（正式名称是19P／包瑞利彗星）是一颗周期彗星，深太空1号太空船曾经拜访的彗星。</p></div><div class="wi-rest"><h2>发现</h2><p>这颗彗星是在阿方斯·路易·尼古拉斯·包瑞利（Alphonse Louis Nicolas Borrelly）在法国马赛进行定期的彗星巡视时，在1904年12月28日发现的。</p><h2>彗核参数</h2><p>直径：8×4 公里</p><h2>深太空1号飞越</h2><p>在2001年9月21日，发射至太空中进行新仪器测试的，并且为此而延长了任务时间的深太空1号太空船执行了飞掠包瑞利彗星的任务，并且给了科学家意想不到的奖励。尽管协助测量的定向系统已经失效，深太空1号还是将当时最佳的彗星影像和资料传送回地球。</p></div>
