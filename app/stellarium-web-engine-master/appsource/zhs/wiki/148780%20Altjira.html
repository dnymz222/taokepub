<div class="wi-intro"><p>小行星148780（148780 Altjira），又称寰神星，是一个传统古柏带天体的三重或接触双重系统。副星比主星大，约246公里对221公里。寰神星的光变曲线相当平坦（Δmag&lt;0.10），显示这是一个“表面均匀的类球体”。 卫星的轨道参数如下：半主轴，9904 ± 56 公里；周期，139.561 ± 0.047 天；偏心率，0.3445 ± 0.0045；倾角，35.19 ± 0.19°（逆行）。系统总质量约为4 × 1018公斤。 该小行星以阿兰达族的创世神阿尔吉拉（Altjira）命名，阿尔吉拉在梦创时代创造了地球，之后便隐居在天空中。 寰神星可能是一个尚未解决的阶层式三重系统。</p></div><div class="wi-rest"></div>
