<div class="wi-intro"><p>天纪一（ξ CrB）是在北天星座北冕座的一对联星系统。它是肉眼可见的，综合视星等为4.85。基于从地球上看每年偏移17.78mas的视差 ，它距离太阳约183光年。 截至 2009 年，该联星对的角距离为91MAS，位置角为139.4°。较亮的成员，主星Aa，是一颗演化的K型巨星，恒星分类为K0 III。它是一颗红群聚恒星，通过氦融合在其核心产生能量。估计这颗恒星的质量是太阳质量的2.36倍，并且已经膨胀到太阳半径的8倍。它在4,853K的有效温度下，从其光球辐射的光度是太阳光度的36倍。</p></div><div class="wi-rest"></div>
