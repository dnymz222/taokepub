<div class="wi-intro"><p>113P/史匹塔勒彗星是太阳系内的一颗周期彗星，于1890年11月17日被在奥地利维也纳的鲁道夫·费迪南·史匹塔勒发现，当时他正试图观察 C/1890 V1（Comet Zona）。 史匹塔勒和乔治·玛丽·塞尔、J.F.坦南特、J.R. 欣德一起依据观测计算这颗彗星的轨道，尽管预测在1897年会回归，但仍然失去了踪迹，并且在之后的几十年内都未能寻获。 在1993年10月24日，这颗彗星被美国亚利桑那州基特峰天文台的詹姆斯·弗农·斯科悌重新发现，并且经由布莱恩·马斯登将1890年和1994年的出现连系在一起，确认是113P/史匹塔勒彗星。</p></div><div class="wi-rest"></div>
