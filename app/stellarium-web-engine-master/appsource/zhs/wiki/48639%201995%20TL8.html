<div class="wi-intro"><p>小行星48639（1995 TL8）是太阳系最外层的双海王星外天体。阿里安娜·格里森于1995年发现小行星48639，直径约176公里。小行星48639的卫星直径80公里，暂时编号为S/2002 (48639) 1，于2002年11月9日被发现。</p></div><div class="wi-rest"><h2>发现</h2><p>1995年10月15日，小行星48639由美国天文学家阿里安娜·格里森（Arianna Gleason）在亚利桑那州图森附近的基特峰国家天文台进行太空监视调查时发现。 小行星48639目前被归类为第一颗发现的离散盘天体，比小行星15874早了近一年。</p></div>
