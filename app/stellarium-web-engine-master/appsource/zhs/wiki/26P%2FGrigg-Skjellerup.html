<div class="wi-intro"><p>葛里格-斯杰勒鲁普彗星（26P/Grigg–Skjellerup）是一颗周期彗星，乔托号探测器于1992年7月观测过，距离仅有200公里，但未拍照，因为一些仪器在探测哈雷彗星后受损。 这颗彗星于1902年由纽西兰的约翰·葛里格（John Grigg）发现，并于1922年由澳大利亚约翰·弗朗西斯·斯基勒鲁普（John Francis Skjellerup）在其下一次出现时重新发现，他当时在南非生活和工作了大约20年，是南非天文学会的创始人之一。 1982年，阿雷西博天文台使用雷达探测过这颗彗星。 葛里格-斯杰勒鲁普彗星是船尾座π流星雨的母天体。彗核的直径估计为2.6公里。</p></div><div class="wi-rest"></div>
