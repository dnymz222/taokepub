<div class="wi-intro"><p>宗正增二（蛇夫座σ），来自“σ Ophiuchi”的拉丁化，是在天球赤道星座蛇夫座的一颗单独的巨大橘色恒星。它的视星等为4.31等，其亮度足以用肉眼看见微弱的光点。从地球上看，每年3.62mas的视差偏移，提供的距离估计大约900光年。它正以-28公里/秒的径向速度靠近太阳。 这是一颗K型恒星，已经演化为巨星，其恒星分类为K2 III。维特科夫斯基（Wittkowski）等人（2017）认为它的光度为II-III，表明它位于巨星和超巨星之间的过渡区。它的质量大约是太阳的5到9倍，半径是太阳的100倍。这颗恒星的在4,130 K的有效温度下，从其涨大的光球发出的辐射是太阳的2,600倍。</p></div><div class="wi-rest"></div>
