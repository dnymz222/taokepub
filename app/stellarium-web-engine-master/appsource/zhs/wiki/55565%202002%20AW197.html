<div class="wi-intro"><p>小行星55565（55565 Aya）是外海王星天体（TNO），以阿卡德神话中的黎明女神阿亚（Aya）命名。它在2002年被米高·E·布朗等人发现，被分类为QB1天体。 它是矮行星候选者，并且它的位置靠近古柏断崖。</p></div><div class="wi-rest"><h2>尺寸</h2><p>由史匹哲太空望远镜观测的热辐射估计的直径是700±50公里，反照率大约是0.17±0.03.。</p><h3>表面</h3><p>ESO分析光谱显示出偏向红色并且没有水冰的迹象 (对照夸奥尔也是偏红的)，建议有有机物质 (参见颜色和对光谱类型的比较。)</p></div>
