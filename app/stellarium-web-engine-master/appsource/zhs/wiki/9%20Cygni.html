<div class="wi-intro"><p>天鹅座9（9 Cygni）是在北天星座天鹅座的一对联星。天鹅座9的名称是来自佛兰斯蒂德命名法。这两颗恒星的总星等为5.39，因此在良好的观看条件下可以用肉眼直接看到。根据盖亚任务量测得到的视差表明，这颗恒星的距离约为590光年（182秒差距）。 天鹅座9的两颗恒星分类分别是G型巨星和A型星。这两颗恒星的质量都是太阳的两倍多。它们的轨道半长轴 为0.030 arcseconds，每4.56年绕轨道一次，。然而，离心率高达0.82。主星是一颗红群聚的巨星，位于其核心融合氦的水平分支冷端的恒星。伴星的演化已经开始离开主序带；因此它有时被归类为巨星，有时被归类为主序星 。</p></div><div class="wi-rest"><h2>相关条目</h2><p>光谱联星</p></div>
