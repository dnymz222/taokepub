<div class="wi-intro"><p>串田－村松彗星，官方命名为147P/串田－村松（147P/Kushida-Muramatsu），是一颗公转轨道周期为7.43年的彗星。</p></div><div class="wi-rest"><h2>发现</h2><p>日本天文学家串田嘉男、村松修于1993年发现串田－村松彗星，是一颗准希尔达群彗星。</p><h2>性质</h2><p>串田－村松彗星轨道为椭圆形，半径为5.70亿公里(3.807天文单位)、离心率为0.2775。串田－村松彗星公转轨道周期为7.43年，与木星轨道共震为3:2。串田－村松彗星曾在1949年与1962年被木星捕捉，成为其卫星，也是已知第五颗被木星捕捉的彗星。 串田－村松彗星核心直径推测为450公尺。</p></div>
