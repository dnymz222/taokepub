<div class="wi-intro"><p>NGC 3195 是位于蝘蜓座的一个行星状星云，它是天空中所有明亮的行星状星云中最偏南边，而在北半球的所有观测者都不能完整的看见它。约翰·赫歇尔在1835年最早发现它，它的外观略呈椭圆，大小为40×35角秒，使用口径10.5公分的望远镜，在低倍率下就能看见这个行星状星云。 光谱显示NGC 3195正以17公里/秒的速度朝向地球接近，而这个星云膨胀的速率约是40公里/秒。星云中心恒星的星等 &gt;15.3V或16.1B，肉眼观察当然看不见。目前估计的距离是1,700秒差距。</p></div><div class="wi-rest"><h2>相关条目</h2><p>NGC天体列表 行星状星云</p></div>
