<div class="wi-intro"><p>小行星120178（2003 OP32）是位于柯伊伯带的海王星外天体（TNO）。2003年7月26日，2003 OP32由米高·E·布朗、查德·特鲁希略和大卫·拉比诺维茨在加利福尼亚州帕洛玛山发现。</p></div><div class="wi-rest"><h2>性质</h2><p>根据妊神星族共同的红外线水冰吸收模式及轨道元素的聚集性，其他柯伊伯带天体，例如1995 SM55、(19308) 1996 TO66、(55636) 2002 TX300和(145453) 2005 RR433这些天体在可见光波段的光谱呈现中性色，显示其表面缺乏复杂的有机物，而关于妊神星表面的详细研究则显示了这一点。</p></div>
