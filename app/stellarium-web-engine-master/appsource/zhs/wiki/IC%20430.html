<div class="wi-intro"><p>猎户座V883（V883 Orionis）是一颗在天球上位于猎户座的原恒星。</p></div><div class="wi-rest"><h2>概要</h2><p>猎户座V883与天体IC 430（Haro 13A）有关联，而后者是天文学家吉列尔莫·哈罗在1952年时观测过的特殊Hα辐射天体。该恒星距离地球约1350光年（414秒差距），并且与猎户座大星云相关。 猎户座V883和许多原恒星一样周围有尘埃形成的星周盘环绕。恒星周围的雪线是恒星辐射量低到一定程度，让水冻结成冰的界线。该恒星周围的雪线已经在阿塔卡马大型毫米波/亚毫米波阵列（ALMA）的观测中成像。当恒星的辐射量升高时，雪线的边界将会距离恒星更远。</p><h2>图集</h2></div>
