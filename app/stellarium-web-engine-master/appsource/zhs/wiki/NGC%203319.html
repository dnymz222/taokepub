<div class="wi-intro"><p>NGC 3319是位于大熊座的一个棒旋星系。它于1788年2月3日倍威廉·赫歇尔发现。它富含气体，但是中心缺乏核球 。 NGC 3319是相对孤立的。它与NGC 3104、NGC 3184和NGC 3198组成一个小星系群。NGC 3198可能是离它最近的星系，相距约420万光年（130万秒差距）。 NGC 3319是一个西佛星系，在2018年确认它有著活跃星系核(AGN) 。NGC 3319是中等质量黑洞的候选宿主。黑洞质量小于100,000M☉的概率为84%。</p></div><div class="wi-rest"><h2>图集</h2></div>
