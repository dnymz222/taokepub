<div class="wi-intro"><p>NGC 2440是银河系中的一个行星状星云，其中心恒星编号HD62166，可能是已知最高温的白矮星。位于船尾座。 该星云由威廉·赫歇尔于1790年3月4日发现。他描述该星云是一个“漂亮，且有相当亮度，无法很好识别的行星状星云”。该恒星距离太阳约1.23 kpc，或4000光年。</p></div><div class="wi-rest"><h2>HD 62166</h2><p>HD 62166是一个表面温度异常高的白矮星，其温度达到200,000 K，而光度是太阳的1100倍。这颗白矮星大约是0.6倍太阳质量和0.028倍太阳半径，视星等是 18.9。</p></div>
