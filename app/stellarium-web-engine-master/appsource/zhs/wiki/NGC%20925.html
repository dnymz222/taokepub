<div class="wi-intro"><p>NGC 925 是一个棒旋星系，位于三角座内，距离我们约3,000万光年。该星系的形态分类为 SB(s)d，具有棒状结构和松散缠绕的无环旋臂。向南的旋臂比北臂强，后者看起来像絮状，不太连贯。短棒从星系中心伸出，都是恒星形成处。这两种特征：一条主要旋臂和短棒，都是麦哲伦螺旋星系的典型特征。 NGC 925是NGC 1023星系群的成员，受到NGC 1023引力束缚的星系群。然而，最近的成员距离NGC 925至少有650,000光年（200,000pc）。有一个1,000万太阳质量 (M☉) 的中性氢云附著在NGC 925上，目前不确定这是一个卫星矮星系、过去潮汐相互作用的残馀物还是原始气体云。</p></div><div class="wi-rest"></div>
