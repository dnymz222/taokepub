<div class="wi-intro"><p>'斯米尔诺娃-切尔尼赫彗星（74P/Smirnova–Chernykh）是一颗周期彗星。斯米尔诺娃-切尔尼赫彗星符合恩克型彗星的定义，并且是一颗准希尔达彗星。 1975年3月下旬，塔玛拉·米哈伊洛夫娜·斯米尔诺娃（Tamara Mikhajlovna Smirnova）在检查克里米亚天文台的曝光照片时发现了它。在发现影像中，这颗彗​​星的视星等约为15等。在发现的那一年，彗星在1975年8月6日到达近日点。 这颗彗星曾于1967年被拍摄到，但被认为是一颗小行星，并命名为1967 EU。 斯米尔诺娃-切尔尼赫彗星的直径估计为4.46公里，目前轨道完全位于木星轨道内。</p></div><div class="wi-rest"></div>
