<div class="wi-intro"><p>M25，也称为IC 4725，是一个由恒星组成，在南天人马座的疏散星团。尚-菲利浦·德·歇索在1745年对这个星团进行了第一次有记录的观测，查尔斯·梅西耶1764年将它收录进他的星云天体清单。这个星团位于模糊的特征附近，因此有一条暗带通过中心附近。 M25距离地球大约2,000光年，年龄约为6,760万岁。这个星团在空间的维度大约是13光年，估计质量是1,937 M☉，其中大约24%是星际物质。星团成员中的人马座U是一颗分类为造父变星的变星，还有两颗红巨星，且其中一颗是联星系统。</p></div><div class="wi-rest"><h2>相关条目</h2><p>梅西耶天体 梅西耶天体列表 深空天体 人马座</p></div>
