<div class="wi-intro"><p>NGC 7822是一个位于仙王座的年轻恒星形成复合区域。这个复合区域环绕被称为 Sharpless 171 的辐射发射线区域和年轻的星团 Berkeley 59。该附河区域距离地球约800到1000秒差距，并且它内部的恒星年龄不超过数百万年。这个复合体内包含了距离太阳约1000秒差距的联星BD+66 1673，该食双星系统的其中一颗恒星是表面温度高达45000 K，光度大约是太阳10万倍的光谱 O5V 恒星，是表面温度最高的恒星之一。该恒星是照亮该星云的其中一个光源，并且形塑了该复合体著名的类似创生之柱的结构－象鼻管。</p></div><div class="wi-rest"></div>
