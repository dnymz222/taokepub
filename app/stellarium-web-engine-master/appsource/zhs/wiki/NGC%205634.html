<div class="wi-intro"><p>NGC 5634是室女座的一个球状星团，距离地球约82,200光年（25.2千秒差距）。 NGC 5634的视星等约为10等，直径为4或5角分。NGC 5634夏普力-索耶集中度分类法等级为IV，表示NGC 5634具有中等丰富浓度。右上方附近的恒星是视星等11等的UCAC2 29844847。另外还有一颗明亮的橘色巨星HD 127119，距离星团约1.3角分。 NGC 5634很可能曾经是人马座矮椭球星系的成员。该星系本身正被来自银河系的潮汐力拉开，类似于NGC 5634被从矮椭球星系中拉开的情况。</p></div><div class="wi-rest"></div>
