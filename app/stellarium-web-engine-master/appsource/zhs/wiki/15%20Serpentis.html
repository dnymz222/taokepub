<div class="wi-intro"><p>周增五（巨蛇座τ3，来自τ3 Serpentis 的拉丁化），是在赤道星座巨蛇座的一颗巨星。其视星等约为 6.11，在良好观测条件下，此亮度足以肉眼隐约可见。根据视差测量，这颗恒星的距离约为358光年，并且它正以−22公里/秒的日心径向速度向我们漂移。 这颗恒星的恒星分类为G8III:，与一颗G型巨星匹配。然而，后尾的冒号“：”显示分类存在一定的不确定性。周增五（巨蛇座τ3）约有5亿年历史，质量是太阳的2.7倍，半径已经扩展为太阳半径的9.7倍，并且从4,864K有效温度的光球层辐射出47倍太阳光度。</p></div><div class="wi-rest"></div>
