<div class="wi-intro"><p>NGC 3115，也称为纺锤星系或科德韦尔53，是位于六分仪座的一个 透镜星系。这个星系是威廉·赫歇尔在1787年2月22日发现的，与地球的距离大约是3,200万光年，它的大小数倍于银河系。 在1992年，夏威夷大学的John Kormendy和密西根大学的Douglas Richstone宣称在这个星系观测到超大质量黑洞，它是当时发现最大的 (20亿太阳质量)。这个星系的恒星看起来都是老年或是不活跃的，黑洞的生长也已经停止。</p></div><div class="wi-rest"><h2>相关条目</h2><p>NGC 5866 - 另一个经常会与纺锤星系做比较的透镜星系。</p></div>
