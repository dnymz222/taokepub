<div class="wi-intro"><p>扶筐增二，即天龙座42（42 Draconis），又名BD+65 1271，HD 170693、SAO 17888、HR 6945，是天龙座的一颗恒星，视星等为4.82，位于银经95.42，银纬27.13，其B1900.0坐标为赤经18h 25m 41.8s，赤纬+65° 27.13′ 6″。该恒星是一颗光谱类型 K 型的巨星，距离地球317光年。天龙座42的质量与太阳类似，但半径是太阳的22倍。它的金属量只有太阳的35%，年龄大约是94.9亿年。2009年在天龙座42旁发现一颗系外行星。</p></div><div class="wi-rest"><h2>行星系统</h2></div>
