<div class="wi-intro"><p>双子座υ，又名BD+27 1424，HD 60522、SAO 79533、HR 2905，是双子座的一颗恒星，视星等为4.06，位于银经192.6，银纬21.06，其B1900.0坐标为赤经7h 29m 45.6s，赤纬+27° 21.06′ 5″。</p></div><div class="wi-rest"><h2>中文星名</h2><p>五诸侯（Five Feudal Kings）即是五位地方的诸侯。井宿的五诸侯是太微垣中的五诸侯翻版。 井宿的五诸侯出现在《晋书·天文志》：“五诸侯五星，在东井北，主刺举，戒不虞。又曰理阴阳，察得失。亦曰主帝心。一曰帝师，二曰帝友，三曰三公，四曰博士，五曰太史，此五者常为帝定疑议。” 因此“五诸侯四”是五位地方诸侯中的博士。</p></div>
