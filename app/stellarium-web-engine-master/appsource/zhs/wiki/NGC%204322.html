<div class="wi-intro"><p>NGC 4323是位于后发座中，距离约5,250万光年远的一个透镜或矮椭圆星系。这个星系是天文学家威廉·坦普尔在1882年发现的，是室女座星系团的成员之一。</p></div><div class="wi-rest"><h2>与M100的交互作用</h2><p>NGC 4323 是M100的同伴，它位于 78,000 ly（24 kpc）之遥。这两个星系似乎是交互作用星系，M100的旋转曲线，其电离氢区的不对称就是证据之一，并且有一个暗淡的光桥连接它与NGC 4323 。然而，因为NGC 4323仅是一个小星系，与M100又有很大的距离相隔著，Knapen等人认为这两个星系没有交互作用。</p><h2>相关条目</h2><p>NGC天体列表 (4000-4999) NGC 4328</p></div>
