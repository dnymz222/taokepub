<div class="wi-intro"><p>天乳增一（巨蛇座25，巨蛇座A2）是在星座巨蛇座西侧，“巨蛇首”的一个恒星系统。它的视星等为5.4等，肉眼隐约可见。 根据其视差，估计该系统的距离约为450光年（138秒差距）。</p><p>天乳增一是光谱联星，意即各分量距离过近，无法解析出各个成员，但其光谱中的周期性都卜勒位移显示出轨道运动。该系统由一颗热B型巨星以及一颗A型主序星组成。这两颗恒星每38.9日彼此绕行一次，轨道离心率为0.731。1996年，当分析“依巴谷”的资料时，发现该星是变星。主星是一颗慢脉动B型变星，使系统星等变化0.03等；因此于1999年被赋予变星编号“巨蛇座PT”。</p></div><div class="wi-rest"></div>
