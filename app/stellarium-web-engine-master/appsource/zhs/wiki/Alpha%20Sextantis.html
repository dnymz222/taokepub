<div class="wi-intro"><p>天相二（六分仪座α）是在赤道上的星座，六分仪座最亮的星。它的视星等为4.49，在黑暗的天空里能以裸眼直接看见。根据视差测量得到这颗恒星的距离大约是280光年。它位于天球赤道南方不到四分之一度的距离，因此非正式的被认为是颗"赤道星"；在1900年，它在赤道北方7弧分。由于地球转轴倾角的变化结果，它于1923年12月越过天球赤道进入南半球的天空。 这是一颗演化成为A型巨星的恒星，光谱类型为A0III。它的质量大约是太阳的3倍，半径是太阳的4.5倍。元素的丰度与太阳相似。 来自外大气层9,984K的有效温度上，辐射是太阳的120倍。天相二的年龄大约是2亿9500万年，投影自转速度为每秒21公里。</p></div><div class="wi-rest"></div>
