<div class="wi-intro"><p>NGC 6553是人马座的一个球状星团。 NGC 6553的视星等约为8等，视直径为8.2角分。NGC 6553的夏普力-索耶集中度分类法等级为XI，意味著恒星浓度即使在中心也非常松散；NGC 6553拥有亮度为20等或更暗的恒星。NGC 6553位于礁湖星云东南方向略高于一度的位置。 NGC 6553相对富含金属，与常见的球状星团不同，并且有证据表明NGC 6553经历过至少两个恒星形成时期。由于恒星形成记录复杂，星团中的恒星成分各不相同，最显著的是钠和铝的浓度。 NGC 6553的成分与NGC 6528非常相似，显示其起源于类似的环境。</p></div><div class="wi-rest"></div>
