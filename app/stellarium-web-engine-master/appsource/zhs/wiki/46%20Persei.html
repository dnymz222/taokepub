<div class="wi-intro"><p>卷舌三，即英仙座ξ（Xi Persei，ξ Per），是一个位于英仙座的恒星。它的固有名 Menkib（或 Menchib、Menkhib）来自阿拉伯语，意思是昴宿星团的肩膀。卷舌三的视星等为+4.042，属于光谱类型 O7.5III 的蓝巨星，距离地球约1800光年。</p></div><div class="wi-rest"><h2>性质</h2><p>卷舌三的可见光光度是太阳的13500倍。如果将它辐射的紫外线一起算入，它的总热辐射将高达太阳的33万倍。 卷舌三的质量是太阳的40倍，表面有效温度是37,000 K，是肉眼可见温度最高的恒星之一。</p></div>
