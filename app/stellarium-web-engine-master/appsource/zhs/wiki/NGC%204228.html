<div class="wi-intro"><p>NGC 4214是距离地球约1000万光年的矮有棒不规则星系，在天球上位于猎犬座。</p></div><div class="wi-rest"><h2>特征</h2><p>NGC 4214的体积与亮度都高于小麦哲伦星系，同时也是星暴星系。该星系最大的两个恒星形成区域（NGC 4214-I与NGC 4214-II）位于星系核心。其中的NGC 4214-I包含一个拥有大量沃尔夫–拉叶星的超星团；NGC 4214-II则较年轻（少于300万年），内部包含数个星团与星协。 NGC 4214内部拥有两个较古老的超星团，年龄都约2亿年，质量分别是26万与150万倍太阳质量。</p></div>
