<div class="wi-intro"><p>NGC 6540是位于人马座的一个球状星团，距离银河系中心约4.66°。 1784年5月24日，德裔英国天文学家威廉·赫歇尔用一台18.7英寸望远镜发现了NGC 6540，他将该星团描述为“相当暗淡，不大，弯曲延伸，易于分辨”。NGC 6540的视星等为9.3等，角直径约9.5角分。 NGC 6540星团距离太阳12000光年（3700千秒差距），距离银河系中心14000光年（4400秒差距）。NGC 6540被确认为球状星团之前，最初被认为是一个疏散星团。NGC 6540星团包含一个不确定类型的特殊X射线源。</p></div><div class="wi-rest"></div>
