<div class="wi-intro"><p>武仙座14，也称为格利泽 614，中国的传统名称为七公增十三，是一颗位于武仙座的橙矮星，距离地球约59光年，但裸眼不易看见这颗星。 在1998年，这颗恒星被发现有一颗行星（武仙座14b），以4.8年的周期，在椭圆轨道上环绕著恒星。在2006年，疑似发现了第二颗行星，命名为武仙座14c 。这颗新行星的参数还不清楚，但可能与内侧的行星有4:1的共振，轨道周期19年，距离6.9天文单位。</p></div><div class="wi-rest"><h2>相关条目</h2><p>大熊座47 武仙座恒星列表 确定存在的太阳系外行星列表</p></div>
