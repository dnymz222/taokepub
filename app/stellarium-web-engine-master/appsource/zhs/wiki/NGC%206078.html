<div class="wi-intro"><p>NGC 6078是位于星座武仙座的一个椭圆星系。它相对于宇宙微波背景的速度为9,459 ± 44公里/秒，这对应于哈伯距离的139.52 ± 9.81 Mpc（〜4.55亿光年）。 它是法国天文学家爱德华·斯特凡在1876年6月21日发现的。 非常靠近 NGC 6078 的是星系 PGC 57459和SDSS J161206.68+141210.3。 在NGC 6078曾观察到一颗超新星SN 2011dv（Ia超新星，视星等16.2），是义大利超新星搜索计划于2011年6月28日发现。</p></div><div class="wi-rest"><h2>相关条目</h2><p>NGC天体列表 (6000-6999)</p></div>
