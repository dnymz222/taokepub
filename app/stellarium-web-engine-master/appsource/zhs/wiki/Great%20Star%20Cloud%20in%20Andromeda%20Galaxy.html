<div class="wi-intro"><p>NGC 206是仙女座的一个疏散星团，它是仙女座星系的一部分，位于该星系的一个有许多星云的旋臂上。NGC 206是一个非常年轻的星团，组成它的恒星多数是非常明亮的蓝巨星。通过研究NGC 206的造父变星的周期和亮度天文学家得以非常精确地确定仙女座星系离地球的距离。</p><p>维基共享资源上的相关多媒体资源：NGC 206</p><p>NED – NGC 206 SEDS – NGC 206 SIMBAD – NGC 206 VizieR – NGC 206 NGC 206 的详细照片（页面存档备份，存于互联网档案馆）</p></div><div class="wi-rest"></div>
