<div class="wi-intro"><p>天鹅座ω2，来自拉丁化的ω2 Cygni，是独立的拜耳名称，它是在北天星座天鹅座的一颗恒星；中文传统名称是天津增卅四。它的视星等为5.5等，在一个黑暗的夜晚，肉眼隐约可见。基于周年8.17mas的视差偏移，它位于距离太阳大约399光年的地方。在这个距离上，由于星际尘埃的消光，视星等减少了0.08等。 它是在渐近巨星支的一颗红巨星，恒星分类为M2III。尽管证据被认为是“可疑或错误的”，它仍是一颗可疑的变星。如果它确实是变星，其变异性很小，振幅为0.05等，时间尺度约为30天。这颗恒星有58.3%的几率是武仙座星流的成员。</p></div><div class="wi-rest"><h2>相关条目</h2><p>天津增卅五（天鹅座ω1）</p></div>
