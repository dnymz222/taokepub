<div class="wi-intro"><p>青丘七（长蛇座ο），又名CD-34 7610，HD 101431、SAO 202695、HR 4494，是长蛇座的一颗恒星，视星等为4.7，位于银经286.72，银纬25.87，其B1900.0坐标为赤经11h 35m 14.7s，赤纬-34° 25.87′ 25″。</p></div><div class="wi-rest"><h2>中国史书</h2><p>《晋书·天文志》：“青丘七星，在轸东南，蛮夷之国号。星明，则夷兵盛；动摇，夷兵为乱；守常，则吉。”意指“青丘”是反映中国外境外族的星宿，如果星群明朗，外族军队就会兴盛；相反，如果星群动摇不定，就代表外族军队会有内乱。</p></div>
