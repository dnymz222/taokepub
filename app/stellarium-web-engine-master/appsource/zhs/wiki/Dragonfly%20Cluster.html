<div class="wi-intro"><p>NGC 457，或称为猫头鹰星团（Owl Cluster）、ET星团（ET Cluster）、科德韦尔13（Caldwell 13），是位于仙后座的疏散星团，由威廉·赫歇尔发现于1787年，距离太阳约7900光年。她的年龄约2100万年。业馀天文学界常称该星团为“猫头鹰星团”、“克奇纳木偶星团”、“ET星团”（外观类似电影E.T.外星人中的外星人角色）、“滑雪星团”。 NGC 457有两颗较亮的恒星，分别是视星等5等的仙后座φ-1和7等的φ-2。该星团大约有150颗视星等12到15等的恒星。</p></div><div class="wi-rest"></div>
