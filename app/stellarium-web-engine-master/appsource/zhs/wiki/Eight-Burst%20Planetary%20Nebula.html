<div class="wi-intro"><p>NGC 3132，也称为八裂星云或南环状星云，是在船帆座内的一个明亮并且被广泛研究的行星状星云，从可以利用的分光镜数据，目前这个星云仍以每秒24公里的速度在膨胀中。 与地球的距离估计大约是550秒差距或是2,000光年。</p></div><div class="wi-rest"><h2>行星状星云核心（PNN）</h2><p>在NGC 3132朦胧的影像中显示有两颗紧密靠在一起的恒星，一颗的视星等是10等，另一颗是16等。行星状星云核心的中心可能是一颗比这两颗恒星更暗淡的白矮星。这颗炙热的中心恒星温度大约是100,000K，现在正吹散了外围的气体，并且发射出强烈的紫外线辐射激发出明亮的萤光。</p><h2>相关条目</h2><p>NGC天体列表 行星状星云列表</p></div>
