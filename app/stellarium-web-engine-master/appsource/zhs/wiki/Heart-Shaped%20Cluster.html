<div class="wi-intro"><p>M50或梅西耶50，也称为NGC 2323，是位于麒麟座的一个疏散星团。它可能在1711年之前就被卡西尼发现，梅西耶在1772年4月5日观测比拉彗星时，又再度独立发现它。它有时也被描述或心形或钝箭头。 M50距离地球大约2,900光年，虽然与大犬座OB1星协接近，但估计关系并不紧密。它的核心半径为5.9 ly（1.8 pc）， 范围为17.8 ly（5.46 pc）。这个星团有508个已确认成员和109个可能的成员；它们的总质量超过285 M☉，平均恒星密度是每立方秒差距1.3颗恒星。星团的历史大约有1.4亿年，有两颗大质量的白矮星和两颗特殊恒星。</p></div><div class="wi-rest"><h2>图集</h2><h2>参考资料和注解</h2></div>
