<div class="wi-intro"><p>NGC 5253是位于半人马座的一个不规则星系。此星系亦是已知在地球附近的蓝致密矮星系之一，距地球约一千一百万光年。它也被视为半人马座 A/M83星系团的一员。</p></div><div class="wi-rest"><h2>星系特点</h2><p>NGC 5253拥有相比起其他同类星系更多的尘埃及重元素，不过比起银河系这些一般星系还是很少。星系中心是活跃的恒星生成点，而在中心的星爆区则有一大量炽热和年轻的明亮恒星。不过，星系的光度却为炽热和混有尘埃的气体云所掩盖。大学物理学与天文学教授吉恩-特纳和他的同事对NGC 5253星系进行了详细的研究，发现NGC 5253拥有其数百个星团和一些年轻的星体，特别是还拥有大量的暗物质。</p></div>
