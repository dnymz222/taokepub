<div class="wi-intro"><p>NGC 2859位于小狮座，距离8,300万光年，是一个核心有棒状结构的透镜星系。在型态分类上是(R)SB(r)0+。依据佛科留斯分类法，此处的（R）表示这个星系的外围有一个突出的、分离的环，S表示它是透镜星系，B表示它有一个瓣状的棒形结构，这意味著它的末端变亮或变宽，并且还有一个微弱的与主棒几乎呈直角的次棒，（r）表示这些特征被一个看似弥漫的微弱内环包围著，0+表示有一个明确的物理结构，是缺少可见旋臂的类型。另外，在观测上还看到在它的东侧有一系列蓝色的结。 在它中心有一个超大质量黑洞，估计质量是1.05亿太阳质量。在分类上暂时被归类为过渡的T2:型。它没有活动的迹象。</p></div><div class="wi-rest"></div>
