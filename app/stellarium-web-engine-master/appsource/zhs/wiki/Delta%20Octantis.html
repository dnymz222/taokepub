<div class="wi-intro"><p>异雀五（南极座δ，拉丁化为Delta Octantis）是南极座的一颗恒星，视星等4.32，具有土星南极极星的盛名。它是颗K2III级的橙色巨星，质量是太阳的1.2倍，半径是太阳的25倍。这颗恒星的年龄与太阳相近，大约有43亿年的历史。</p></div><div class="wi-rest"><h2>命名</h2><p>在中国，将由欧洲引进的南半球星座融入中国的星官系统，命名为异雀（Yì Què），意思是异国情调的鸟，指由异雀五、天燕座ζ 、天燕座ι、天燕座β、天燕座γ、天燕座δ1、天燕座η、天燕座α和天燕座ε组成的星群。因此，南极座δ被称为异雀五 （Yì Què wǔ， 英语：奇國情調的第五顆星）。</p></div>
