<div class="wi-intro"><p>14P／沃夫彗星是太阳系内的一颗周期彗星。 马克斯·沃夫于1884年9月17日在德国的海德堡发现这颗彗星。稍后，在9月23日又有在苏格兰 阿伯丁的罗夫·科普兰（Dun Echt 天文台）发现这颗彗星，但未被证实。</p></div><div class="wi-rest"><h2>性质</h2><p>起初，这颗彗星的近日点是2.74天文单位，周期为8.84儒略年。但在1922年9月27日以0.125天文单位的距离掠过木星之后，近日点变为2.43天文单位，周期则变为8.28儒略年。目前所使用的数值则是在2005年8月13日再一次接近木星后的结果。但等到2041年3月10日这颗彗星再接近木星之后，轨道周期的参数又会与1925年至2000年间相似。</p></div>
