<div class="wi-intro"><p>NGC 2420是双子座的一个疏散星团。威廉·赫歇尔于1783年发现NGC 2420。NGC 2420星团约有20亿年历史，距离地球10,000光年。</p></div><div class="wi-rest"><h2>位置</h2><p>NGC 2420位于恒星北河三东南偏南约6.5度处，距离爱斯基摩星云东北偏东略超过2度。观察者透过低倍小型望远镜可以看到NGC 2420，看起来像均匀的幽灵光，向中心越来越亮，类似于无尾彗星，在33倍放大率下，可以瞥见一些单颗恒星。在更高的放大倍率下，星团分解成一个由单颗恒星组成的丰富的区域。NGC 2420收录在赫歇尔目录。</p></div>
