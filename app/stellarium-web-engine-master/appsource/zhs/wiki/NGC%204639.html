<div class="wi-intro"><p>NGC 4639是一个位于室女座的棒旋星系，距离地球约7000万光年，是室女座星系团的成员星系之一。该星系中心有超大质量黑洞存在。 NGC 4639同时也是一个低光度活动星系核的典型例子，分类上属于西佛1型星系。</p></div><div class="wi-rest"><h2>距离量测</h2><p>1990年6月天文学家在NGC 4639内发现Ia超新星SN 1990N。当时NGC 4639也是艾伦·桑德奇的团队使用造父变星进行距离量测最远的星系。桑德奇的团队量测SN 1990N的光度峰值后与其他邻近星系的Ia超新星光度峰值效正值做比较，确认Ia超新星量测是造父变星以外另一个可靠的宇宙距离量测工具，并且可量测距离较造父变星法远数百倍。</p></div>
