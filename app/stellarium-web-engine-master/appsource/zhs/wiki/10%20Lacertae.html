<div class="wi-intro"><p>蝎虎座10（10 Lac），中国传统名称车府增十一，是蝎虎座的一颗恒星，视星等为4.88，位于银经96.65，银纬-16.98。蝎虎座10距离地球约700秒差距（2,300光年），是蝎虎座OB1（Lacerta OB1）星协的成员。蝎虎座10是高温且大质量的O型主序星，光谱型O9V。它可能是仙王座β型变星。</p></div><div class="wi-rest"><h2>概要</h2><p>蝎虎座10是第一批被确认的O型恒星之一（与四渎增一），并且自20世纪初开始一直被视为摩根-肯那光谱分类法的分类定位点之一。具体来说，它是光谱O9V恒星的代表，是主序带上表面温度相对较低的O型恒星。 蝎虎座10有一个视星等8的伴星，在天球上距离约1角分。</p></div>
