<div class="wi-intro"><p>木星状星云（NGC 3242），也称为木魂星云或科德韦尔59，有时也被称为眼星云，是位于长蛇座的一个行星状星云。 威廉·赫歇尔在1785年2月7日发现这个星云，并且编目为H IV.27。约翰·赫歇尔于1830年代在南非好望角观察这个星云，并且将它命名为h 3248，而且将它列入1864年的一般目录中的GC 2102；在1888年，约翰·路易·埃米尔·德雷耳的星云和星团新总表中它成为NGC 3242。 人们可以轻松的使用业馀的望远镜看见它。大多数的观测者看见的颜色都是蓝绿色，大的望远镜可以很明确的区分出外面的晕。</p></div><div class="wi-rest"><h2>图集</h2><h2>相关条目</h2><p>NGC天体列表 行星状星云</p></div>
