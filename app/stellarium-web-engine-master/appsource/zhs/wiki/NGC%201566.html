<div class="wi-intro"><p>NGC 1566 是剑鱼座的一个中间螺旋星系。由詹姆士·丹露帕发现于1826年5月28日。该星系是剑鱼座星系团的重要成员星系，并且是其中亮度最高者该星系是已知最明亮的塞弗特星系之一。NGC 1566的绝对光度为3.7×1010 L☉，并且内部中性氢区（H I）质量达到1.4×1010 M☉。</p></div><div class="wi-rest"><h2>SN 2010el</h2><p>2010年6月19日，南非天文学家贝图·莫纳德在NGC 1566内，星系中心西方13角秒、南方22角秒处发现了视星等16等的超新星，天球座标04 19 58.83 -54 56 38.5。</p></div>
