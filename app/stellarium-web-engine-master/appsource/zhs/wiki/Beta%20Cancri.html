<div class="wi-intro"><p>柳宿增十 (β Cnc / β Cancri)是巨蟹座最亮的恒星，与地球的距离大约是290光年。它的固有名称是Tarf或Al Tarf (Altarf)，不清楚语源但很可能来自阿拉伯文的الطرف aṭ-ṭarf ("眼睛")或 طرفة aṭ-ṭarfah( 狮子的"一瞥")。 主要的成员，柳宿增十A，是一颗橘色的K-型巨星，视星等+3.50，绝对星等-1.25(目视)。它有一颗暗淡，14星等的伴星，柳宿增十B，与主星相距29角秒。</p></div><div class="wi-rest"><h2>相关条目</h2><p>在巨蟹座的恒星列表 K-型恒星 钡星</p></div>
