<div class="wi-intro"><p>蝘蜓座是南天深处的一个很暗的星座，位于船底座和南极座之间。</p></div><div class="wi-rest"><h2>星座神话</h2><p>荷兰探险家彼得·德克斯宗·凯泽和弗雷德里克·德·豪特曼所创，代表变色龙。</p><h2>深空天体</h2><p>蝘蜓座δ星：这是一个两子星相距很宽的微弱双星，用裸眼可以看见，通过双筒望远镜可以看的更为清楚。双星中比较明亮的子星叫δ1，它本身又是一颗双星，它的两子星相距很近。 NGC 3195：这是一个行星状星云，从地球看上去是一个蓝色的圆盘。中央星星等的+15.3，用小型望远镜是看不见它的。</p><h2>重要主星</h2><p>小斗Little Dipper（极9）</p></div>
