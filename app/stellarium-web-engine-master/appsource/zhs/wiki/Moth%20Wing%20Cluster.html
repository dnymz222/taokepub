<div class="wi-intro"><p>NGC 6281是位于天蝎座的一个疏散星团。它既不是梅西尔天体，也不是科德韦尔深空天体；但它是被排除在这两个星表之外，在天蝎座中最亮的天体之一。它的位置在尾宿一东边约2度，很容易以肉眼看见并观察。詹姆士·敦洛普描述这个星团是一条"非常明亮的恒星的曲线， 有许多星星混淆在一起"。约翰·赫歇尔后来描述这个集团为"非常明亮"和"非常富有" 。 这个星团的潮汐半径约为26 ly（8.0 pc），质量大约是214太阳质量 。它被归类为II2p型，在距离中心20角分内有55颗视星等13.5等或更亮的恒星，最亮的成员是9等星。总体而言，这个星团的集成视星等为5.4等。</p></div><div class="wi-rest"></div>
