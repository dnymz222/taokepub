<div class="wi-intro"><p>柠檬片星云，也称为IC 3568，是个距离地球约1,300秒差距（4,500光年）的行星状星云。它位于鹿豹座，距离北极星只有7.5度。它是个相对年轻的星云，核心的直径仅约0.4光年。柠檬片星云是已知星云中结构最简单的，在型态上几乎是完美的球形。它看起来非常类似柠檬，因而得名。这个星云的核心大多数是电离的氦，并且没有明显可见的结构。中心的恒星非常热和明亮，是渐近的红巨星，在业馀的望远镜下可以看出橘红色的色调。有个淡淡的星际尘埃晕围绕著星云。</p></div><div class="wi-rest"><h2>相关条目</h2><p>行星状星云</p></div>
