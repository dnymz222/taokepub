<div class="wi-intro"><p>NGC 3079是位于大熊座，距离5,000万光年的一个棒旋星系。这个星系的特征是在非常中心的位置形成一个有"气泡" （见右图）。</p></div><div class="wi-rest"><h2>中心气泡</h2><p>在NGC 3079中心的气泡被认为有3,000光年宽，并且从星系的盘面向上升起超过3,500光年。这个气泡被推测是大量恒星形成，引发爆发所形成的高速粒子流。目前的气泡流被认为是在一百万年前形成的，而且电脑的模拟显示气泡会周期性的形成，新的气泡大约每一千万年形成一次。</p><h2>相关条目</h2><p>阔边帽星系</p></div>
