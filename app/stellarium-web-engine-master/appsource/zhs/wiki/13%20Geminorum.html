<div class="wi-intro"><p>井宿一（μ Gem/双子座μ），英文名Tejat，是北天星座双子座的一颗恒星。</p></div><div class="wi-rest"><h2>特性</h2><p>井宿一的平均视星等为2.9，为双子座中第四亮的恒星。因为该星接近黄道，它可以被月球掩星。于依巴谷任务中的视差测量显示井宿一与地球的距离约为230光年(约71秒差距)。 井宿一是颗LB型慢不规则变星。其亮度在2.75等到3.02等间变化，变化周期为72日,长周期则为2000日。它是一颗属于恒星光谱M3 III的红巨星，表面温度约3,650K，代表着它比太阳更大，但表面温度却比太阳为低。该星目前在渐近巨星分支，产生能量的来源是环绕惰性碳氧核心的壳层氢氦聚变。</p></div>
