<div class="wi-intro"><p>水位一（小犬6 ，6 Canis Minoris）是赤道星座小犬座的一颗恒星，距离太阳大约570光年。它是一颗肉眼可见，黯淡的橙色恒星，视星等为+4.55等。这颗恒星正以日心点运动学−16.3 km/s 径向速度向地球靠近，它是属于天狼星超星系团的大熊座星流周边一个群的成员 这是一颗演化的巨星，恒星分类为K1 III.。它有轻度的钡异常，这可能表明这是一颗有白矮星伴星的联星系统。对可见分量的干涉量测-量测的角直径约为2.31±0.03 mas，估计其距离相当于约44倍太阳半径的物理半径。质量约为4 太阳质量，在4,370k的有效温度下，其扩大光球的辐射为太阳的761倍。</p></div><div class="wi-rest"></div>
