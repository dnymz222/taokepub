<div class="wi-intro"><p>NGC 185 是仙后座的一个矮椭圆星系，也是仙女座星系的卫星星系之一。</p></div><div class="wi-rest"><h2>距离</h2><p>至少有两种技术被用来测量NGC 185的距离。表面亮度波动距离测量技术根据星系外观的颗粒度来估计星系的距离，使用此技术测量到到NGC 185的距离为2.08±0.15Mly(640 ± 50 kpc)。然而因为NGC 185足够接近地球，可以使用红巨星分支尖端方法来估计其距离。使用此技术估计NGC 185 的距离为2.02 ± 0.2Mly(620 ± 60 kpc)。</p></div>
