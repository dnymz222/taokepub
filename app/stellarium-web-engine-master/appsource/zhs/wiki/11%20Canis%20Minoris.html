<div class="wi-intro"><p>水位二也称为小犬座11是在赤道星座小犬座 的一颗恒星，距离太阳约313光年。它是一颗肉眼可见的微弱白色恒星，视星等为+5.25。它正以相对于日心+28公里/秒的径向速度远离地球，大约235万年前的距离在157光年以内。 这是一颗A型主序星，其恒星分类为A1Vnn，其中的符号“n”表示由于快速旋转而导致的（非常）“模糊”线。然而，Gray和Garrison（1987）发现了一个A0.5Ivnn的分类，这将与一颗演化的次巨星相匹配。这是一颗未知类型的可疑变星。它的年龄为1亿4900万年，质量是2.23倍太阳质量，半径是2.5倍太阳半径。它以9,972K的有效温度从光球层辐射65倍的太阳光度</p></div><div class="wi-rest"></div>
