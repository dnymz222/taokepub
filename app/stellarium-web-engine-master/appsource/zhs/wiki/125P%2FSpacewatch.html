<div class="wi-intro"><p>125P/太空监视（125P/Spacewatch）是一颗木星族周期彗星。1991年9月8日，汤姆·赫雷尔斯使用基特峰国家天文台的0.91公尺太空监视望远镜发现彗星。125P/太空监视是第一颗使用CCD发现的彗星，也是迄今为止发现的最暗的彗星。 125P/太空监视彗星核心直径1.6公里。</p></div><div class="wi-rest"><h2>观测历史</h2><p>1991年9月8日，汤姆·赫雷尔斯透过基特峰国家天文台 0.91 公尺太空监视望远镜拍摄的照片发现了这颗彗星，它本质上是一个恒星物体，视星等为21等，彗尾长度超过5角分。布莱恩·马斯登计算出了一条抛物线轨道和一条椭圆轨道，椭圆轨道的轨道周期为5.58年，近日点为1990年12月18日。</p></div>
