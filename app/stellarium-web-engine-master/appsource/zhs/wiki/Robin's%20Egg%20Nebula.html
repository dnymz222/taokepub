<div class="wi-intro"><p>NGC 1360，或称为知更鸟蛋星云（Robin's Egg Nebula），是一个位于天炉座的行星状星云。该星云因为光谱中强烈的OIII谱线而被归类为行星状星云。一般相信该星云的前身星在最后崩溃成为行星状星云以前，它在可见光影像中偏红色的物质已经完全被抛出。它的表面光度略低于IC 2003。 该系统的中心恒星自1977年起就被怀疑是联星，但直到2017 年才得到证实。中心源由一颗低质量的O型星和一颗白矮星组成，质量分别为0.555 M☉和0.679 M☉。 NGC 1360由德国天文学家弗里德里希·奥古斯特·特奥多尔·温尼克发现。</p></div><div class="wi-rest"><h2>图集</h2></div>
