<div class="wi-intro"><p>氐宿增二十一（巨蛇座11）是在星座巨蛇座的一颗恒星，距离太阳271 光年。它的拜耳名称是巨蛇座A1（A1 Serpentis），巨蛇座11是佛兰斯蒂德命名法赋予的名称。这个天体的视星等为5.497，肉眼可见为一颗淡淡的橘色恒星。它以-16公里/秒的日心径向速度朝向地球接近中。 这是一颗老化的巨星，恒星分类为K0III，是已经耗尽核心氢并膨胀的恒星。它是位于水平分支]上的一个红群聚的巨星， 这表示它正在透过其核心的氦融合产生能量。氐宿增二十一的年龄约27.5亿年，质量为1.3太阳质量，和半径是太阳半径的11倍。从其放大的光球层，以4,767 K的有效温度，辐射出50倍的太阳光度 。</p></div><div class="wi-rest"></div>
