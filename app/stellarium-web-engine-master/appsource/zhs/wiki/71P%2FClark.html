<div class="wi-intro"><p>克拉克彗星（71P/Clark）是一颗周期彗星，轨道周期为5.5年。 1973年6月9日，麦克·克拉克（Michael Clark）在纽西兰约翰山大学天文台（Mount John University Observatory）发现克拉克彗星，其亮度为视星等13等。随后，1978年、1984年、1989年、1995年、2000年、2006年、2011年和2017年，克拉克彗星都被观测到 and 2017.。 根据哈伯太空望远镜的观测，克拉克彗星彗核半径为0.68±0.04公里，几何反照率为0.04；而凯克天文台的观测显示彗核半径为1.305公里。</p></div><div class="wi-rest"></div>
