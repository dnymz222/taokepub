<div class="wi-intro"><p>天鹅座ω1，来自拉丁化的ω1 Cygni，是独立的拜耳名称，它是在北天星座天鹅座的一颗恒星；中文传统名称是天津增卅五。它的视星等为4.94，以肉眼即可看见。基于2.59mas的周年视差偏移，估计它与太阳的距离大约为1,260 光年。相对于它的邻居，这颗恒星的本动速度为25.7±2.2 km/s。 这是一颗有点演化的B型次巨星，恒星分类为B2.5 IV。Telting及其同事在2006年发表的一项高解析度光谱学研究中指出，在其光谱中发现了规则的脉动，因此他们对此高度自信，它是一颗仙王座β型变星。它的亮度每1.137天不规则地变化0.034星等。</p></div><div class="wi-rest"><h2>相关条目</h2><p>天津增卅四（天鹅座ω2）</p></div>
