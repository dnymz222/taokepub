<div class="wi-intro"><p>阿普 271（Arp 271）是一对体积相似的交互作用螺旋星系NGC 5426和NGC 5427的合称，位于室女座，于1785年由威廉·赫歇尔发现。目前仍未确认这两个星系未来是否会相撞，不过可确定的是两者在未来数千万年内会持续有交互作用。结果就是两者互相重力吸引造成许多新恒星形成，并且两者之间已经有一串恒星将两个星系连结。这两个星系距离地球约9000万光年，并且两个星系宽度横跨13万光年。一般认为约30亿年后，目前距离地球约250万光年的仙女座星系将会和我们的银河系相撞，类似目前阿普 271的状况。</p></div><div class="wi-rest"></div>
