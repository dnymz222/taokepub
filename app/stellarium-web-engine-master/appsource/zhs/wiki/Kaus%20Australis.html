<div class="wi-intro"><p>箕（jī）宿（xiù）三（ε Sgr / 人马座ε）是一个位于人马座的双星系统，距离地球144.64光年。人马座εB亮度为14，和人马座εA相距32角秒。箕宿三是人马座中的“弓”的底部，也是“茶壶”座的底部。这个恒星已经脱离了主序星阶段，逐渐向着巨星演化.该星质量远远超过太阳，因此亮度达到了315个太阳亮度，总辐射波段光度则为太阳的430倍。它的半径已经膨胀至7个太阳半径，接下来数千万年内它将变得更红更大。 其英文传统名称是Kaus Australis，有两种语言的两个字组成：阿拉伯语中的قوس（qaws），意为“弓”和拉丁语中的austrālis，意思是“南边”。</p></div><div class="wi-rest"></div>
