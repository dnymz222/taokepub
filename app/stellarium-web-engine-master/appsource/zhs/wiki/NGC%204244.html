<div class="wi-intro"><p>NGC 4244，也称为科德韦尔26，是位于猎犬座并以侧面朝向我们的一个螺旋星系，也是科德韦尔天体之一。它属于M94星系群 (猎犬座I星系群)，相对来说很靠近本星系群——我们银河系所属的星系群。 NGC 4244的光度在+10.2至+10.6等，天体座标位置是赤经RA 12h 17.5m，赤纬+37° 49′，接近肉眼能看见的G-型恒星常陈四、棒涡星系NGC 4151、和不规则星系NGC 4214。这个星系的距离大约为1300万光年/14 million，红移+243/493公里/秒，位于这个星系的中心有一个星系核和晕。</p></div><div class="wi-rest"><h2>注解</h2></div>
