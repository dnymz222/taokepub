<div class="wi-intro"><p>IC 2395是船帆座中的一个疏散星团。</p></div><div class="wi-rest"><h2>观测史</h2><p>尼古拉-路易·德·拉卡伊星表的条目III.3可能是IC 2395（通常被视为失踪）。根据拉卡伊的纪录，该天体由一颗“6 等恒星，通过星云与南方恒星相接”，并给出坐标 RA=08:42.2，Dec=-48:04 。拉卡伊于1752年2月17日观测到它。 IC 2395于1908年由索伦·欧文·贝利独立发现。西德尼·范登贝赫和Gretchen Luft Hagen也在1975年对该星团进行了编目。vdBH 47的坐标与IC 2395 的坐标相当一致，它们是同一个星团的假设也得到了Clariá 等人的支持，他们估计其直径为19角分。</p></div>
