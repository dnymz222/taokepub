<div class="wi-intro"><p>NGC 2035，即ESO 56-EN161，或称为龙首星云（Dragon's Head Nebula）是位于大麦哲伦星系内部的发射星云和电离氢区，在天球上位于剑鱼座。NGC 2035由詹姆士·敦洛普发现于1826年8月3日。 NGC 2035是星云和恒星复合体的一部份，该区域包含NGC 2029、NGC 2032和NGC 2040，位于大麦哲伦星系主要区域的北方。该区域由大范围的明亮气体组成，并且内部被黑暗尘埃云分成数个部分。NGC 2029、NGC 2032和NGC 2035是恒星形成区域，而NGC 2040则是包含疏散星团的超新星遗迹。</p></div><div class="wi-rest"></div>
