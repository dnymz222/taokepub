<div class="wi-intro"><p>天囷十，即鲸鱼座75，又名BD-01 353，HD 15779、SAO 129959、HR 739，是鲸鱼座的一颗恒星，视星等为5.35，位于银经169.94，银纬-54.44，其B1900.0坐标为赤经2h 27m 4s，赤纬-1° -54.44′ 35″。 目前在该恒星旁发现一颗属于气体巨行星的系外行星。该行星从母恒星接受的照射量高于木星甚至地球。</p><p>观测资料显示另有其他影响周期的因素，可能是尚未探测到的质量在0.4到1倍木星，距离母恒星0.9到4天文单位的行星。</p></div><div class="wi-rest"></div>
