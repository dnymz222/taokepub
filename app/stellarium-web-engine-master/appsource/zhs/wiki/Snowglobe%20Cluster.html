<div class="wi-intro"><p>NGC 5466是分类为 XII，位于牧夫座的球状星团，距离地球51,800光年，距离银心52,800光年，在1784年5月17日就被威廉·赫歇尔发现，并编号为HV1.9。 这个球状星团很异常的包含了一些蓝色的水平分支恒星，并且和平常的球状星团一样是金属贫乏的恒星。在2006年发现它是一个被称为" 45度潮汐流"星流的来源，这个星流从牧夫座延伸至大熊座，大约有1.4°宽。</p></div><div class="wi-rest"><h2>站外链接</h2><p>NGC 5466（页面存档备份，存于互联网档案馆） seds.org Image NGC 5466 venus.mporzio.astro.it</p></div>
