<div class="wi-intro"><p>IC 2177是位于麒麟座的边界区域，靠近大犬座的一个星云。它是以Be星HD 53367为中心，大致呈圆形的一个电离氢区（H II区）。这个星云是由威尔斯的业馀天文学家艾萨克·罗伯茨发现的，他描述这是个"非常明亮，非常大，不规则的圆形，且非常弥漫"。 "海鸥星云"包括邻近的星团、尘埃云和反射星云等区域，但有时被业馀天文学家用于这个氢离子区。这个氢离子区域还包括疏散星团NGC 2335和NGC 2343。 NGC 2327位于IC 2177内，因为它在海鸥星云中的位置很显著，占比也够大，因此它也被称为海鸥头。</p></div><div class="wi-rest"><h2>图集</h2></div>
