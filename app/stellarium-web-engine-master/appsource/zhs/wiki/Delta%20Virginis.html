<div class="wi-intro"><p>东次相（太微左垣三 / δ Vir / 室女座δ）是一颗在室女座的红巨星，它在西方的固有名称是Auva。 它的光谱类型是M3-III，视星等3.38等，以裸眼就能看见。它也是一颗半规则变星，光度在+3.32 至+3.40之间变化著。 东次相 可能是联星，在距离80弧秒处有一颗11等的伴星。伴星的类型是K型矮星，轨道周期长达200,000年，但这必需再做进一步的确认。</p></div><div class="wi-rest"><h2>词源</h2><p>中世纪的名称Auva、Al Awwa、和Minelauva 都是源自阿拉伯文的عوى cawwa’ "狗吠声".</p></div>
