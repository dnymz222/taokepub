<div class="wi-intro"><p>NGC 6744是位于孔雀座的一个中间螺旋星系，距离地球大约3,000万光年 。它被认为是类似银河系的众多螺旋星系中最接近的之一，有著絮结的 (蓬松的) 旋臂和细长的核心。它至少还有一个被扭曲的卫星星系 (NGC 6744A)，外观上类似大麦哲伦星系。 2005年在NGC 6744内发现一颗超新星。 NGC 6744是室女座超星系团的成员星系。</p></div><div class="wi-rest"><h2>图集</h2><h2>相关条目</h2><p>NGC 2336：另一个体积和形状相近的螺旋星系。 NGC 1232</p></div>
