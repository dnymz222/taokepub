<div class="wi-intro"><p>NGC 5907是个距离地球大约3,900万光年远的螺旋星系，它的金属量异于正常的低，和有少许可检测到的巨星，整个星系几乎都由矮星组成。 1788年5月5日，威廉·赫歇尔发现这个星系，是NGC 5866星系群的成员之一。超新星1940 A以及2026Kid出现在这个星系内。</p></div><div class="wi-rest"><h2>NGC 5906</h2><p>NGC 5907也被称为NGC 5906。第二个NGC编号指的是位于尘埃带西侧的星系较暗的部分，由爱尔兰天文学家兼物理学家乔治·约翰斯通·斯托尼于1850年4月13日记录下来。</p></div>
