<div class="wi-intro"><p>NGC 1514是金牛座的一个行星状星云，由威廉·赫歇尔发现于1790年11月13日。他在观测纪录中描述该星云是“一个最特殊的现象”，并因此使他强迫自己重新思考宇宙的组成。直到发现该星云以前，他一直认为所有的星云都是由许多恒星组成，只是因为距离太远而无法被解析出来。但该星云是一颗恒星“周围是隐隐发光的气体”，赫歇尔因此下结论：“我必须冒昧的说，明亮的星云绝不是由恒星组成”。 有猜测认为这个星云的中心是由两颗距离相当近的恒星组成的联星系统，轨道周期约10日。而气体可能是从联星中较大的成员星散逸出的。 NGC 1514也被称为“水晶球星云”（Crystal Ball Nebula）。</p></div><div class="wi-rest"></div>
