<div class="wi-intro"><p>巨蛇座ω（ω Ser、ω Serpentis）是一颗位于巨蛇座的恒星。</p></div><div class="wi-rest"><h2>物理性质</h2><p>巨蛇座ω是一颗黄色的G型巨星，视星等为+5.21。 根据从地球上观察到的每年11.93 mas的视差变化，天文学家推测巨蛇座ω距离太阳约273光年。 在这个距离上，由于星际尘埃，视星等会减弱0.19等。它是大熊座移动星群的成员，位于这组恒星的外侧，共同移动方向大致一样。 巨蛇座ω的年龄估计约为40亿年，恒星分类为G8 III。它是一颗红群聚星，意味著核心透过氦核融合产生能量。这颗恒星的质量估计为太阳的120%，但已膨胀至太阳半径的10.48倍。它的光球层辐射光度是太阳光度的69倍，温度为4,797 K。</p></div>
