<div class="wi-intro"><p>巨蛇座τ2，来自τ2Serpentis 的拉丁化为Tau2Serpentis，是位于星座巨蛇座中的一颗恒星，距离太阳大约480光年。视星等为6.22，对肉眼观测具有挑战性。恒星正以 −19公里/秒的径向速度。 这个天体是一颗晚期B型主序星，恒星分类为B9V。它很可能是一颗牧夫座λ型星的恒星。这颗恒星的年龄为2亿7800万年和以154公里/秒的投影旋转速度自转。它的质量几乎是太阳质量的三倍，半径是太阳的三倍。巨蛇座τ2在有效温度10,839 K下，从其光球层辐射出太阳光度91倍的光度。 有证据显示可能存在伴星，该伴星约占该系统总排放的15%。</p></div><div class="wi-rest"></div>
