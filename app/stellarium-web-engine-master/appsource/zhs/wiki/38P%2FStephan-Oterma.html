<div class="wi-intro"><p>史蒂芬-奥特玛彗星（38P/Stephan–Oterma）是一颗周期彗星，轨道周期为38年。史蒂芬-奥特玛彗星符合哈雷型彗星的经典定义（20年 &lt; 周期 &lt; 200年）。</p></div><div class="wi-rest"><h2>观测史</h2><p>1867年1月22日，耶罗姆·尤金·科吉亚在法国马赛天文台发现史蒂芬-奥特玛彗星。1月25日，爱德华·斯特凡确认这是一颗彗星。1942年11月6日，芬兰天文学家利斯·奥特玛发现史蒂芬-奥特玛彗星。 发现史蒂芬-奥特玛彗星上一次抵达近日点是在2018年11月10日。2017年6月24日，泛星计画再发现史蒂芬-奥特玛彗星，当时距离太阳5.3天文单位。史蒂芬-奥特玛彗星下一次经过近日点是2056年8月28日。</p></div>
