<div class="wi-intro"><p>NGC 1316 是天炉座的一个透镜星系。在1亿年前，开始吞食一个邻近较小的螺旋星系NGC 1317。</p></div><div class="wi-rest"><h2>距离</h2><p>至少有两种方法被天文学家用来估算NGC1316的距离：2003年的表面亮度波动（SBF）和2006年的行星状星云光度函数（PNLF）。 天文学家使用SBF计算出的距离估计值为20.0±1.6Mpc。使用PNLF定位了45个行星状星云候选体，距离估计为17.9+0.8−0.9Mpc。两次距离测量的平均值估计为62.0±2.9Mly(19.0±0.9Mpc)。</p></div>
