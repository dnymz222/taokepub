<div class="wi-intro"><p>蜀增二（巨蛇座3）是在赤道星座巨蛇座的一颗轨道周期大约66年的联星。它的视星等为5.34，虽然黯淡，但依然肉眼可见。它是一颗已耗尽其核心氢的恒星，光谱分类K0III，距离地球约114秒差距（370光年），是颗橙巨星。 蜀增二的两颗恒星可利用散斑干涉法解析，2014年时相距0.23"。其轨道高度离心，1997年通过轨道近星点时，两者相距仅6毫秒。 K0III的光谱类型是两颗恒星合并的，因目前尚无法获得蜀增二的两个成员恒星个别的光谱。主星的星等比伴星亮2.5等，并且表面温度较冷。综合光谱类型显示主星很可能已演化离开主序星，但对伴星的颜色与亮度比较，显示它仍属主序星。</p></div><div class="wi-rest"></div>
