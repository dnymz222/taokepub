<div class="wi-intro"><p>小行星84522（2002 TC302）是一个颜色偏红的巨大共振海王星外天体（2:5），它是在2002年10月9日被帕洛马山天文台的NEAT计画发现的。</p></div><div class="wi-rest"><h2>轨道</h2><p>以39.058 至70.983 天文单位环绕著太阳运转，由于共振的缘故，它每绕太阳二圈，海王星会绕太阳五圈。以如此长的轨道周期环绕太阳的外海王星天体 2002 TC302上回在10月抵达冲的位置时，视星等只有20.5等。</p><h3>表面</h3><p>偏红的光谱表示2002 TC302的表面只有非常少量的冰，这也可以解释它的反照率为何会偏低。</p><h2>相关资料</h2><p>小行星 海王星外天体 离散盘</p></div>
