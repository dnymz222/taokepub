<div class="wi-intro"><p>井宿增六（御夫座49）是位于北天星座御夫座的一颗恒星，距离太阳680光年。它是一颗肉眼可见的暗淡白色恒星，视星等为5.26等。这颗恒星正以每秒+17公里的日心径向速度远离地球，而在大约550万年前距离仅149光年。它位于黄道附近，因此会受到月掩星现象的影响。 该天体是一颗A型主序星，其恒星分类为A0Vnn，其中的“n”表示由于快速旋转而产生“模糊”的谱线。它的投影转速为149公里/秒。这颗恒星的半径约为太阳半径的2.3倍，来自光球的8,749K有效温度 ，使它的辐射量超过太阳亮度的3倍。</p></div><div class="wi-rest"></div>
