<div class="wi-intro"><p>土卫十二又称为“海伦”（S/1980 S 6，Helene），是环绕土星运行的一颗卫星。于1980年被南比戈尔峰天文台发现。1988年，土卫十二被命名为海伦。这个名字是来源于希腊神话中的海伦。 土卫十二（海伦）与土卫四（狄俄涅）共轨，并且驻留在土卫四的拉格朗日点 (L4)，跟随在土卫四前方 60度。狄俄涅还有另一颗驻留在后方60度另一个拉格朗日点L5上的卫星土卫三十四 (“波吕丢刻斯”)。</p></div><div class="wi-rest"><h2>概述</h2><p>这颗卫星半长轴约为377,396公里，绕土星公转周期2.736915天，与黄道及土星赤道的轨道倾角为0.199°，轨道离心率0.0022。</p></div>
