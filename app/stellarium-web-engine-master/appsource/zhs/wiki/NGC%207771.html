<div class="wi-intro"><p>NGC 7771这是一个位于飞马座的螺旋星系。它相对于宇宙微波背景的速度为3,979±25 km/s，对应的哈伯距离为 58.7±4.1Mpc（∼1.91亿光年）。NGC 7771是德国天文学家威廉·赫歇尔在1784年9月18日发现的。 NGC 7771的光度等级为I，具有宽广的 HI 线。此外，它也是一个亮红外星系（LIRG星系）和星暴星系，还包含氢离子区区域。 迄今为止，九次非红移测量得出的距离为48.100±3.381Mpc（约 1.57 亿光年），仍在哈伯距离范围内。</p></div><div class="wi-rest"></div>
