<div class="wi-intro"><p>人马座3（X Sagittarii），中文星官名天龠八，又名CD-2711930，HD 161592、SAO 185755、HR 6616，是人马座的一颗恒星，位于人马座南部，也是变星和双星候选系统，靠近蛇夫座西部边界。它具有黄白色调，肉眼可见，视星等在4.54等左右。根据视差计算，这颗恒星距离太阳约950光年，并以−10 km/s 的径向速度向太阳靠拢。这颗恒星的绝对星等约为-2.85等。 人马座3位于银经1.17，银纬0.21，其B1900.0坐标为赤经17h 41m 15.9s，赤纬-27° 0.21′ 34″。</p></div><div class="wi-rest"></div>
