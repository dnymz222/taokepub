<div class="wi-intro"><p>NGC 3718，也称为阿普214（Arp 214），是一个位于大熊座的星系，距离地球约5200万光年。NGC 3718附近有一个星系NGC 3729，是一个奇特的棒旋星系。NGC 3718要不是一个透镜状星系，就是一个螺旋星系。 NGC 3718呈现出与NGC 6872类似的扭曲S形，可能是与距离地球150,000光年的另一个螺旋星系NGC 3729发生引力交互作用的结果。希克森致密群（The Hickson Compact Group）56位于NGC 3718的一个螺旋臂的南侧。希克森致密群56的距离是NGC 3718或 NGC 3729的8倍。 NGC 3718是大熊座星系团。</p></div><div class="wi-rest"></div>
