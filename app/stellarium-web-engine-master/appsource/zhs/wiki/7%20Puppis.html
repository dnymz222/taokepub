<div class="wi-intro"><p>弧矢增十七（Xi Puppis、ξ Puppis，缩写Xi Pup、 ξ Pup）是位于南天星座船尾座的多星系统。它是这个星座中较亮的成员之一，视星等为3.35等。根据在依巴谷任务期间进行的视差测量，它与太阳的距离大约为1,200光年（370秒差距），误差约为7.5%。 该系统由一个光谱联星组成，标示为弧矢增十七A（船尾座Xi A），与第三颗恒星弧矢增十七B（船尾座Xi B）。弧矢增十七A 的两颗恒星分别标示为弧矢增十七A a（正式命名为"Azmidi"/ˈæzmɪdi/)）和弧矢增十七Ab 。</p></div><div class="wi-rest"><h2>命名法</h2></div>
