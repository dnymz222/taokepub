<div class="wi-intro"><p>NGC 2080 又称鬼头星云，是位于剑鱼座大麦哲伦星系蜘蛛星云南部的恒星形成区和发射星云。大麦哲伦星云是银河系的卫星星系，距离地球168,000光年。 NGC 2080由约翰·赫歇尔于1834年发现。鬼头星云的直径为50光年，因拥有的两个明显的白色斑块而得名，被称为“鬼眼”。西部斑块称为A1，其中心有一个气泡，是由其所含的年轻大质量恒星产生的。东部的区域称为A2，由新形成的星团中的几颗年轻恒星组成，但它们仍然被其起源的尘埃云所遮蔽。由于两组尘埃云都没有因恒星辐射而消散，天文学家推断这两组恒星都是在过去10,000年内形成的。这些恒星开始在星云中形成一个气泡，喷涌出被称为恒星风的物质。</p></div><div class="wi-rest"></div>
