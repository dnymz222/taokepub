<div class="wi-intro"><p>NGC 6751是在天鹰座的一个行星状星云，又称为亮眼星云。估计它距离地球约6,500光年，直径是0.8光年，在这个星云中心的恒星表面温度大约是140,000K。这是一颗在数千年塌缩的恒星，抛出外层气体形成的。 这个星云是澳大利亚高级中学的学生参加双子星天文台举办的影像竞赛中获选的画面，并赢得2009年双子学校天文竞赛的主题。 本条目中NGC 6751的图片是在2000年4月被选出做为哈伯太空望远镜发射十周年纪念的假色合成影像。</p></div><div class="wi-rest"><h2>相关条目</h2><p>行星状星云 行星状星云列表</p></div>
