<div class="wi-intro"><p>NGC 4449，也称为科德韦尔21，是位于猎犬座的一个不规则星系，距离大球大约1,200万光年，属于M94星系团 (猎犬座星系群) 的一部分。这是相对来说相当靠近本星系群，我们银河系系所属的星系群，的一个星系群。由于和大麦哲伦星系 (LMC) 的大小非常相似，因此被仔细的研究和拿来做为比较。NGC 4449有一般的棒型，也有LMC的特征，散布著蓝色的恒星和星团。靠近底部 (哈伯的照片) 是氢原子气体发出的粉红色光，这是大质量恒星形成区的泄踪剂。与邻近星系间的交互作用被认为对恒星的形成有所影响。</p></div><div class="wi-rest"></div>
