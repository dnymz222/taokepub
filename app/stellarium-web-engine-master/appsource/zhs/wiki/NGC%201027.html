<div class="wi-intro"><p>NGC 1027位于仙后座，是威廉·赫歇尔在1787年发现的疏散星团。它的位置在仙后座的东侧，介于心脏星云和灵魂星云这两个发射星云之间。然而，它与这两个星云没有物理上的联系，只是位于它们前方的前景星团，与太阳系的距离大约是3,000光年。星团的视星等为6.7等，使用10X50的双筒望远镜就能看见一颗7等星，但这颗星并不是这个星团的成员；星团中最亮的恒星只有9.3等。</p><p>维基共享资源上的相关多媒体资源：NGC 1027</p><p>NED – NGC 1027 SEDS – NGC 1027 SIMBAD – NGC 1027 VizieR – NGC 1027</p></div><div class="wi-rest"></div>
