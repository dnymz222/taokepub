<div class="wi-intro"><p>NGC 5986是一个位于豺狼座的球状星团，距离太阳约34000光年。 苏格兰天文学家詹姆士·敦洛普于1826年5月10日发现的NGC 5986。爱尔兰天文学家约翰·路易·埃米尔·德雷耳将NGC 5986描述为“一个非凡的物体，一个球状星团，非常明亮，巨大，圆形，中间逐渐变亮，星等为13到15等”。 NGC 5986穿过银河系的顺行-逆行轨道被认为是不规则的，并且偏心率很高。NGC 5986平均中心径向速度为+100公里/秒。NGC 5986与银河系中心距离为17000光年（5200秒差距），位于银河系内晕内。</p></div><div class="wi-rest"></div>
