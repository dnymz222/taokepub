<div class="wi-intro"><p>天津增十九 (天鹅座52)是在北半球天鹅座的一颗巨星，视星等为4.22等。根据依巴谷卫星的视差，它的距离大约是291光年（89秒差距）远。 天津增十九很可能是水平分支上的红团簇星，它的核心融合了氢，然而还有25%的可能性仍是红巨星分支(RGB)上的恒星，氢融合只在核心周围的氢壳层进行。如果是红团簇星，它的年龄高达22.7亿岁，但如果只是RGB星，则只有9.1亿岁。在4,677K的有效温度下，它的光度大约是90 L☉，它的半径大约是14 R☉。 天津增十九有一颗黯淡的9.5等伴星，与主星的角距离为6角秒。</p></div><div class="wi-rest"></div>
