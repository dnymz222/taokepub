<div class="wi-intro"><p>NGC 6712是一个位于盾牌座球状星团，很可能是纪尧姆·勒让蒂于1749年7月9日调查天鹰座银河星云时发现的。他将其描述为“真正的星云”，与疏散星团野鸭星团形成鲜明对比。1784年6月16日，NGC 6712由威廉·赫雪尔独立发现，编目号为H I.47；他也首先将其归类为圆形星云。约翰·赫歇尔在1830年代的观测中第一次将其描述为球状星团。该星团似乎已有约 120亿年的历史，并且由于穿过银盘而经历了显著的质量损失，因此最初的质量可能要大得多。对球状星团来说，NGC 6712的金属含量相当丰富。</p></div><div class="wi-rest"></div>
