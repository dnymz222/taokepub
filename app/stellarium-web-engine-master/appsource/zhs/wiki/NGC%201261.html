<div class="wi-intro"><p>NGC 1261（也称为科德韦尔 87）是位于时钟座方向、银河系内的一个球状星团。苏格兰天文学家詹姆士·敦洛普于1826年首次发现NGC 1261。它的年龄约为102.4亿年，质量是太阳的341,000倍。NGC 1261星团距离太阳53000光年，距离银河系中心59000光年。 NGC 1261星团没有显示出核心坍缩的正常迹象，但有证据表明，它可能在过去20亿年内经历了核心坍缩后的反弹状态。中心光度密度为2.22 L☉·pc−3，对于球状星团来说，这个密度比较低。尽管如此，NGC 1261在夏普力-索耶集中度分类法为II级，这表明其中心浓度较高。</p></div><div class="wi-rest"></div>
