<div class="wi-intro"><p>NGC 6210是一个位于武仙座的行星状星云；距离地球约6500光年。该星云形状像一只乌龟，中心是濒死的白矮星。1825年由俄国天文学家瓦西里·雅可夫列维奇·斯特鲁维发现。</p></div><div class="wi-rest"><h2>内部结构</h2><p>形成 NGC 6210 的前身星质量推测比太阳稍小。该星云内部的结构因为垂死恒星的多次喷发，形成不同层次的复杂结构。外部较暗的部份（影像中为红色）看起来像海龟的壳，直径约 1.6 光年；而内部较亮的部份看起来则像鹦鹉螺的壳，直径约 0.5 光年。 下方假色影像中占据大部分区域的红色是代表氢，蓝色代表一次电离的氧离子，绿色则是二次电离的氧离子。</p></div>
