<div class="wi-intro"><p>NGC 1559是一个位于网罟座的棒旋星系。该星系同时也是西佛星系。虽然NGC 1559起初被认为是剑鱼座星系团的成员星系，稍后的观测结果却显示它并不属于任一星系团或星系群，甚至没有临近伴星系存在。NGC 1559有巨大的螺旋臂结构，以及高恒星形成率。该星系有一个接近东西走向，在天球上横跨40角秒的小型棒状结构。它的棒状结构与盘面是极为强烈的无线电波发射源。 2005年，天文学家在NGC 1559内发现Ia超新星SN 2005df。该星系内还曾经发现2颗超新星SN 1984J和SN 1986L。而这三颗超新星都是由澳大利亚业馀天文学家罗伯特·埃文斯发现。</p></div><div class="wi-rest"><h2>图集</h2></div>
