<div class="wi-intro"><p>仙女座14（14 Andromedae或14 And），即螣蛇增九，是一个光谱形式K型的橙色巨星，距离地球约258光年，位于仙女座。</p></div><div class="wi-rest"><h2>概要</h2><p>螣蛇增九被认为是一颗变星。在变成巨星前一般认为它是A型或F型主序星。2008年宣布在该恒星旁发现一颗系外行星，是目前所发现少数环绕已经通过了恒星主序星演化阶段的行星。</p><h2>行星系统</h2><p>2008年在螣蛇增九旁发现一颗系外行星。该行星的质量下限是4.8倍木星质量，公转周期186日。该行星是环绕已完成主序星演化的中等质量恒星中最接近母恒星的行星之一（这样的天体之前只发现在成群的巨星中）。</p></div>
