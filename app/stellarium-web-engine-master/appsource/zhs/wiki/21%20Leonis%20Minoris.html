<div class="wi-intro"><p>小狮座21是在星座小狮座的一颗恒星。它的视星等大约是4.5等，黯淡的亮度使肉眼不易看见（参见波特尔暗空分类法）。由依巴谷卫星量测的视差估计，它距离地球大约92.1光年（28.2秒差距）。它被认为是天狼星超级星团的一员。 小狮座21的旋转速度相当快，它的投影旋转速度估计为155公里/秒，所以它的自转至少得有那么快。它被列为光谱类型A7V的的快速旋转光谱标准星，而不是缓慢旋转的标准星长蛇座2。它也是盾牌座δ型变星，视星等在4.47至4.52之间变动。 小狮座21有红外过量，因此认为在它的周围有一个岩屑盘。黑体拟合的温度为60 K，轨道半径为62 AU。</p></div><div class="wi-rest"></div>
