<div class="wi-intro"><p>杜图瓦彗星（66P/du Toit）是一颗周期彗星，目前的轨道周期为14.78年。 1944年5月16日，南非博伊登天文台（Boyden Observatory）的丹尼尔·杜·图瓦（Daniel du Toit）发现杜图瓦彗星，他估计亮度为10等。杜图瓦彗星的下一次回归日期预计是1959年4月10日，但未能被天文学家发现。 1974年的回归几乎是偶然发现的，近日点日期为1974年4月1日，杜图瓦彗星亮度为18-19等。1989年的回归再次被错过。2003年，杜图瓦彗星的近日点为2003年8月27日，亮度为20等。 2018年5月19日，杜图瓦彗星到达近日点，视星等约为12等。</p></div><div class="wi-rest"></div>
