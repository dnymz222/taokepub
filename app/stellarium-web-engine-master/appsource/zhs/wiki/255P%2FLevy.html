<div class="wi-intro"><p>P/2006 T1 李维是一颗以5.24年为周期的彗星。上一次通过近日点的日期约为2006年10月7日，离太阳最近的距离约为0.989个天文单位、通过近地点的日期约为2006年9月18日，离地球最近的距离约为1.32个天文单位。在上一次通过近日点时星等只有约9.3等。 它在2006年12月1日开始没有被观测得到，只有60天观测到的弧。 在2011年6月3日，李维彗星(PK06T010)的星等约为19.8等。 下一次通过近日点的日期估计为2012年1月11日，离太阳最近的距离估计约为1.007个天文单位、通过近地点的日期为2012年1月8日，离地球最近的距离估计约为0.0489个天文单位。</p></div><div class="wi-rest"></div>
