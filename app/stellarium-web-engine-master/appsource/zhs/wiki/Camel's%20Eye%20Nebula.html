<div class="wi-intro"><p>NGC 1501是一个复杂的行星状星云，威廉·赫歇尔于1787年8月27日在鹿豹座这个星座内发现它。它也被称为牡蛎星云。</p></div><div class="wi-rest"><h2>性质</h2><p>行星状星云的中心恒星的光谱类型为[WC4]，类似于富含碳的沃夫–瑞叶星。它是一颗脉动的恒星，这意味著它的亮度有规律地和周期性地变化。就NGC 1501的前身恒星而言，这是非常快的，恒星的亮度在短短半小时内发生了显著变化。分析盖亚的数据表明，中央恒星是一个联星系统。可见光观测捕捉到包括氢气和氮气在内的气体辉光。星云的总质量估计约为0.22 M☉，其中大部分是电离气体（0.21 M☉）和一小部分（8.9×10−4 M☉）是富含碳的灰尘。</p><h2>图集</h2></div>
