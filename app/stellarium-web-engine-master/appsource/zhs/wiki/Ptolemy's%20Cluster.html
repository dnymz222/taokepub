<div class="wi-intro"><p>托勒密星团（也称为M7或NGC 6475）是位于天蝎座的一个疏散星团。在中国古代天文学中，称之为“鱼”星官。 托勒密在西元130年就已经观测过这个星团，但将它记录为星云；在1654年之前，乔瓦尼·巴蒂斯塔·霍迪耶纳也观测过这个星团，并计算出他拥有30颗恒星。梅西耶在1764年将他收录为疑似彗星的梅西耶尔星表内的M7。这个星团位在天蝎尾端的"尖螫"上，很容易就能以肉眼看见。 以望远镜观赏这个星团约可看见80颗的恒星横亘在1. 3°的直径上，估计这个星团的距离在800至1,000光年，因此真实的直径相当于18至25光年。星团的年龄约二亿二千万年，最亮星的视星等是5.6等。</p></div><div class="wi-rest"></div>
