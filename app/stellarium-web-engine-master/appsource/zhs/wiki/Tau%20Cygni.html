<div class="wi-intro"><p>天津六 （天鹅座τ）是在天鹅座的一对联星，距离地球大约69光年。主星是4等的GJ 822.1 A，光谱类型为F2IV的黄白色次巨星，因此它的表面温度在6,000至7,500K，比太阳更大和更热，亮度则数倍于太阳。它的伴星，6等的GJ 822.1 B，是一颗黄色的主序星，光谱类型为G0V。它的大小、表面温度和亮度都与我们的太阳相似。 2026年7月16日，IAU恒星命名工作组通过决议，以其在满洲传统星座神话中的名字Enduri Senggu（满语：ᡝᠨᡩᡠᡵᡳ ᠰᡝᠩᡤᡠ，穆麟德转写：enduri senggu）正式命名了天鹅座τ星。Enduri Senggu在满语中意为“刺猬神”。</p></div><div class="wi-rest"></div>
