<div class="wi-intro"><p>332P/池谷–村上，也称为池谷–村上彗星 (P/2010 V1) 是一颗周期大约5.29年的短周期彗星，它于2010年11月3日首度被两位日本的业馀天文学家池谷薰和村上茂树发现。池谷使用25公分 (10英吋)，放大倍率为39倍的反射望远镜确认了这颗彗星；同时，村上使用46公分 (18英吋)，放大倍率为78倍的反射望远镜。彗星的摄影确认是在新墨西哥的乔瓦·尼禄使用Global-Rent-a-Scope (GRAS) 望远镜完成的。池谷和村上两人都是透过光学望远镜目视观测确认发现彗星，而这种目视的发现在现在已经很罕见了。</p></div><div class="wi-rest"></div>
