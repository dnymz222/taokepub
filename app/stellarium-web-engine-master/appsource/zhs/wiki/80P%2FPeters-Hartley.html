<div class="wi-intro"><p>彼得斯-哈特雷彗星（80P/Peters–Hartley）是一颗周期彗星，轨道周期为8.12年。 这颗彗星最初是由义大利那不勒斯卡波迪蒙特天文台（Astronomical Observatory of Capodimonte）天文学家克里斯蒂安·亨利·弗里德里希·彼得斯发现的。由于缺乏足够的数据来精确计算其轨道，这颗彗星失踪了一百多年。 1982年7月11日，澳大利亚赛丁泉天文台联合王国施密特望远镜小组的天文学家马尔科姆·哈特雷在一张曝光的照相底片上意外地重新发现这颗彗星。他估计彗星亮度为15等。长谷川一和中野主一同时也得出同样的结论。</p></div><div class="wi-rest"></div>
