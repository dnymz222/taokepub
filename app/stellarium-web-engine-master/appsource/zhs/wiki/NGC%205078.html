<div class="wi-intro"><p>NGC 5078是长蛇座一个螺旋星系，距离地球约9,400万光年。NGC 5078直径为127,000光年，可能是NGC 5061星系群的成员。NGC 5078的尘埃带发生了扭曲，可能是由于与附近星系IC 879的相互作用而产生的，而IC 879本身也因相互作用而扭曲成了“S”形。在推测的距离下，两个星系之间的最小距离约为61,000光年。 NGC 5078与螺旋星系NGC 5101在天空中的距离也只有约0.5 度，两者与地球的距离被认为相同，意味著它们相距约80万光年。 科学家曾在NGC 5078中观测到一颗超新星：SN 1999cz（Ic型，视星等16等）。</p></div><div class="wi-rest"></div>
