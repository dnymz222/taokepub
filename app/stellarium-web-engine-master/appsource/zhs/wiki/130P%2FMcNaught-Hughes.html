<div class="wi-intro"><p>麦克诺特-休斯彗星（130P/McNaught–Hughes）是太阳系中的一颗周期彗星，绕太阳公转一周需6.65年，直径4.2公里。 1991年9月30日，罗伯特·麦克诺特、尚恩·M·休斯使用位于赛丁泉天文台英国施密特望远镜拍摄的照片中发现了这颗彗星。 1991年10月1日，麦克诺特透过乌普萨拉南施密特望远镜拍摄的另一张照片证实了彗星的存在。 1997年4月，美国亚利桑那州月球与行星实验室的天文学家J·V·科蒂（J. V. Scotti）和日本久万高原天体观测馆的中村彰正分别重新发现了这颗彗星。</p></div><div class="wi-rest"></div>
