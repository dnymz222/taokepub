<div class="wi-intro"><p>白羊座30（30 Ari, 30 Arietis），是一个位于白羊座的三合星系统，距离地球约130光年。 白羊座30A和白羊座30B在天球的距离为38.1角秒（约1500天文单位），它们的光度接近太阳的两倍，因此都被分类为F-型主序星，这意味着它们的核心都在进行氢核聚变。白羊座30A本身又是一颗分光双星，两颗成员星旋转的周期为1.1天。这个恒星系统的年龄约为9.1亿年，约为太阳的五分之一。</p></div><div class="wi-rest"><h2>行星系统</h2><p>2009年11月27日，科学家发现一颗围绕白羊座30B旋转的大质量行星，它距离白羊座30B1个天文单位 。</p><h2>相关条目</h2><p>太阳系外行星列表</p></div>
