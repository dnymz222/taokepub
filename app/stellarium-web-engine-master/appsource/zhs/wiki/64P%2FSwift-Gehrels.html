<div class="wi-intro"><p>斯威夫特-赫雷尔斯彗星（64P/Swift–Gehrels）是一颗周期彗星，目前的轨道周期为9.23年。</p></div><div class="wi-rest"><h2>发现史</h2><p>1889年11月17日，路易斯·斯威夫特在纽约州罗彻斯特沃纳天文台发现该彗星，斯威夫特形容它非常暗淡。1973年2月8日，这颗彗星失踪后，加州帕洛玛天文台的汤姆·赫雷尔斯重新发现该彗星，并估计亮度仅为19等。 1981 年、1991 年、2000 年、2009 年和 2018 年，天文学家都曾观测到斯威夫特-赫雷尔斯彗星。2018年回归最为明亮，2018年10月28日，彗星距离地球最近，为0.445个天文单位。最亮的时刻出现在8月14日，彗星亮度增加了2.7等。</p></div>
