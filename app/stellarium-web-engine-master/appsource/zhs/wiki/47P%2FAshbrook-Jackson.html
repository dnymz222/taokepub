<div class="wi-intro"><p>47P/阿什布鲁克- 杰克逊彗星 是太阳系的一颗周期彗星。 彗核的直径估计为5.6公里。</p></div><div class="wi-rest"><h2>历史</h2><p>47P/阿什布鲁克- 杰克逊彗星于1948年由约瑟夫·阿什布鲁克和西瑞尔·杰克逊（天文学家）发现。</p><h2>名称来源</h2><p>其名称中的“47P”意指它是被发现的第47颗周期性彗星，而“阿什布鲁克”与“杰克逊”是两位发现者的名字。</p><h2>过近日点日期</h2><p>2025年10月28日 2017年6月10日 2009年1月31日 2001年1月6日 1993年7月14日 1986年1月24日 1978年8月19日 1971年3月13日 1963年10月2日 1956年4月6日 1948年10月4日</p></div>
