<div class="wi-intro"><p>房宿增一（拉丁文名称为Lambda Librae）是黄道星座天秤座的联星，拜耳名称是天秤座λ。它是颗黯淡的恒星，视星等 +5.03，在漆黑的夜晚肉眼隐约可见。年周视差10.54mas，因此与太阳的距离是310光年。在这样的距离上，星际尘埃造成的消光使它的视星等降低0.22等。 它是只有单一光谱线的光谱联星，轨道周期14.48天，离心率0.27。可以见到的成员是B型主序星，光谱类型B3V。它是光谱特殊的弱氦星，并且是颗旋转椭球变星。估计它的半径是太阳的3.9倍，质量是太阳的5倍。它是类织女的候选者，意味著它有环绕著恒星的岩屑盘引起的红外过量特征。这个系统也是个X射线源。</p></div><div class="wi-rest"></div>
