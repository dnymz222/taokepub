<div class="wi-intro"><p>女增一（宝瓶座5，英语：5 Aquarii）是在黄道，也是天球赤道星座宝瓶座中的一颗单独恒星。基于视差，距离太阳约780光年。“宝瓶座5”是源自佛兰斯蒂德命名法的名称。其视星等为5.55，肉眼可见其为一颗淡淡的蓝白色恒星。这个天体正以 −3公里/秒的日心径向速度接近地球。 这是一颗疑似化学异常的恒星，恒星分类为B9III，然而Adelman等人（2004）认为它是一颗元素丰度接近太阳的恒星。其投影自转速度为25公里/秒，而它的谱线相对锐利。 该恒星在11,200 K的有效温度下，从其光球层辐射出318倍的太阳光度。</p></div><div class="wi-rest"></div>
