<div class="wi-intro"><p>长蛇座27，又名BD-08 2643，HD 80586、SAO 136768、HR 3709，是长蛇座的一颗恒星，视星等为4.8，位于银经241.08，银纬27.11，其B1900.0坐标为赤经9h 15m 36s，赤纬-9° 27.11′ 53″。</p></div><div class="wi-rest"><h2>亚恒星伴星</h2><p>日本冈山天体物理观测所的系外行星搜寻团队于2008年下半年发表关于一系列已经过主序星演化阶段恒星径向速度观测的论文，论文中指出有亚恒星天体和星宿五组成联星系统。该天体的轨道周期约9.3年，但尚未有行星被确认。</p></div>
