<div class="wi-intro"><p>NGC 2477是在星座船尾座的一个疏散星团，天球座标为赤经7时52.3分，赤纬-38度33分，亮度约5.8视星等，距地球3,600光年。大约包含300颗恒星，于1751年由拉卡伊发现。这个星团的年龄约7亿年。</p></div><div class="wi-rest"><h2>视觉外观</h2><p>NGC 2477是一个令人惊艳的星团，在天空中的范围约27角分，几乎与满月一样大，是天空中最大的疏散星团之一。它像是一个高解析下的球状星团，但是没有球状星团的中心密集特征。伯纳姆注意到一些观测者评论说，它虽然比M46小，更恒星数量更多，也更紧凑。</p><h2>距离</h2><p>伯纳姆列举了几个可能的距离，范围从700秒差距（2,300光年） 到 1,900秒差距（6,200光年）。</p><h2>注解</h2></div>
