<div class="wi-intro"><p>土卫十三又称为“忒勒斯托”(S/1980 S 13, Telesto)，是环绕土星运行的一颗卫星。 土卫十三（忒勒斯托）与土卫三（忒堤斯）共轨，并且驻留在土卫三的拉格朗日点 (L4)，跟随在土卫三前方 60度。忒堤斯还有另一颗驻留在后方60度另一个拉格朗日点L5上的卫星土卫十四 (“卡吕普索”)。 土卫十三和土卫十四都被称为土卫三 (忒堤斯) 的特洛伊，类似于特洛伊小行星，是目前所知4颗特洛伊卫星中的半数。</p></div><div class="wi-rest"><h2>概述</h2><p>这颗卫星半长轴约为294,619公里，绕土星公转周期1.887802天，与黄道及土星赤道的轨道倾角为1.19°，轨道离心率0.000，接近于0。</p></div>
