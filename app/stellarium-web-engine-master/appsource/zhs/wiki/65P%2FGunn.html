<div class="wi-intro"><p>冈恩彗星（65P/Gunn）是一颗周期彗星，目前的轨道周期为6.79年，位于火星和木星轨道之间的主小行星带内。 1970年10月11日，普林斯顿大学的詹姆斯·冈恩利用帕洛玛天文台122公分施密特望远镜发现冈恩彗星。冈恩彗星的亮度较低，为16等，在有利条件下可提高到12等。1972年，伊丽莎白·罗默尔成功在远日点附近观测到冈恩彗星。 1970年2月4日，彗星距离谷神星0.015个天文单位（2,200,000公里；1,400,000英里）经过。 1980年，人们注意到帕洛玛天文台在1954年8月8日拍摄的底片上发现了一颗19等彗星，布莱恩·马斯登确认是冈恩彗星的早期影像。</p></div><div class="wi-rest"></div>
