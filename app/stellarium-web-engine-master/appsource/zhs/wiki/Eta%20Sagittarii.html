<div class="wi-intro"><p>箕（jī）宿（xiù）四（人马座η，η Sgr）是位于人马座的一个恒星系统，距离地球149光年。在拜耳分类法中，人马座η也曾经是“望远镜座β”。 其主星人马座ηA，是一颗M3.5型红巨星。它是一颗变星，因此它的视星等会在+3.08和3.12间变动，并且被归为不规则变星。伴星之中亮的一颗星人马座ηB是一颗F型矮星，视星等为+7.77。它距离主星165天文单位，公转周期为大约1300年。两颗星在夜空上距离3.6角秒。另外还有两颗较暗的伴星：人马座ηC，视星等为13，距离主星33角秒；人马座ηD，视星等为10，距离主星93角秒。</p></div><div class="wi-rest"></div>
