<div class="wi-intro"><p>NGC 6801是在星座天鹅座的一个螺旋星系。它是由路易斯·斯威夫特（英语：Lewis A. Swift）于1886年8月5日发现的。</p></div><div class="wi-rest"><h2>超新星</h2><p>在NGC 6801中观察到了两颗 超新星：</p><p>SN 2011df（Ia超新星，17.6等）被蒂姆·派克特和杰克·牛顿于2011年5月21 日发现。 SN 2015af（II型超新星，18.4等）由保罗·坎帕纳（英语：Paolo Campaner）于2015年8月9日发现，该发现是义大利超新星搜索计划（英语：Italian Supernovae Search Project，ISSP）的一部分。</p></div>
