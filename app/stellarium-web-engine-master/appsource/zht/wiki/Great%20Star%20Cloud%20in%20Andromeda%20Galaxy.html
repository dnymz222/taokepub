<div class="wi-intro"><p>NGC 206是仙女座的一個疏散星團，它是仙女座星系的一部分，位於該星系的一個有許多星雲的旋臂上。NGC 206是一個非常年輕的星團，組成它的恆星多數是非常明亮的藍巨星。通過研究NGC 206的造父變星的周期和亮度天文學家得以非常精確地確定仙女座星系離地球的距離。</p><p>維基共享資源上的相關多媒體資源：NGC 206</p><p>NED – NGC 206 SEDS – NGC 206 SIMBAD – NGC 206 VizieR – NGC 206 NGC 206 的詳細照片（頁面存檔備份，存於網際網路檔案館）</p></div><div class="wi-rest"></div>
