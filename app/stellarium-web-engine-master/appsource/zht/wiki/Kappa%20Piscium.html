<div class="wi-intro"><p>雲雨一（κ Psc / 雙魚座κ）是雙魚座的一個聚星系統，距離地球162光年。雖然直接看上去是一個亮點，但用雙筒望遠鏡可以看清它是由三顆成員星組成的。一顆恆星最亮時視星等為4.87，最暗時為4.95；另一顆視星等為11.9。 較亮的成員星是一顆獵犬座α²變星，它的亮度波動約0.01到0.1個星等。這類變星有着很強的磁場和很強的硅、鍶、鈣的譜線。它同時還有很多鈾線，還可能有少許鈥元素。它的鈾和鋨成分可能源於附近的超新星，而氧的含量低於鎂的含量。 該恆星約每48小時旋轉一周，速率為41 km/s。它光譜型為A，表面溫度在7,500 to 11,000開之間。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
