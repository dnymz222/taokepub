<div class="wi-intro"><p>NGC 772，也稱作Arp 78，是白羊座的一個模糊的漩渦星系，距離地球大約1.3億光年。</p></div><div class="wi-rest"><h2>特徵</h2><p>NGC 772的直徑約20萬光年，是銀河系的兩倍大小，其周圍有若干個衛星星系——包括矮橢圓星系NGC 770——其施加於NGC 772潮汐力很可能導致了後者發展出了一條非常長的外螺旋臂。</p><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 772</p><p>NED – NGC 772 SEDS – NGC 772 SIMBAD – NGC 772 VizieR – NGC 772</p></div>
