<div class="wi-intro"><p>NGC 3195 是位於蝘蜓座的一個行星狀星雲，它是天空中所有明亮的行星狀星雲中最偏南邊，而在北半球的所有觀測者都不能完整的看見它。約翰·赫歇爾在1835年最早發現它，它的外觀略呈橢圓，大小為40×35角秒，使用口徑10.5公分的望遠鏡，在低倍率下就能看見這個行星狀星雲。 光譜顯示NGC 3195正以17公里/秒的速度朝向地球接近，而這個星雲膨脹的速率約是40公里/秒。星雲中心恆星的星等 &gt;15.3V或16.1B，肉眼觀察當然看不見。目前估計的距離是1,700秒差距。</p></div><div class="wi-rest"><h2>相關條目</h2><p>NGC天體列表 行星狀星雲</p><h2>參考資料</h2></div>
