<div class="wi-intro"><p>尾宿九（υ Sco / υ Scorpii）是天蠍座的一顆恆星。其英文俗名Lesath（或者寫作Leschath,Lesuth,Shaula,Al Juza,Alascha）來自阿拉伯語，意為「有毒動物的經過（或咬）」；但實際上這是Scaliger（一位懂阿拉伯語的歐洲天文學家）對「Alascha」的錯譯。Alascha來自阿拉伯語al laţkha ，意為「霧蒙蒙的小塊」，即附近的疏散星團M7. 尾宿九距地球大約519光年。其光度大概是太陽的12,300倍，表面溫度22,400開爾文。尾宿九半徑是太陽的7.5倍，重量為太陽的10倍。由於質量巨大，尾宿九在其生命盡頭會變成大質量的白矮星。</p></div><div class="wi-rest"></div>
