<div class="wi-intro"><p>彼得斯-哈特雷彗星（80P/Peters–Hartley）是一顆週期彗星，軌道周期為8.12年。 這顆彗星最初是由義大利那不勒斯卡波迪蒙特天文台（Astronomical Observatory of Capodimonte）天文學家克里斯蒂安·亨利·弗里德里希·彼得斯發現的。由於缺乏足夠的數據來精確計算其軌道，這顆彗星失蹤了一百多年。 1982年7月11日，澳大利亞賽丁泉天文台聯合王國施密特望遠鏡小組的天文學家馬爾科姆·哈特雷在一張曝光的照相底片上意外地重新發現這顆彗星。他估計彗星亮度為15等。長谷川一和中野主一同時也得出同樣的結論。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
