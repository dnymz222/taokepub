<div class="wi-intro"><p>NGC 3079是位於大熊座，距離5,000萬光年的一個棒旋星系。這個星系的特徵是在非常中心的位置形成一個有"氣泡" （見右圖）。</p></div><div class="wi-rest"><h2>中心氣泡</h2><p>在NGC 3079中心的氣泡被認為有3,000光年寬，並且從星系的盤面向上升起超過3,500光年。這個氣泡被推測是大量恆星形成，引發爆發所形成的高速粒子流。目前的氣泡流被認為是在一百萬年前形成的，而且電腦的模擬顯示氣泡會周期性的形成，新的氣泡大約每一千萬年形成一次。</p><h2>相關條目</h2><p>闊邊帽星系</p><h2>參考資料</h2></div>
