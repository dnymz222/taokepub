<div class="wi-intro"><p>丈人一（α Col/天鴿座α），英文名Phact，是南天星座天鴿座的三等星。視星等2.64，是天鴿座的最亮星。基於依巴谷衛星的視差測量，丈人一的距離大約是261光年。</p></div><div class="wi-rest"><h2>特性</h2><p>該星被認為是單星，但是它有一個暗淡的光學伴星，角距離13.5弧秒，使它成為雙星。丈人一的恆星分類為B7III，亮度分類III代表它已經演化成一個巨星。光譜顯示它是個Be星，被熾熱的氣體盤環繞，產生出發射譜線。像大部分的這種恆星，它自轉快速，投影恆星自轉速度為176km/s。赤道速度可能高達457km/s。它是一個疑似的仙后座γ型變星，視星等在2.62-2.66間變化。</p></div>
