<div class="wi-intro"><p>NGC 6078是位於星座武仙座的一個橢圓星系。它相對於宇宙微波背景的速度為9,459 ± 44公里/秒，這對應於哈伯距離的139.52 ± 9.81 Mpc（〜4.55億光年）。 它是法國天文學家愛德華·斯特凡在1876年6月21日發現的。 非常靠近 NGC 6078 的是星系 PGC 57459和SDSS J161206.68+141210.3。 在NGC 6078曾觀察到一顆超新星SN 2011dv（Ia超新星，視星等16.2），是義大利超新星搜索計劃於2011年6月28日發現。</p></div><div class="wi-rest"><h2>相關條目</h2><p>NGC天體列表 (6000-6999)</p></div>
