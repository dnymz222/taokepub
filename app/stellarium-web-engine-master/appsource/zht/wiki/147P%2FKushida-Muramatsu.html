<div class="wi-intro"><p>串田－村松彗星，官方命名為147P/串田－村松（147P/Kushida-Muramatsu），是一顆公轉軌道周期為7.43年的彗星。</p></div><div class="wi-rest"><h2>發現</h2><p>日本天文學家串田嘉男、村松修於1993年發現串田－村松彗星，是一顆準希爾達群彗星。</p><h2>性質</h2><p>串田－村松彗星軌道為橢圓形，半徑為5.70億公里(3.807天文單位)、離心率為0.2775。串田－村松彗星公轉軌道周期為7.43年，與木星軌道共震為3:2。串田－村松彗星曾在1949年與1962年被木星捕捉，成為其衛星，也是已知第五顆被木星捕捉的彗星。 串田－村松彗星核心直徑推測為450公尺。</p><h2>參考資料</h2></div>
