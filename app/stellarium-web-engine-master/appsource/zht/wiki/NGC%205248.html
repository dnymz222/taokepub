<div class="wi-intro"><p>NGC 5248，也稱為科德韋爾45，是位於牧夫座，距離地球大約5,900萬光年的緊密中間螺旋星系。它是牧夫座中唯一一個星等亮於11的星系，位於牧夫座的西南角上，距離室女座的東邊輪廓不到10'。它是NGC 5248群中的星系，本身也是位於室女座超星系團東邊的室女III星系團。NGC 5248的距離測量有很大的出入，從4,140萬光年 (1,270萬秒差距)至7,400萬光年 (2,270萬秒差距)，平均是5,870萬光年 (1,770萬秒差距)]。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
