<div class="wi-intro"><p>武仙座14，也稱為格利澤 614，中國的傳統名稱為七公增十三，是一顆位於武仙座的橙矮星，距離地球約59光年，但裸眼不易看見這顆星。 在1998年，這顆恆星被發現有一顆行星（武仙座14b），以4.8年的週期，在橢圓軌道上環繞著恆星。在2006年，疑似發現了第二顆行星，命名為武仙座14c 。這顆新行星的參數還不清楚，但可能與內側的行星有4:1的共振，軌道週期19年，距離6.9天文單位。</p></div><div class="wi-rest"><h2>相關條目</h2><p>大熊座47 武仙座恆星列表 確定存在的太陽系外行星列表</p><h2>參考資料</h2></div>
