<div class="wi-intro"><p>小行星120178（2003 OP32）是位於柯伊伯帶的海王星外天體（TNO）。2003年7月26日，2003 OP32由米高·E·布朗、查德·特魯希略和大衛·拉比諾維茨在加利福尼亞州帕洛瑪山發現。</p></div><div class="wi-rest"><h2>性質</h2><p>根據妊神星族共同的紅外線水冰吸收模式及軌道元素的聚集性，其他柯伊伯帶天體，例如1995 SM55、(19308) 1996 TO66、(55636) 2002 TX300和(145453) 2005 RR433這些天體在可見光波段的光譜呈現中性色，顯示其表面缺乏複雜的有機物，而關於妊神星表面的詳細研究則顯示了這一點。</p><h2>參考資料</h2></div>
