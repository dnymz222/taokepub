<div class="wi-intro"><p>NGC 1501是一個複雜的行星狀星雲，威廉·赫歇爾於1787年8月27日在鹿豹座這個星座內發現它。它也被稱為牡蠣星雲。</p></div><div class="wi-rest"><h2>性質</h2><p>行星狀星雲的中心恆星的光譜類型為[WC4]，類似於富含碳的沃夫–瑞葉星。它是一顆脈動的恆星，這意味著它的亮度有規律地和週期性地變化。就NGC 1501的前身恆星而言，這是非常快的，恆星的亮度在短短半小時內發生了顯著變化。分析蓋亞的數據表明，中央恆星是一個聯星系統。可見光觀測捕捉到包括氫氣和氮氣在內的氣體輝光。星雲的總質量估計約為0.22 M☉，其中大部分是電離氣體（0.21 M☉）和一小部分（8.9×10−4 M☉）是富含碳的灰塵。</p><h2>圖集</h2><h2>參考資料</h2></div>
