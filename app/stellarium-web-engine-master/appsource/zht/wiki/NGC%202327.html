<div class="wi-intro"><p>IC 2177是位於麒麟座的邊界區域，靠近大犬座的一個星雲。它是以Be星HD 53367為中心，大致呈圓形的一個電離氫區（H II區）。這個星雲是由威爾斯的業餘天文學家艾薩克·羅伯茨發現的，他描述這是個"非常明亮，非常大，不規則的圓形，且非常瀰漫"。 "海鷗星雲"包括鄰近的星團、塵埃雲和反射星雲等區域，但有時被業餘天文學家用於這個氫離子區。這個氫離子區域還包括疏散星團NGC 2335和NGC 2343。 NGC 2327位於IC 2177內，因為它在海鷗星雲中的位置很顯著，佔比也夠大，因此它也被稱為海鷗頭。</p></div><div class="wi-rest"><h2>圖集</h2><h2>參考資料</h2></div>
