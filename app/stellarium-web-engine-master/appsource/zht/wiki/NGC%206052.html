<div class="wi-intro"><p>NGC 6052是一對正在碰撞中的星系，在天球上位於武仙座，距離地球約4億光年 。該星係由威廉·赫歇爾發現餘1784年6月11日。NGC天體表的編輯者約翰·路易·埃米爾·德雷耳形容該天體是「微弱、相當大、不規則圓形」 。 NGC 6052的兩個成員星系分別被編號為NGC 6052A和NGC 6052B。而這兩個星系被彼此的重力相互吸引、碰撞等交互作用。NGC 6052已經到達星系合併的的晚期階段，兩個成員星系已經無法明確分辨。 NGC 6052內曾經發現無線電波相當強烈的超新星SN 1982aa。</p></div><div class="wi-rest"><h2>圖集</h2><h2>參考資料</h2><h2>註釋</h2></div>
