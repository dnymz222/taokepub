<div class="wi-intro"><p>小行星84522（2002 TC302）是一個顏色偏紅的巨大共振海王星外天體（2:5），它是在2002年10月9日被帕洛馬山天文台的NEAT計畫發現的。</p></div><div class="wi-rest"><h2>軌道</h2><p>以39.058 至70.983 天文單位環繞著太陽運轉，由於共振的緣故，它每繞太陽二圈，海王星會繞太陽五圈。以如此長的軌道週期環繞太陽的外海王星天體 2002 TC302上回在10月抵達衝的位置時，視星等只有20.5等。</p><h3>表面</h3><p>偏紅的光譜表示2002 TC302的表面只有非常少量的冰，這也可以解釋它的反照率為何會偏低。</p><h2>參考資料</h2><h2>相關資料</h2><p>小行星 海王星外天體 離散盤</p></div>
