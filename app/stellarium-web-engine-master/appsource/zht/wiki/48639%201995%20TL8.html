<div class="wi-intro"><p>小行星48639（1995 TL8）是太陽系最外層的雙海王星外天體。阿里安娜·格里森於1995年發現小行星48639，直徑約176公里。小行星48639的衛星直徑80公里，暫時編號為S/2002 (48639) 1，於2002年11月9日被發現。</p></div><div class="wi-rest"><h2>發現</h2><p>1995年10月15日，小行星48639由美國天文學家阿里安娜·格里森（Arianna Gleason）在亞利桑那州圖森附近的基特峰國家天文台進行太空監視調查時發現。 小行星48639目前被歸類為第一顆發現的離散盤天體，比小行星15874早了近一年。</p><h2>參考資料</h2></div>
