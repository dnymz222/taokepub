<div class="wi-intro"><p>NGC 2280是一個位於大犬座的螺旋星系，距離地球7500萬光你哦按，直徑13.5萬光年，1835年2月1日由約翰·赫歇爾發現。2001年11月15日，中國科學院北京天文台在該星系中發現II型超新星SN 2001fz，視星等最大為17.4 。 NGC 2280星系核較小但明亮，星系中心黑洞質量在400萬到1500萬M☉之間。NGC 2280屬於NGC 2280 星系群。該星系群包括NGC 2292、NGC 2293、NGC 2295、ESO 490−G010和ESO 490−G045等星系，視直徑約為1°。</p></div><div class="wi-rest"><h2>參考</h2></div>
