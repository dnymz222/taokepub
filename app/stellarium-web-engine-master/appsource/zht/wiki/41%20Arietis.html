<div class="wi-intro"><p>胃宿三，即白羊座41（佛蘭斯蒂德命名法）或白羊座c（拜耳命名法），是一個位於白羊座的恆星系統，距離地球160光年。胃宿三的主星視星等為+3.61，是一顆B8Vn型的主序星。 雖然胃宿三是白羊座第三亮的恆星，僅次於白羊座α和白羊座β，但由於這顆恆星在歷史上屬於一個現代被廢棄的星座北蠅座，因此沒有希臘字母的拜耳命名，不過有時候也會稱它為白羊座c。白羊座41在中國星官系統中屬於西方白虎七宿中胃宿第三星，因此被稱為胃宿三 。 現在發現胃宿三有三顆伴星，它們的特徵如下：</p></div><div class="wi-rest"><h2>參考資料</h2></div>
