<div class="wi-intro"><p>蛇夫座ε，中文星官名天市右垣十或楚，是一顆位於蛇夫座的G型巨星。 它和蛇夫座δ一起組成光學雙星。蛇夫座ε距離地球108光年，而蛇夫座δ距離地球170光年，因此它們之間並沒有物理聯繫，只是從地球上觀察時處於幾乎相同的方向上。 蛇夫座ε在中國星官系統中屬於天市右垣，即天市垣的右城牆，天市右垣共由十一星組成，每顆星都由諸侯國或王國命名，而蛇夫座ε是以「楚」命名。蛇夫座ε是天市右垣的第十星，因此又被稱為天市右垣十。蛇夫座ε的西方名字叫Yed Posterior，它和蛇夫座δ一起合稱為Yed，這個名字來自於阿拉伯語，意思是「手」， 兩顆星共同象徵蛇夫握住巨蛇頭部的左手。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
