<div class="wi-intro"><p>NGC 6723是在人馬座的一個球狀星團，位置在靠近南冕座的交界處。它的視星等在6至6.8等，直徑在7和11弧分，在夏普力-索耶集中度分類法的類型為VII，星團中的恆星星等為14等。 與常見的球狀星團不同，NGC 6723具有較高的金屬量和大量年輕恆星，原始恆星僅占總數的0.363+0.017−%。</p></div><div class="wi-rest"><h2>參考資料</h2><p>Robert Burnham Jr, Burnham's Celestial Handbook: An observer's guide to the universe beyond the solar system, vol 3, p. 1558</p></div>
