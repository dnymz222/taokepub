<div class="wi-intro"><p>IC 438屬於哈伯序列中的螺旋星系，位於天兔座。根據估計，IC 438距離銀河系1億3,300萬光年，直徑約115,000光年。 1891年1月7日，美國天文學家路易斯·斯威夫特發現IC 438。</p></div><div class="wi-rest"><h2>特徵</h2><p>IC 438與其他四個星系一起形成了IC 438星系群或LGG 134。IC 438可能與IC 2151一起形成引力束縛星系對。 天文學家曾在IC 438觀測到超新星SN 1997B（Ic型）和SN 2017gbb（Ia型）。</p><h2>參考資料</h2></div>
