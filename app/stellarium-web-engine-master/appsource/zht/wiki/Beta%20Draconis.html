<div class="wi-intro"><p>天棓三（β Dra/天龍座β），英文名Rastaban，是北天拱極星座天龍座的第三亮星。視星等2.79，可以輕易用肉眼可見。基於依巴谷衛星的視差測量，它距離太陽大約380光年。</p></div><div class="wi-rest"><h2>性質</h2><p>這個雙星系統包含一個亮巨星被一個矮星以大約4000年環繞。 和太陽相比，這是一個巨大的恆星，有5倍太陽質量和40倍太陽半徑。天棓三輻射出大約1000倍太陽光度，表面溫度5,160K，散發出黃色調的光芒。它的恆星分類為G2IIa-Ib，亮度分類IIa-Ib代表它在恆星演化中處於亮巨星和超巨星間的階段。它的年齡大約有6700萬年。</p></div>
