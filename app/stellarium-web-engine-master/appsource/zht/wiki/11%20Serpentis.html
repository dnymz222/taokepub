<div class="wi-intro"><p>氐宿增二十一（巨蛇座11）是在星座巨蛇座的一顆恆星，距離太陽271 光年。它的拜耳名稱是巨蛇座A1（A1 Serpentis），巨蛇座11是佛蘭斯蒂德命名法賦予的名稱。這個天體的視星等為5.497，肉眼可見為一顆淡淡的橘色恆星。它以-16公里/秒的日心徑向速度朝向地球接近中。 這是一顆老化的巨星，恆星分類為K0III，是已經耗盡核心氫並膨脹的恆星。它是位於水平分支]上的一個紅群聚的巨星， 這表示它正在透過其核心的氦融合產生能量。氐宿增二十一的年齡約27.5億年，質量為1.3太陽質量，和半徑是太陽半徑的11倍。從其放大的光球層，以4,767 K的有效溫度，輻射出50倍的太陽光度 。</p></div><div class="wi-rest"></div>
