<div class="wi-intro"><p>天大將軍三（51 And / 仙女座51）是一顆四等星，為仙女座的第五亮星。它沒有拜耳名稱。在約翰·拜耳的測天圖(1603)和之後約翰·波德著名的星表波德星圖 (1801) 中，它常被稱作Nembus。 托勒密在他的天文學大成中也提到這顆恆星，但約翰·拜耳歸類到飛馬座，並得到飛馬座υ(υ Per)的名稱。佛蘭斯蒂德把它劃分到仙女座，國際天文學聯合會在1930年正式認定其名稱為仙女座51。 天大將軍三是一顆橙色K型巨星，視星等為+3.59，距離地球約177光年。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
