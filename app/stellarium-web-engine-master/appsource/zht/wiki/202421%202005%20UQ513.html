<div class="wi-intro"><p>小行星202421，也可寫作2005 UQ513，是一顆絕對星等為3.4的類冥矮行星。 邁克爾·E·布朗自動更新的網站將它列為很有可能的矮行星。2005 UQ513上有少量冰存在的跡象。</p></div><div class="wi-rest"><h2>分類</h2><p>2005 UQ513的近日點為37天文單位。小行星中心將它分類為經典柯伊伯帶天體，而深度黃道巡天則將其列為黃道離散天體。</p><h2>距離</h2><p>它目前距離太陽48.7天文單位。他將於公元2124年左右到達近日點。 它在9次沖時已被觀測到51次，最早的照片可追溯到1990年。</p><h2>參考資料</h2></div>
