<div class="wi-intro"><p>人馬座π，中文星官名建三 ，佛蘭斯蒂德命名法為人馬座41，是一個位於人馬座的三合星系統，距離地球440光年。 主星人馬座πA是一顆F2II型亮巨星，視星等為2.88。它擁有兩顆伴星：人馬座πB離主星（人馬座πA）只有0.1角秒（13天文單位）；人馬座πC視星等為6等，距離主星0.4角秒（40天文單位）。 由於人馬座π的位置接近黃道，故經常被月球所遮掩。此外，太陽系的行星如水星與金星等也可能遮掩它，但這現象非常罕見。下一次發生金星掩人馬座π將發生在2035年2月17日。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
