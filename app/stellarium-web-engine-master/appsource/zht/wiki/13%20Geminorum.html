<div class="wi-intro"><p>井宿一（μ Gem/雙子座μ），英文名Tejat，是北天星座雙子座的一顆恆星。</p></div><div class="wi-rest"><h2>特性</h2><p>井宿一的平均視星等為2.9，為雙子座中第四亮的恆星。因為該星接近黃道，它可以被月球掩星。於依巴谷任務中的視差測量顯示井宿一與地球的距離約為230光年(約71秒差距)。 井宿一是顆LB型慢不規則變星。其亮度在2.75等到3.02等間變化，變化週期為72日,長週期則為2000日。它是一顆屬於恆星光譜M3 III的紅巨星，表面溫度約3,650K，代表着它比太陽更大，但表面溫度卻比太陽為低。該星目前在漸近巨星分支，產生能量的來源是環繞惰性碳氧核心的殼層氫氦聚變。</p></div>
