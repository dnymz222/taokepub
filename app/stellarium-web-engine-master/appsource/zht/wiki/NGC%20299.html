<div class="wi-intro"><p>NGC 299 是杜鵑座的一個疏散星團。該星團位於小麥哲倫星系內部，距離地球將近20萬光年，於1834年8月12日由約翰·赫歇爾發現。 天文學家分析NGC 299的OGLE-III測光觀測資料，結果在這個年輕疏散星團內未發現低光變幅度的脈動變星，與其他小麥哲倫星系內的年輕疏散星團不同。</p></div><div class="wi-rest"><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 299</p><p>NED – NGC 299 SEDS – NGC 299 SIMBAD – NGC 299 VizieR – NGC 299</p></div>
