<div class="wi-intro"><p>M50或梅西耶50，也稱為NGC 2323，是位於麒麟座的一個疏散星團。它可能在1711年之前就被卡西尼發現，梅西耶在1772年4月5日觀測比拉彗星時，又再度獨立發現它。它有時也被描述或心形或鈍箭頭。 M50距離地球大約2,900光年，雖然與大犬座OB1星協接近，但估計關係並不緊密。它的核心半徑為5.9 ly（1.8 pc）， 範圍為17.8 ly（5.46 pc）。這個星團有508個已確認成員和109個可能的成員；它們的總質量超過285 M☉，平均恆星密度是每立方秒差距1.3顆恆星。星團的歷史大約有1.4億年，有兩顆大質量的白矮星和兩顆特殊恆星。</p></div><div class="wi-rest"><h2>圖集</h2><h2>參考資料和註解</h2></div>
