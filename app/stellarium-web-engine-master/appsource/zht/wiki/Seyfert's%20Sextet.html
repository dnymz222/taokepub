<div class="wi-intro"><p>西佛六重星系（Seyfert's Sextet）是個距離1.9億光年遠的星系集團 ，位置在巨蛇座的頭部。這個集團看起來有六個星系，但是其中一個是背景的星系，而另一個"星系"實際上只是其中一個星系分離了的一部分。引力的相互作用在這些星系之間應該已經進行了數億年的時間。最後，這些星系將合併成為一個橢圓星系。</p></div><div class="wi-rest"><h2>發現</h2><p>這個星系集團是卡爾·基南·西佛使用范德堡大學巴納德天文台的攝影乾片發現的。當這個結果在1951年首度發表時，這個集團是當時被辨認出的最緊密集團。</p><h2>成員</h2><h2>相關條目</h2><p>羅伯特四重星系 史蒂芬五重星系</p><h2>參考資料</h2></div>
