<div class="wi-intro"><p>鱉六（α CrA/南冕座α），是南冕座的最亮恆星，視星等為4.10。它是一個類似織女星的A型星，自轉非常快，接近崩裂速度。</p></div><div class="wi-rest"><h2>特性</h2><p>鱉六的恆星分類為A1V，距離地球大約125光年。該星的質量估計為2.1倍太陽，半徑2.2倍太陽。表面溫度大約9,100K，輻射出30倍太陽光度。 該星的年齡為2.54億年。 它是一個自轉快速的恆星，赤道的速度接近200km/s，自轉一周大約14小時。 像織女星，它有紅外線超量，代表它可能被塵埃盤環繞。</p><h2>參考資料</h2></div>
