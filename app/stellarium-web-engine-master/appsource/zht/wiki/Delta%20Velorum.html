<div class="wi-intro"><p>天社三(δ Vel / 船帆座δ)是船帆座的一顆恆星，距地球約79.7光年。天社三有時與船帆座ω和大犬座的恆星合稱為「弧矢」，意為「弓和箭」。 天社三由兩個雙星系統組成。該四顆恆星中最亮的是船帆座A，它是一顆A型的主序白矮星，視星等為+2.02。它的伴星船帆座B星等為+5.1，距船帆座A為2.6弧秒。另一個雙星系統在69弧秒之外，由11等的船帆座C和船帆座D組成，二者相距6弧秒。 最近，伽利略號探測器在木星發現天社三是一顆變星。它每45天亮度變化約30%。天社三是已知最亮的食雙星（儘管大陵五更加容易觀測）。 由於歲差的緣故，天社三將在公元9000年成為南極星。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
