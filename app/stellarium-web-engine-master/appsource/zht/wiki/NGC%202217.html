<div class="wi-intro"><p>NGC 2217是位於大犬座的一個透鏡狀星系，直徑約10萬光年，距離地球約6500萬光年。它是NGC 2217星系群的一部分，它被歸類為棒旋星系。 此星系的一個顯著的特徵是這個星系獨有的漩渦形狀。它的中心區域恆星非常密集，形成一個獨特的，明亮的恆星棒，外圍則是一個橢圓形的環。星系的更遠處可以看到一螺旋臂緊緊纏繞在恆星棒上，使其幾乎形成一個圓環星系。 恆星棒在星系的發展中起着重要的作用。例如，它可以把氣體運輸到星系的中心而被中央的星系黑洞吞噬，或形成新的恆星。</p></div><div class="wi-rest"><h2>參考</h2></div>
