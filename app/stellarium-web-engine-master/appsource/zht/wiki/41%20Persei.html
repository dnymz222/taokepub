<div class="wi-intro"><p>捲舌一，即英仙座ν（ν Persei），是一個位於英仙座恆星，距離地球約555光年。 捲舌一是一顆藍色F5II的高光度黃白色亮巨星，視星等為3.77。該星絕對星等為-2.37，總光度是太陽的約850倍。表面溫度約為6700K，根據其溫度和光度可以得知該星半徑為太陽的21倍，質量則為太陽的4-5倍。該星將繼續膨脹，成為一個紅巨星。</p></div><div class="wi-rest"><h2>參考資料</h2><p>HD 23230 -- Variable Star. SIMBAD Astronomical Database. [2006-12-10].</p></div>
