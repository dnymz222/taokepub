<div class="wi-intro"><p>鱉一（α Tel / 望遠鏡座α）是望遠鏡座的最亮星，視星等3.51。托勒密把它放在南冕座里，但是在18世紀被拉卡伊移入新創造的望遠鏡座。視差測量它距離地球278光年。 該星比太陽大很多，估計質量為5.6太陽和3.8太陽半徑。該星的恆星分類為B3V，亮度分類'V'代表這是一個主序星，核心正在進行氫聚變。鱉一是個很亮的恆星，有將近1000太陽光度，表面溫度16,700K，散發出藍白色的光芒。 該星可能是屬於慢脈動B型變星的變星。投影恆星自轉速度14km/s，對於這種類型的恆星相當緩慢，代表它的極區可能是對着我們。</p></div><div class="wi-rest"></div>
