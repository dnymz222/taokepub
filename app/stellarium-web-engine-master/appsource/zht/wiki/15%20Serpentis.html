<div class="wi-intro"><p>周增五（巨蛇座τ3，來自τ3 Serpentis 的拉丁化），是在赤道星座巨蛇座的一顆巨星。其視星等約為 6.11，在良好觀測條件下，此亮度足以肉眼隱約可見。根據視差測量，這顆恆星的距離約為358光年，並且它正以−22公里/秒的日心徑向速度向我們漂移。 這顆恆星的恆星分類為G8III:，與一顆G型巨星匹配。然而，後尾的冒號「：」顯示分類存在一定的不確定性。周增五（巨蛇座τ3）約有5億年歷史，質量是太陽的2.7倍，半徑已經擴展為太陽半徑的9.7倍，並且從4,864K有效溫度的光球層輻射出47倍太陽光度。</p></div><div class="wi-rest"></div>
