<div class="wi-intro"><p>鶴二(β Gru / 天鶴座β)是南天星座天鶴座的第二亮星，同時也被視作南魚座的魚尾。在古代阿拉伯天文學中，天鶴座α,δ,θ,ι和λ均被視作南魚座的一部分。 鶴二的表面溫度約 3,400 K，是太陽表面溫度的60%，這使得它呈現出一種晦暗的紅色。總光度約為太陽的3,800倍，半徑估計為0.8天文單位(120,000,000 km)，大概是太陽半徑的180倍。 鶴二是SRB型半規則變星，亮度變化於2.0到2.3之間。 鶴二在2001年12月珀斯天文台跟蹤彗星2000WM1 Linear的過程中起到了關鍵性的作用。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
