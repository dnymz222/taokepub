<div class="wi-intro"><p>斗（dǒu）宿（xiù）四（σ Sgr / 人馬座σ）又名天機星，是人馬座的第二亮星，距離地球約228光年（70秒差距），視星等+2.1，光譜型B3。斗宿四聚星系統的總光度約為太陽的3300倍，總質量約為太陽的7倍。主星的質量為太陽的5倍，表面溫度約為20,000K。斗宿四有一顆視星等為+9.5的伴星：σ Sgr B，二者相距5.2弧分。斗宿四還可能有更靠近的伴星。 考古學家發現其現代名稱Nunki來源於亞述或巴比倫，並由R.H.Allen介紹給大眾。 斗宿四靠近黃道，所以會被月亮以及行星（很少）遮擋。上一次該現象發生在1981年11月17日，那時斗宿四被金星遮擋。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
