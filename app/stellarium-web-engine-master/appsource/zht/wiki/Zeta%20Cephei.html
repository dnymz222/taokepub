<div class="wi-intro"><p>仙王座ζ（造父二），又名BD+57 2475，HD 210745、SAO 34137、HR 8465，是仙王座的一顆恆星，視星等為3.35，位於銀經103.06，銀緯1.67，其B1900.0坐標為赤經22h 7m 23s，赤緯+57° 1.67′ 30″。仙王座的一個橙色超巨星，光譜為K1.5Ib，這個恆星距離我們大約850光年，真實光度約是太陽的4500倍。該星的總質量約為太陽的8倍，富含金屬元素。這個恆星的金屬量是太陽的1.6倍。根據表面溫度和總光度，推導出這顆恆星的大小為太陽的126倍。</p></div><div class="wi-rest"></div>
