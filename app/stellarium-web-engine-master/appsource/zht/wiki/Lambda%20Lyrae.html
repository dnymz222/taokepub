<div class="wi-intro"><p>天琴座λ，又名BD+31 3424，HD 176670、SAO 67682、HR 7192，是天琴座的一顆恆星，視星等為4.93，位於銀經62.91，銀緯12.38，其B1900.0坐標為赤經18h 56m 14.4s，赤緯+32° 12.38′ 20″。該星是一個橙紅色亮巨星，距離我們1550光年。絕對星等為-3.7.總的輻射能量預計為太陽的8000倍，該星表面溫度為4250K，遠低於太陽，因此該星之所以有如此高的亮度均得益於巨大的體積。該星的直徑為太陽的170倍，根據光度推算其質量為8個太陽質量。</p></div><div class="wi-rest"></div>
