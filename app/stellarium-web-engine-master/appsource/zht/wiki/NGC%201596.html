<div class="wi-intro"><p>NGC 1596 位於劍魚座α星西方約1°，是一個以側面朝向我們的小星系，分類為S0的透鏡星系，視星等11.1等，藍星等12.1等，視大小約3.7'x.9'，表面亮度12.3等，像是一個縮小版的寬帽星系,於1834年12月5日被約翰·弗里德里希·威廉·赫歇爾發現。這個星系需要14吋（35公分）以上的望遠鏡才能看見，一些視野較大的影像會同時呈現，星等13等，非常靠近的NGC 1602。</p></div><div class="wi-rest"><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 1596</p><p>NED – NGC 1596 SEDS – NGC 1596 SIMBAD – NGC 1596 VizieR – NGC 1596</p></div>
