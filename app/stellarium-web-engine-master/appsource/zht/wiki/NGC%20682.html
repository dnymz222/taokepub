<div class="wi-intro"><p>NGC 682 是鯨魚座的一個星系，相對於宇宙微波背景輻射的速度為5,338±26公里/秒，對應的哈伯距離為78.7±5.5Mpc（約2.57億光年）。 德裔英國天文學家威廉·赫歇爾於 1785 年 12 月 30 日發現NGC 682 科學家曾在NGC 682中觀測到一顆超新星：SN 2023xtg（Ia型超新星，視星等18.1等）由板垣公一於2023年11月14日發現。</p></div><div class="wi-rest"><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 682</p><p>NED – NGC 682 SEDS – NGC 682 SIMBAD – NGC 682 VizieR – NGC 682</p></div>
