<div class="wi-intro"><p>蜀增二（巨蛇座3）是在赤道星座巨蛇座的一顆軌道週期大約66年的聯星。它的視星等為5.34，雖然黯淡，但依然肉眼可見。它是一顆已耗盡其核心氫的恆星，光譜分類K0III，距離地球約114秒差距（370光年），是顆橙巨星。 蜀增二的兩顆恆星可利用散斑干涉法解析，2014年時相距0.23"。其軌道高度離心，1997年通過軌道近星點時，兩者相距僅6毫秒。 K0III的光譜類型是兩顆恆星合併的，因目前尚無法獲得蜀增二的兩個成員恆星個別的光譜。主星的星等比伴星亮2.5等，並且表面溫度較冷。綜合光譜類型顯示主星很可能已演化離開主序星，但對伴星的顏色與亮度比較，顯示它仍屬主序星。</p></div><div class="wi-rest"></div>
