<div class="wi-intro"><p>NGC 5000是位於后髮座棒旋星系，也被稱為 LEDA 45658、MCG+05-31-144、UGC 8241、VV 460、III 366、h 1544 和 GC 3433。 NGC 5000由德裔天文學家威廉·赫歇爾於1785年發現的，威廉·赫歇爾藉助18.7吋f/13望遠鏡發現NGC 5000。NGC 5000非常暗淡且小型，呈不規則圓形，濃度也很弱。 天文學家曾在NGC 5000中觀測到一顆超新星：SN 2003el（Ic型，18.8等）。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
