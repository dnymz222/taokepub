<div class="wi-intro"><p>NGC 1566 是劍魚座的一個中間螺旋星系。由詹姆士·丹露帕發現於1826年5月28日。該星系是劍魚座星系團的重要成員星系，並且是其中亮度最高者該星系是已知最明亮的塞弗特星系之一。NGC 1566的絕對光度為3.7×1010 L☉，並且內部中性氫區（H I）質量達到1.4×1010 M☉。</p></div><div class="wi-rest"><h2>SN 2010el</h2><p>2010年6月19日，南非天文學家貝圖·莫納德在NGC 1566內，星系中心西方13角秒、南方22角秒處發現了視星等16等的超新星，天球座標04 19 58.83 -54 56 38.5。</p><h2>參考資料</h2></div>
