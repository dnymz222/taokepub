<div class="wi-intro"><p>NGC 5907是個距離地球大約3,900萬光年遠的螺旋星系，它的金屬量異於正常的低，和有少許可檢測到的巨星，整個星系幾乎都由矮星組成。 1788年5月5日，威廉·赫歇爾發現這個星系，是NGC 5866星系群的成員之一。超新星1940 A以及2026Kid出現在這個星系內。</p></div><div class="wi-rest"><h2>NGC 5906</h2><p>NGC 5907也被稱為NGC 5906。第二個NGC編號指的是位於塵埃帶西側的星系較暗的部分，由愛爾蘭天文學家兼物理學家喬治·約翰斯通·斯托尼於1850年4月13日記錄下來。</p><h2>參考資料</h2></div>
