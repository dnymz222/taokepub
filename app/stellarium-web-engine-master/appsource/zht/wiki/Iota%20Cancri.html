<div class="wi-intro"><p>軒轅增廿二 (ι Cnc/巨蟹座ι) 是一個在巨蟹座的雙星，距離地球大約330光年。 巨蟹座ι的兩顆星距離30弧秒，只有緩慢的改變。雖然沒有計算出軌道，但兩星的自行十分相似，被認為是有引力關係的。 較亮的巨蟹座ι A，是一個黃色的G型亮巨星，視星等4.02。它是個鋇星，認為是由漸近巨星分支星傳輸物質給伴星造成的。在巨蟹座ι系統裡沒有找到這個貢獻者，但是推測有一個未看見的白矮星。 較暗的巨蟹座ι B，是一個白色的A型主序星，視星等6.57。它是個殼層星，被快速自轉拋出的物質環繞。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
