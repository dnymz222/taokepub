<div class="wi-intro"><p>NGC 1510 是時鐘座的一個SA0型透鏡狀星系。該星系距離地球約4000萬光年，直徑約15000光年。屬於矮星系的NGC 1510和鄰近更大的NGC 1512互為交互作用星系，兩者之間距離約68000光年。 該星系於1836年12月4日由英國天文學家約翰·赫歇爾發現。</p></div><div class="wi-rest"><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 1510</p><p>NED – NGC 1510 SEDS – NGC 1510 SIMBAD – NGC 1510 VizieR – NGC 1510</p></div>
