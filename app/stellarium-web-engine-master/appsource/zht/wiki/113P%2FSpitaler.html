<div class="wi-intro"><p>113P/史匹塔勒彗星是太陽系內的一顆週期彗星，於1890年11月17日被在奧地利維也納的魯道夫·費迪南·史匹塔勒發現，當時他正試圖觀察 C/1890 V1（Comet Zona）。 史匹塔勒和喬治·瑪麗·塞爾、J.F.坦南特、J.R. 欣德一起依據觀測計算這顆彗星的軌道，儘管預測在1897年會回歸，但仍然失去了蹤跡，並且在之後的幾十年內都未能尋獲。 在1993年10月24日，這顆彗星被美國亞利桑那州基特峰天文台的詹姆斯·弗農·斯科悌重新發現，並且經由布萊恩·馬斯登將1890年和1994年的出現連繫在一起，確認是113P/史匹塔勒彗星。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
