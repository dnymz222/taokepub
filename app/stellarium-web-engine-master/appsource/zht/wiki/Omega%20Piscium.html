<div class="wi-intro"><p>霹靂五（ω Psc / 雙魚座ω）是雙魚座的一顆恆星，距離地球約106光年，光譜型F4IV。它是一顆亞巨星或矮星，表面溫度約6,600開。它可能是一個密近雙星系統。通過光譜變化推測其繞行周期為2.16天，但後來被證明是錯誤的。如果該星是一顆獨立的恆星，它的光度為太陽的20倍，質量為太陽的1.8倍。 據稱霹靂五的俗名為Vernalis，即拉丁語的「春天的」意思，因為該星位於春分點。 在佛氏星號和希臘字母的編號、以及含有專名的恆星中，霹靂五是赤經最大的恆星。由於地軸以26,000年的周期擺動，在2013年，霹靂五的赤經將會變為0h。它是雙魚座小環東邊的第一顆星。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
