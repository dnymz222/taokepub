<div class="wi-intro"><p>NGC 6210是一個位於武仙座的行星狀星雲；距離地球約6500光年。該星雲形狀像一隻烏龜，中心是瀕死的白矮星。1825年由俄國天文學家瓦西里·雅可夫列維奇·斯特魯維發現。</p></div><div class="wi-rest"><h2>內部結構</h2><p>形成 NGC 6210 的前身星質量推測比太陽稍小。該星雲內部的結構因為垂死恆星的多次噴發，形成不同層次的複雜結構。外部較暗的部份（影像中為紅色）看起來像海龜的殼，直徑約 1.6 光年；而內部較亮的部份看起來則像鸚鵡螺的殼，直徑約 0.5 光年。 下方假色影像中佔據大部分區域的紅色是代表氫，藍色代表一次電離的氧離子，綠色則是二次電離的氧離子。</p><h2>參考資料</h2></div>
