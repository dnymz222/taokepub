<div class="wi-intro"><p>左更五，即白羊座π（π Ari, π Arietis），是一個位於白羊座的恆星系統，，它距離地球約603光年。 左更五包括一個光譜聯星系統以及兩顆伴星。這個光譜聯星系統被分類為B-型主序星，視星等為+5.26。第一顆伴星是一顆白色A-型主序星，距離聯星系統3.2角秒，視星等為8.8。第二顆伴星是一顆黃白色F-型主序星，距離聯星系統25.2角秒，視星等為10.9。 白羊座π在中國星官系統中屬於西方白虎七宿中婁宿的星官左更第五星，因此被稱為左更五 。在西方和白羊座δ、白羊座ε、白羊座ζ和白羊座ρ3一起並稱為Al Botein，來自於阿拉伯語بطين，意思為「腹部」。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
