<div class="wi-intro"><p>NGC 1854（又名NGC 1855）是劍魚座的一個年輕球狀星團，位於大麥哲倫星系中央條形結構的北部。該星團在200倍的放大下非常明亮，大而圓，可以看到幾十顆非常微弱的恆星。其東南方向為NGC 1858，一個星雲或星團天體。 蘇格蘭天文學家詹姆士·敦洛普於1826年8月2日由首次觀測了該星團。</p></div><div class="wi-rest"><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 1854</p><p>NED – NGC 1854 SEDS – NGC 1854 SIMBAD – NGC 1854 VizieR – NGC 1854</p></div>
