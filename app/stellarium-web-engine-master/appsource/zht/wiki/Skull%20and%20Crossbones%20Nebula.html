<div class="wi-intro"><p>NGC 2467是一個恆星形成區域，俗稱「骷髏頭星雲」，其外觀偶爾也被比喻為色彩豐富的山魈。它包括含有大量氫氣的區域，產生新的恆星。它是特倫斯·迪金森著作《哈勃的宇宙：最偉大的發現和最新畫面》（Hubble’s Universe: Greatest Discoveries and Latest Images）一書中被作為特色描述的區域之一。 NGC 2467曾長期被認為是船尾座的核心。然而，NGC 2467並不指一個特殊的開放星群，其實，它是由幾個具有明顯不同的距離和明顯不同的徑向速度的恆星組疊加在一起，這些恆星組在視線上大致在同一條線上。</p></div><div class="wi-rest"><h2>腳註</h2><h2>參考資料</h2></div>
