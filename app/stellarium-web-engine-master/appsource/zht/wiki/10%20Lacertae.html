<div class="wi-intro"><p>蝎虎座10（10 Lac），中國傳統名稱車府增十一，是蝎虎座的一顆恆星，視星等為4.88，位於銀經96.65，銀緯-16.98。蝎虎座10距離地球約700秒差距（2,300光年），是蝎虎座OB1（Lacerta OB1）星協的成員。蝎虎座10是高溫且大質量的O型主序星，光譜型O9V。它可能是仙王座β型變星。</p></div><div class="wi-rest"><h2>概要</h2><p>蝎虎座10是第一批被確認的O型恆星之一（與四瀆增一），並且自20世紀初開始一直被視為摩根-肯那光譜分類法的分類定位點之一。具體來說，它是光譜O9V恆星的代表，是主序帶上表面溫度相對較低的O型恆星。 蝎虎座10有一個視星等8的伴星，在天球上距離約1角分。</p></div>
