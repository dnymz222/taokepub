<div class="wi-intro"><p>天壇座α (α Ara / α Arae) 是天壇座內第二亮的恆星，它的傳統名稱源自中文普通話的Tchou或Choo，意思是杵(chǔ)。 天壇座α是一顆藍-白的B型主序矮星，距離地球約242光年。它是一顆Be星，光度在+2.79至 +3.13之間變動，平均視星等 +2.84。 有些研究顯示天壇座α是一顆以非常高速度自轉的恆星，在赤道的速度是每秒470公里 （頁面存檔備份，存於網際網路檔案館）。</p></div><div class="wi-rest"><h2>參考資料</h2><p>HR 6510 （頁面存檔備份，存於網際網路檔案館） HR 6510 （頁面存檔備份，存於網際網路檔案館） Image Alpha Arae</p><h2>伴星</h2></div>
