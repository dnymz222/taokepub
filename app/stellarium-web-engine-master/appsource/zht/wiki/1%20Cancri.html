<div class="wi-intro"><p>水位增九或巨蟹座1（英語：1 Cancri，縮寫1 Cnc）是巨蟹座中的一顆恆星，位於雙子座邊界附近，距太陽約467光年。它是一顆暗淡的橙色恆星，肉眼幾乎看不見，視星等為5.97。該物體正以+14公里/秒的日心徑向速度遠離地球。 這是一顆演化的巨星，恆星分類為K3−III，其核心的氫已耗盡並膨脹。它被指定為該類型的光譜標準。通過掩月測得的恆星角直徑為2.1±0.6 mas，按照其估計距離，其物理半徑相當於太陽半徑的19倍左右。它的擴大光球層的有效溫度為4,231 K，輻射出的光度是太陽光度的199倍。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
