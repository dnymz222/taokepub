<div class="wi-intro"><p>巨蛇座τ2，來自τ2Serpentis 的拉丁化為Tau2Serpentis，是位於星座巨蛇座中的一顆恆星，距離太陽大約480光年。視星等為6.22，對肉眼觀測具有挑戰性。恆星正以 −19公里/秒的徑向速度。 這個天體是一顆晚期B型主序星，恆星分類為B9V。它很可能是一顆牧夫座λ型星的恆星。這顆恆星的年齡為2億7800萬年和以154公里/秒的投影旋轉速度自轉。它的質量幾乎是太陽質量的三倍，半徑是太陽的三倍。巨蛇座τ2在有效溫度10,839 K下，從其光球層輻射出太陽光度91倍的光度。 有證據顯示可能存在伴星，該伴星約佔該系統總排放的15%。</p></div><div class="wi-rest"></div>
