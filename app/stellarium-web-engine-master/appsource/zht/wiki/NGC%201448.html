<div class="wi-intro"><p>NGC 1448 是時鐘座的一個星系。為1835年英國著名天文學家、數學家約翰‧赫歇爾（John Herschel）首次發現。此後的天文學家觀測到NGC 1448發生四次超新星爆發。 2009年天文學家發現NGC 1448中心存在一個超級黑洞。而且該星系中有大量年輕恆星，年齡僅約500萬年。</p></div><div class="wi-rest"><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 1448</p><p>NED – NGC 1448 SEDS – NGC 1448 SIMBAD – NGC 1448 VizieR – NGC 1448</p></div>
