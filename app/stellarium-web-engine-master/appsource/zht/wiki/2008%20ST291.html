<div class="wi-intro"><p>小行星528381（2008 ST291）是一顆太陽系海王星外天體，絕對星等為4.3等，2008 ST291可能是矮行星。</p></div><div class="wi-rest"><h2>軌道</h2><p>2008 ST291於1954年通過近日點，目前距離太陽59天文單位。2016年，22008 ST291將距離太陽超過60天文單位。天文學家已經觀測過3次22008 ST291衝。</p><h2>物理性質</h2><p>因為天文學家尚無法得知2008 ST291的反射率，所以2008 ST291大小仍不清楚，直徑可能介於370公里至820公里之間。</p><h2>參考資料</h2></div>
