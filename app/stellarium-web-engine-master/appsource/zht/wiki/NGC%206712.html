<div class="wi-intro"><p>NGC 6712是一個位於盾牌座球狀星團，很可能是紀堯姆·勒讓蒂於1749年7月9日調查天鷹座銀河星雲時發現的。他將其描述為「真正的星雲」，與疏散星團野鴨星團形成鮮明對比。1784年6月16日，NGC 6712由威廉·赫雪爾獨立發現，編目號為H I.47；他也首先將其歸類為圓形星雲。約翰·赫歇爾在1830年代的觀測中第一次將其描述為球狀星團。該星團似乎已有約 120億年的歷史，並且由於穿過銀盤而經歷了顯著的質量損失，因此最初的質量可能要大得多。對球狀星團來說，NGC 6712的金屬含量相當豐富。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
