<div class="wi-intro"><p>30P/雷睦斯彗星也稱為雷睦斯一號彗星，是卡爾·雷睦斯在1928年2月22日於太陽系發現的一顆週期彗星。</p></div><div class="wi-rest"><h2>觀測史</h2><p>最初計算的軌道週期為25年，但最後修訂為7年，並且被懷疑是自從1915年就失蹤的69P/泰勒彗星。經由喬治·范·比斯布魯克進一步的計算，才確認這是一顆新發現的彗星。. 1935年出現時並不利於觀測，這顆彗星在1937年接近木星，使近日點的距離和軌道週期增加。 由於誤判，錯過了1942年的回歸，但後續的每次回歸都被觀測到。</p><h2>物理性質</h2><p>估計這顆彗星的彗核直徑約為7.8公里。</p><h2>參考資料</h2></div>
