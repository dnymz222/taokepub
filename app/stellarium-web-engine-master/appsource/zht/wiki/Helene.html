<div class="wi-intro"><p>土衛十二又稱為「海倫」（S/1980 S 6，Helene），是環繞土星運行的一顆衛星。於1980年被南比戈爾峰天文台發現。1988年，土衛十二被命名為海倫。這個名字是來源於希臘神話中的海倫。 土衛十二（海倫）與土衛四（狄俄涅）共軌，並且駐留在土衛四的拉格朗日點 (L4)，跟隨在土衛四前方 60度。狄俄涅還有另一顆駐留在後方60度另一個拉格朗日點L5上的衛星土衛三十四 (「波呂丟刻斯」)。</p></div><div class="wi-rest"><h2>概述</h2><p>這顆衛星半長軸約為377,396公里，繞土星公轉週期2.736915天，與黃道及土星赤道的軌道傾角為0.199°，軌道離心率0.0022。</p><h2>參考資料</h2></div>
