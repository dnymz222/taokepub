<div class="wi-intro"><p>天囷十，即鯨魚座75，又名BD-01 353，HD 15779、SAO 129959、HR 739，是鯨魚座的一顆恆星，視星等為5.35，位於銀經169.94，銀緯-54.44，其B1900.0坐標為赤經2h 27m 4s，赤緯-1° -54.44′ 35″。 目前在該恆星旁發現一顆屬於氣體巨行星的系外行星。該行星從母恆星接受的照射量高於木星甚至地球。</p><p>觀測資料顯示另有其他影響週期的因素，可能是尚未探測到的質量在0.4到1倍木星，距離母恆星0.9到4天文單位的行星。</p></div><div class="wi-rest"></div>
