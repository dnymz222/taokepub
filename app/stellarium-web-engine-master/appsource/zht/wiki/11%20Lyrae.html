<div class="wi-intro"><p>天琴座δ，又名BD+36 3307，HD 175426、SAO 67537、HR 7131，是天琴座的一顆恆星，視星等為5.58，位於銀經66.93，銀緯15.49，其B1900.0坐標為赤經18h 50m 13.9s，赤緯+36° 15.49′ 48″。這對雙星是一個非常奇異的天體，主星是5.6等的藍白色矮星，質量有太陽的8-10倍之大，9.8等的伴星質量小得多，但是已經進入紅巨星階段。由於質量偏低，伴星光度比一般紅巨星要小一些，大約是太陽的10倍亮。這對雙星類似於大陵五雙星，質量小的伴星演化快，而大的主星還是主序星，極有可能是激烈的質量交流所致。</p></div><div class="wi-rest"></div>
