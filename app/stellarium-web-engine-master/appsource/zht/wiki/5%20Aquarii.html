<div class="wi-intro"><p>女增一（寶瓶座5，英語：5 Aquarii）是在黃道，也是天球赤道星座寶瓶座中的一顆單獨恆星。基於視差，距離太陽約780光年。「寶瓶座5」是源自佛蘭斯蒂德命名法的名稱。其視星等為5.55，肉眼可見其為一顆淡淡的藍白色恆星。這個天體正以 −3公里/秒的日心徑向速度接近地球。 這是一顆疑似化學異常的恆星，恆星分類為B9III，然而Adelman等人（2004）認為它是一顆元素豐度接近太陽的恆星。其投影自轉速度為25公里/秒，而它的譜線相對銳利。 該恆星在11,200 K的有效溫度下，從其光球層輻射出318倍的太陽光度。</p></div><div class="wi-rest"></div>
