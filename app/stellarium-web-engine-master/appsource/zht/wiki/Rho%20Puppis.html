<div class="wi-intro"><p>弧矢增三十二(船尾座ρ)，又名CD-23 6828，HD 67523、SAO 175217、HR 3185，是船尾座的一顆恆星，視星等為2.81，位於銀經243.15，銀緯4.4，其B1900.0坐標為赤經8h 3m 17.1s，赤緯-24° 4.4′ 57″。已知溫度最低的盾牌座δ型變星，表面溫度6920K,變光周期0.14天。這顆恆星是一個中年恆星，剛剛脫離主星序。其質量為太陽的1.85倍，半徑則為3.5個太陽半徑，已有20億年年齡。雖然該星被分類為亮巨星，但是這僅僅依據於其光譜中的某些譜線，該星的真本光度是太陽的22倍，介於巨星和次巨星之間。亮巨星的光度則通常超過太陽的500倍。</p></div><div class="wi-rest"></div>
