<div class="wi-intro"><p>NGC 2477是在星座船尾座的一個疏散星團，天球座標為赤經7時52.3分，赤緯-38度33分，亮度約5.8視星等，距地球3,600光年。大約包含300顆恆星，於1751年由拉卡伊發現。這個星團的年齡約7億年。</p></div><div class="wi-rest"><h2>視覺外觀</h2><p>NGC 2477是一個令人驚豔的星團，在天空中的範圍約27角分，幾乎與滿月一樣大，是天空中最大的疏散星團之一。它像是一個高解析下的球狀星團，但是沒有球狀星團的中心密集特徵。伯納姆注意到一些觀測者評論說，它雖然比M46小，更恆星數量更多，也更緊湊。</p><h2>距離</h2><p>伯納姆列舉了幾個可能的距離，範圍從700秒差距（2,300光年） 到 1,900秒差距（6,200光年）。</p><h2>註解</h2></div>
