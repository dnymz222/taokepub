<div class="wi-intro"><p>柱三，即御夫座η（η Aur, η Aurigae）是一顆位於御夫座的恆星，距離地球約219光年。 柱三是一顆藍白色B-型主序星，視星等為+3.18。 在中國古代星官系統中，它屬於西方白虎七宿畢宿的星官柱第三星，這也是柱三名字的來由。在西方，它被稱為Hoedus II（或Haedus II）和Mahasim。它被認為是母羊（御夫座α，即五車二）所生的兩隻小羊之一（另一隻是御夫座ζ，即柱二），因此被稱為Haedus II。Mahasim這個名字來自於阿拉伯語المِعْصَم(al-micşam)，意思為「（戰車的駕馭者）的腕部」，這個名字和御夫座θ（即五車四）分享。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
