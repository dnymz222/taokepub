<div class="wi-intro"><p>NGC 4459是一個位於后髮座的透鏡狀星系，距離地球約5000萬光年。該星系也被歸類為LINER星系。天文學家威廉·赫歇爾於1787年1月14日發現了NGC 4459。該星系是室女座星系團的成員。</p></div><div class="wi-rest"><h2>物理特性</h2><h3>塵埃盤</h3><p>NGC 4459的中心有一個圍繞着內環的絮狀塵埃盤。此外，似乎還有證據表明，塵埃盤中正在發生恆星形成。</p><h3>超大質量黑洞</h3><p>NGC 4459有一個超大質量黑洞，估計其質量約為7000萬個太陽（7×107 M☉）。其直徑估計約為2.87個天文單位 。</p><h2>參考資料</h2></div>
