<div class="wi-intro"><p>NGC 6872是位於孔雀座的 SB(s)b pec型棒旋星系，距離地球2億1200萬光年(65 Mpc)。NGC 6872正在與透鏡狀星系IC 4970相互作用，後者的大小還不到其十二分之一。該星係有兩條細長的旋臂，根據紫外線觀測，NGC 6872的直徑超過522,000光年（160,000 pc），D25.5等照度線直徑超過717,000光年（220,000 pc），為人類已知最大的螺旋星系。1835年6月27日，英國天文學家約翰·赫歇爾發現NGC 6872。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
