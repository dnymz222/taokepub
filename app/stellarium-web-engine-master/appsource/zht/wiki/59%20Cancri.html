<div class="wi-intro"><p>軒轅增六或巨蟹座σ2（英語：σ2 Cancri），又叫巨蟹座59，是位於巨蟹座的一顆孤立白色恆星。用肉眼觀察隱約可見它的存在，視星等為+5.44。根據從地球觀察到的每年16.79 mas的視差變化，這顆恆星距離太陽約194光年。 這是一顆A型次巨星，恆星分類為A7 IV，估計年齡為4.41億年。它的自轉速度相對較快，預計自轉速度為133 K。這顆恆星的質量估計是太陽質量的1.8倍，其光球層的輻射光度是太陽光度的21.5倍，有效溫度約為8,309 K。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
