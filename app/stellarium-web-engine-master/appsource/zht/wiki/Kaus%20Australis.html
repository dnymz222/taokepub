<div class="wi-intro"><p>箕（jī）宿（xiù）三（ε Sgr / 人馬座ε）是一個位於人馬座的雙星系統，距離地球144.64光年。人馬座εB亮度為14，和人馬座εA相距32角秒。箕宿三是人馬座中的「弓」的底部，也是「茶壺」座的底部。這個恆星已經脫離了主序星階段，逐漸向着巨星演化.該星質量遠遠超過太陽，因此亮度達到了315個太陽亮度，總輻射波段光度則為太陽的430倍。它的半徑已經膨脹至7個太陽半徑，接下來數千萬年內它將變得更紅更大。 其英文傳統名稱是Kaus Australis，有兩種語言的兩個字組成：阿拉伯語中的قوس（qaws），意為「弓」和拉丁語中的austrālis，意思是「南邊」。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
