<div class="wi-intro"><p>山案座α（Alpha Mensae）是山案座的最亮恆星，視星等5.09，是所有星座最亮星中最暗的。</p></div><div class="wi-rest"><h2>概要</h2><p>山案座α是一顆黃矮星，半徑、溫度和光度都稍低於太陽，但質量比太陽稍高。它的赤緯代表它適合在南半球高緯度區域觀測；雖然在靠近赤道的北半球低緯度在山案座α過中天附近時也可觀測到。 山案座α在天球上的自行較高，距離太陽約33光年。目前尚未發現它有行星，但已經發現有一顆天球上距離3.05角秒（大約30天文單位）的紅矮星伴星。</p><h2>參考資料</h2></div>
