<div class="wi-intro"><p>M97（同時名為夜梟星雲、貓頭鷹星雲或NGC3587），它的名字來自於它的盤上的兩個暗區。它是一個行星狀星雲，面積為3.4' x 3.3'，亮度為+9.9等，用12英寸（30厘米）望遠鏡可見。 M97是法國天文學家皮埃爾·梅香（Pierre Méchain）1781年發現的。它是一個比較複雜的行星狀星雲，它的中心星約16等亮，其質量為太陽的0.7倍，星雲本身約為0.15太陽質量。它大約是6000年前形成的。 M97位於大熊座，坐標為：</p><p>赤經：11h14m48.00s 赤緯：+55°01'00.0"</p></div><div class="wi-rest"></div>
