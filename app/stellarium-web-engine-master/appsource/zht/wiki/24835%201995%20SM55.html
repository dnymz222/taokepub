<div class="wi-intro"><p>小行星24835（1995 SM55）是柯伊伯帶的一顆海王星外天體。</p></div><div class="wi-rest"><h2>發現</h2><p>它在1995年9月19日由Nichole M. Danzl發現。</p><h2>起源</h2><p>基於妊神星族天體有着類似的紅外水冰吸收和中性可見光譜 以及軌道元素相仿，柯依伯帶天體1995 SM55, (19308) 1996 TO66, (55636) 2002 TX300, (120178) 2003 OP32, and (145453) 2005 RR43都源於矮行星妊神星的碰撞產物。</p><h2>參考資料</h2></div>
