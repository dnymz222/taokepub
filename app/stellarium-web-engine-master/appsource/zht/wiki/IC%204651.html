<div class="wi-intro"><p>IC 4651是一個位於天壇座，距離地球約2900光年的疏散星團，最早由約翰·路易斯·埃米爾·德雷爾在他的1895年版NGC天體表中記錄。 IC 4651的年齡大約為1.2±0.2億年，屬於中等年齡的星團。 與太陽相比，該星團中的恆星具有更高的化學元素豐度（氫和氦除外）。 IC 4651中活動恆星的總質量約為630個太陽質量。目前已知的活動恆星的質量只占星團初始質量的約7%。剩餘質量中約35%演化成了白矮星或其他緻密星。其餘丟失質量組成的恆星星已經離開了星團主體或完全離開星團。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
