<div class="wi-intro"><p>NGC 6744是位於孔雀座的一個中間螺旋星系，距離地球大約3,000萬光年 。它被認為是類似銀河系的眾多螺旋星系中最接近的之一，有著絮結的 (蓬鬆的) 旋臂和細長的核心。它至少還有一個被扭曲的衛星星系 (NGC 6744A)，外觀上類似大麥哲倫星系。 2005年在NGC 6744內發現一顆超新星。 NGC 6744是室女座超星系團的成員星系。</p></div><div class="wi-rest"><h2>圖集</h2><h2>相關條目</h2><p>NGC 2336：另一個體積和形狀相近的螺旋星系。 NGC 1232</p><h2>參考資料</h2></div>
