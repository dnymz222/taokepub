<div class="wi-intro"><p>瓠瓜四（β Del/海豚座β），英文名Rotanev，是一個位於海豚座的雙星。它是海豚座的最亮星。</p></div><div class="wi-rest"><h2>特性</h2><p>在1873年美國天文學家S. W. Burnham發現瓠瓜四是一個聯星系統。這個系統包含了一對F型恆星以周期26.66年，偏心率0.36互相繞行。軌道平面與地球視線傾斜61度。兩星的角距離為0.44弧秒，要用望遠鏡分離有些難度。比較大的成員是一個巨星，有1.8倍太陽質量，18倍太陽光度，伴星是個次巨星，有1.6倍太陽質量，大約9倍太陽光度。這個系統的年齡大約18億年。</p></div>
