<div class="wi-intro"><p>NGC 1399 是天爐座的一個橢圓星系。位於天爐座星系團的中心。</p></div><div class="wi-rest"><h2>概要</h2><p>NGC 1399屬於CD型星系，擁有明亮的核心和周圍巨大的彌散結構。該星系周圍有大量球狀星團，估計約在5700到6500個之間。 NGC 1399中心有一個質量約為太陽5億倍的超大質量黑洞。</p><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 1399</p><p>NED – NGC 1399 SEDS – NGC 1399 SIMBAD – NGC 1399 VizieR – NGC 1399</p></div>
