<div class="wi-intro"><p>弧矢四，即船尾座χ（英語：χ Puppis），又名HD 65456，是一顆船尾座的A5Ⅱ型恆星， 其視星等為4.79。 根據由歐洲空間局發射的依巴谷衛星所測量的數據計算，弧矢四距太陽系約1210光年（370秒差距）。 在約翰·拜耳的傳統天圖中，弧矢四被命名為χ，而在天文學家弗里德里希·阿格蘭德所著的《新測天圖》（德語：Neue Uranometrie）中，很可能是受拜耳影響，弧矢四亦被命名為南船座χ。而在尼可拉·路易·拉卡伊所設計的星表中，南船座χ則為天社增一。</p></div><div class="wi-rest"><h2>參考來源</h2></div>
