<div class="wi-intro"><p>波江座δ，又名BD-10 728，HD 23249、SAO 130686、HR 1136，是波江座的一顆恆星，視星等為3.54，位於銀經198.1，銀緯-46，其B1900.0坐標為赤經3h 38m 27.4s，赤緯-10° -46′ 6″。這個恆星是一個橙黃色的次巨星，距離我們約29光年，屬於太陽的近鄰。該星絕對星等為+3.75,總光度約為太陽的3倍，直徑為太陽的2.33倍，表面溫度約為5000K。與普通紅巨星相比，它要小得多，也暗不少，但它會繼續向着紅巨星方向演化，最後成為一個真正的巨星。 這個恆星可能擁有一個氣態的巨行星。</p></div><div class="wi-rest"></div>
