<div class="wi-intro"><p>葛里格-斯傑勒魯普彗星（26P/Grigg–Skjellerup）是一顆周期彗星，喬托號探測器於1992年7月觀測過，距離僅有200公里，但未拍照，因為一些儀器在探測哈雷彗星後受損。 這顆彗星於1902年由紐西蘭的約翰·葛里格（John Grigg）發現，並於1922年由澳大利亞約翰·弗朗西斯·斯基勒魯普（John Francis Skjellerup）在其下一次出現時重新發現，他當時在南非生活和工作了大約20年，是南非天文學會的創始人之一。 1982年，阿雷西博天文台使用雷達探測過這顆彗星。 葛里格-斯傑勒魯普彗星是船尾座π流星雨的母天體。彗核的直徑估計為2.6公里。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
