<div class="wi-intro"><p>NGC 1100 是波江座的一個星系。法蘭斯·萊文沃思於1885年10月17日發現該星系 | date découverte = 17 octobre 1885。 NGC 1100是希克森緊湊星系團（Hickson Compact Group）的一部分，該群體包括NGC 1091、NGC 1092、NGC 1098和NGC 1099星系。</p></div><div class="wi-rest"><h2>參考資料</h2><p>維基共享資源上的相關多媒體資源：NGC 1100</p><p>NED – NGC 1100 SEDS – NGC 1100 SIMBAD – NGC 1100 VizieR – NGC 1100</p></div>
