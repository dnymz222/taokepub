<div class="wi-intro"><p>(278361) 2007 JJ43是一顆位於柯伊伯帶的繞太陽運轉的海王星外天體（TNO）。由於它的亮度較高，它很有可能成為一顆矮行星。 它在2007年拍攝的照片中發現。它的視星等達到3.7，是二十顆最亮的海王星外天體之一。因為它的反射率很典型，它的大小大概和小行星28978差不多（直徑650–800 km）。然而，約翰斯頓2010年的論文中認為它的直徑可達大約1000 km，甚至超過了穀神星（直徑大約950 km）。 2010年時，小行星278361距離太陽大約48天文單位。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
