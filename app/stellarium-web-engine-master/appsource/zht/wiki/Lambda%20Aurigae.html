<div class="wi-intro"><p>咸池三，即御夫座λ（λ Aur, λ Aurigae）是一個位於御夫座的雙星系統，距離地球約41.2光年。</p></div><div class="wi-rest"><h2>特徵</h2><p>咸池三的主星咸池三A是一顆黃色G-型次巨星，視星等為+4.69。它的伴星咸池三B距離主星29角秒，視星等為+13.4。這對聯星有兩顆光學雙星：距離42角秒，視星等為+8.6的咸池三C以及距離146角秒的咸池三D。</p><h2>命名</h2><p>在中國古代星官系統中，它屬於西方白虎七宿畢宿的星官咸池第三星，這也是咸池三名字的來由。在西方，咸池三有時會貝稱為 Al Hurr，在阿拉伯語中是「小羊」的意思。</p><h2>伴星</h2><h2>參考資料</h2></div>
