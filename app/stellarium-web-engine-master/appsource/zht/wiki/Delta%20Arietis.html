<div class="wi-intro"><p>天陰四，即白羊座δ （δ Ari，拜耳命名法）或白羊座57（佛蘭斯蒂德命名法），是一顆位於白羊座的恆星，距離地球168光年。 天陰四的視星等為+4.35，它是一顆K型橙色巨星，直徑是太陽的13倍。 白羊座δ在中國星官系統中屬於西方白虎七宿中昴宿的星官天陰第四星，因此被稱為天陰四 ，同時它也是天陰增星的第六星，故亦可稱為天陰增六。在西方的傳統名為Botein，來自於阿拉伯語بطين，意思為「腹部」。有時候這個名字也和白羊座ζ、白羊座ε、白羊座π和白羊座ρ3一起並稱。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
