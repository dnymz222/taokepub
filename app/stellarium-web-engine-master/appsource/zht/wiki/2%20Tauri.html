<div class="wi-intro"><p>天廩三，即金牛座ξ（ξ Tau，ξ Tauri）是一個位於金牛座的三合星系統，距離地球約222光年。 天廩三是一個分光雙星和食雙星系統。它由三顆藍白色B-型主序星組成，其中兩顆恆星在一個很近的軌道相互旋轉，周期為7.15天。這兩顆星又和第三顆星以145天的周期相互旋轉。這個恆星系統的視星等為+3.73，但由於在旋轉過程中，一顆恆星可能被另外一顆恆星所遮掩，因此它的視星等在+3.70至+3.79之間變化。</p></div><div class="wi-rest"><h2>參考資料</h2><p>HD 21364 -- Variable Star. SIMBAD Astronomical Database. [2007-01-26].</p></div>
