<div class="wi-intro"><p>火鳥六（α Phe/ 鳳凰座α）是鳳凰座最亮星，俗名Ankaa，來源於阿拉伯語「العنقاء」（al-『anqā』，鳳凰）。中世紀阿拉伯天文學家把該星座看做小船，因此該星還有另一個著名的名字Nair al-Zaurak，源於「النائر الزورق」（an-na』ir az-zawraq，小船的最亮星）。火鳥六的拉丁名為Cymbae，源自lūcida cumbæ。 與多數肉眼可見的恆星一樣，火鳥六也是一顆中等大小的橙巨星。它現在處於短暫但穩定的氦聚變階段的中期，最終將變成一顆行星狀星雲圍繞的白矮星。火鳥六是一個小型聚星集團的成員，但其人類對其伴星了解甚少。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
