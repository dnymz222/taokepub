<div class="wi-intro"><p>畢宿增十二，即金牛座δ²（δ² Tau，δ² Tauri）是一顆位於金牛座的恆星，它是離太陽系最近的疏散星團——畢宿星團的成員之一，距離地球約146光年。由於畢宿增十二的位置接近黃道，故經常被月球所遮掩。此外，太陽系的行星如水星與金星等也有可能遮掩它，但這現象非常罕見。 畢宿增十二是一顆A-型主序星，視星等為+4.80，在天球上和金牛座δ¹相隔0.23°。</p></div><div class="wi-rest"><h2>參考資料</h2><p>HD 27819 -- Star in double system. SIMBAD Astronomical Database. [2007-01-25].</p></div>
