<div class="wi-intro"><p>敗臼一（γ Gru/天鶴座γ）是南天星座天鶴座的一顆恆星。視星等3.0，是天鶴座的第三亮星。 基於視差測量，該星距離地球大約211光年。恆星分類B8III，亮度分類III代表它是一個已經耗盡核心的氫並演化離主序帶的巨星。敗臼一的光度大約是太陽的470倍，很多的能量都以紫外線輻射出。表面溫度12,520K，散發出藍白色的光芒。敗臼一的自轉相對快速，恆星自轉速度為57km/s。相比之下，太陽赤道的自轉速度只有2km/s。 分析依巴谷衛星收集到的數據，該星可能有相同自行的伴星，對敗臼一造成引力干擾。</p></div><div class="wi-rest"></div>
