<div class="wi-intro"><p>印第安座β，又名CP-58 7788，HD 198700、SAO 246784、HR 7986，是印第安座的一顆恆星，視星等為3.65，位於銀經338.16，銀緯-38.85，其B1900.0坐標為赤經20h 46m 59.8s，赤緯-58° -38.85′ 53″。 該星質量接近7個太陽質量，是一個橙色的亮巨星。總輻射波段亮度達到太陽的2000倍，表面溫度約為4450K，呈現出類似大角星的橙黃色。該星已經進入紅巨星階段，直徑估計超過75倍太陽直徑，並將進一步膨脹。該星年齡預計只有5000萬年，由於質量較大，因此迅速演化。</p></div><div class="wi-rest"></div>
