<div class="wi-intro"><p>昴宿二，即金牛座19（19 Tau，19 Tauri）是一個位於金牛座的三合星系統，它是昴宿星團的成員，距離地球約440光年。 昴宿二的主星昴宿二A是一顆藍白色B-型次巨星，視星等為+4.30。它又是一個分光雙星系統，兩顆成員星的視星等分別是+4.6和+6.1，相距0.012角秒，軌道周期1313天。另一個伴星昴宿二B視星等為8等，距離它們69角秒。 在中國古代星官系統中，昴宿二屬於西方白虎七宿中昴宿第二星，這也是昴宿二名字的來由。它在西方被稱為Taygeta，是指阿特拉斯（Atlas）和普勒俄涅（Pleione）的七個女兒之一塔宇革忒。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
