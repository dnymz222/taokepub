<div class="wi-intro"><p>NGC 6528是一個位於人馬座的球狀星團，在1784年被天文學家威廉·赫歇爾用18英寸的望遠鏡發現。它的視星等約為11，在天球中的直徑約為16弧分，其在夏普力-索耶集中度分類法中被分為V級，包含16級和更暗的恆星。 德雷爾把它描述為「pF，cS，R」，意為小而圓的星團。 NGC 6528位於另一個球狀星團NGC6522的西南部。兩者都位於巴德窗中，都在銀河赤道附近一個相對清晰的區域。相比其他球狀星團，NGC 6528異常富含金屬，其成分與NGC 6553非常相似，表明兩個星團在相似的環境中形成。</p></div><div class="wi-rest"><h2>畫廊</h2></div>
