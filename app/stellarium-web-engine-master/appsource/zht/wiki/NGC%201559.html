<div class="wi-intro"><p>NGC 1559是一個位於網罟座的棒旋星系。該星系同時也是西佛星系。雖然NGC 1559起初被認為是劍魚座星系團的成員星系，稍後的觀測結果卻顯示它並不屬於任一星系團或星系群，甚至沒有臨近伴星系存在。NGC 1559有巨大的螺旋臂結構，以及高恆星形成率。該星系有一個接近東西走向，在天球上橫跨40角秒的小型棒狀結構。它的棒狀結構與盤面是極為強烈的無線電波發射源。 2005年，天文學家在NGC 1559內發現Ia超新星SN 2005df。該星系內還曾經發現2顆超新星SN 1984J和SN 1986L。而這三顆超新星都是由澳大利亞業餘天文學家羅伯特·埃文斯發現。</p></div><div class="wi-rest"><h2>圖集</h2><h2>參考資料</h2></div>
