<div class="wi-intro"><p>天乳增一（巨蛇座25，巨蛇座A2）是在星座巨蛇座西側，「巨蛇首」的一個恆星系統。它的視星等為5.4等，肉眼隱約可見。 根據其視差，估計該系統的距離約為450光年（138秒差距）。</p><p>天乳增一是光譜聯星，意即各分量距離過近，無法解析出各個成員，但其光譜中的週期性都卜勒位移顯示出軌道運動。該系統由一顆熱B型巨星以及一顆A型主序星組成。這兩顆恆星每38.9日彼此繞行一次，軌道離心率為0.731。1996年，當分析「依巴谷」的資料時，發現該星是變星。主星是一顆慢脈動B型變星，使系統星等變化0.03等；因此於1999年被賦予變星編號「巨蛇座PT」。</p></div><div class="wi-rest"></div>
