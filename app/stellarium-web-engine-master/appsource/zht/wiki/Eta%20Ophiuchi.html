<div class="wi-intro"><p>天市左垣十一(蛇夫座η)也稱宋，又名BD-15 4467，HD 155125、SAO 160332、HR 6378，是蛇夫座的雙星系統，在中國古代星官名系統中屬於三垣中天市垣，為天市左垣第十一星。 天市左垣十一實際上是一個用業餘天文望遠鏡難以區分開的雙星系統，但用更先進的手段可以測定出來。其主星蛇夫座η A僅僅比蛇夫座η B稍大，溫度也稍高。兩顆恆星都是不引人注目的A型主序星，但作為雙星系統，它們並不尋常。它們沿扁率很大的橢圓軌道繞公共質心旋轉地速度如此之快，以至於不可能形成行星系統，一些恆星數據也不甚精確。 天市左垣十一是天王星的北極星。</p></div><div class="wi-rest"></div>
