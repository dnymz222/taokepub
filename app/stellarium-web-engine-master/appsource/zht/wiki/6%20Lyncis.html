<div class="wi-intro"><p>八穀增廿八，即天貓座6（6 Lyncis，6 Lyn）是一個距離地球約182光年的光譜類型K型次巨星，位於天貓座。</p></div><div class="wi-rest"><h2>概要</h2><p>天貓座6的質量是太陽的1.7倍，半徑是太陽的5.2倍，光度是太陽的15倍。視星等5.88，絕對星等2.10。</p><h2>行星系統</h2><p>2008年7月，該恆星旁的系外行星天貓座6b和仙女座14b、鯨魚座81b一起被佐藤文衛宣布發現。天貓座6b的質量下限是木星的2.4倍，公轉週期899日。</p><h2>參考資料</h2></div>
