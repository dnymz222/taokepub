<div class="wi-intro"><p>斗（dǒu）宿（xiù）一，其拜耳命名法為人馬座φ（φ Sgr），又名天同星，是一個在人馬座的恆星。視星等3.17，它是人馬座里的第九亮星，可以用肉眼可見。視差測量出它距離地球大約239光年。 該星的恆星分類為B7IV-III，亮度分類III代表它是個巨星，IV代表還是個次巨星。兩者都代表該星幾乎耗盡了核心的氫。表面溫度大約13,000K，散發出藍白色的光芒。 在過去，該星被列為光譜聯星，伴星是經由月球的掩星偵測出的。但是，它很可能是個單星，任何附近的恆星都只是光學伴星。</p></div><div class="wi-rest"><h2>參考條目</h2><p>二十八宿 斗宿 南斗六星 人馬座</p><h2>參考</h2></div>
