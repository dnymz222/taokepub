<div class="wi-intro"><p>克拉克彗星（71P/Clark）是一顆週期彗星，軌道周期為5.5年。 1973年6月9日，麥克·克拉克（Michael Clark）在紐西蘭約翰山大學天文台（Mount John University Observatory）發現克拉克彗星，其亮度為視星等13等。隨後，1978年、1984年、1989年、1995年、2000年、2006年、2011年和2017年，克拉克彗星都被觀測到 and 2017.。 根據哈伯太空望遠鏡的觀測，克拉克彗星彗核半徑為0.68±0.04公里，幾何反照率為0.04；而凱克天文台的觀測顯示彗核半徑為1.305公里。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
