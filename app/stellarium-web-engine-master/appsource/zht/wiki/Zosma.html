<div class="wi-intro"><p>西上相(δ Leo / 獅子座δ)也稱太微右垣五，是獅子座的一顆恆星，俗名Zosma(或Zozma)以及Duhr。有時也寫作Zozca，Zosca，Zubra和Dhur. 西上相是一顆相對普通的主序星，它比太陽稍大，溫度稍高。天文學家對它已經有較深入的研究：相對精確的了解它的年齡及大小等。由於比太陽的質量大，它的壽命會比太陽短，在6億年左右後，它會膨脹成一顆黃巨星或紅巨星，之後變為一顆白矮星。 它的名字Zosma在古希臘語中意為「腰帶」，因為它在星座中的位置處於獅子座的臀部。</p></div><div class="wi-rest"></div>
