<div class="wi-intro"><p>小行星55565（55565 Aya）是外海王星天體（TNO），以阿卡德神話中的黎明女神阿亞（Aya）命名。它在2002年被米高·E·布朗等人發現，被分類為QB1天體。 它是矮行星候選者，並且它的位置靠近古柏斷崖。</p></div><div class="wi-rest"><h2>尺寸</h2><p>由史匹哲太空望遠鏡觀測的熱輻射估計的直徑是700±50公里，反照率大約是0.17±0.03.。</p><h3>表面</h3><p>ESO分析光譜顯示出偏向紅色並且沒有水冰的跡象 (對照夸奧爾也是偏紅的)，建議有有機物質 (參見顏色和對光譜類型的比較。)</p><h2>參考資料</h2></div>
