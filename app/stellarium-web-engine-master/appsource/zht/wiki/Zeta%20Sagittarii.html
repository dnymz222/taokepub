<div class="wi-intro"><p>斗（dǒu）宿（xiù）六（ζ Sgr / 人馬座ζ）又名天府星，是人馬座的第三亮星，俗名Ascella，源於後期拉丁語，意為「腋窩」。 斗宿六是刻個雙星系統，由A2光譜型、視星等為+3.26的巨星和A4光譜型、視星等為+3.37的亞巨星組成。該雙星系統的繞行周期為21年，兩者平均距離為12.4天文單位，軌道偏心率為0.205。它有一個黯淡的10星等伴星人馬座ζ C，距離主星75弧秒。 斗宿六恆星系統距離地球90光年，組合視星等為+2.60。 在古代中國天文中，它是星官斗或'南斗'的第六星。</p></div><div class="wi-rest"></div>
