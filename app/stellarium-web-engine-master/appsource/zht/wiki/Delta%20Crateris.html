<div class="wi-intro"><p>翼宿七（δ Crt/巨爵座δ）是南天星座巨爵座的一個單星。視星等3.56，它是這個暗淡星座的最亮星。從地球測量的恆星視差約為17.56mas，翼宿七距離太陽大約186光年。 這是一個已經演化的橙巨星，恆星分類K0III。翼宿七是紅群聚的一員，它經由核心的氦聚變產生能量。該星有1.5倍太陽質量，但是已經膨脹到22.44±0.28倍太陽半徑。 該星的金屬量（天文學上指氫氦以外元素的豐度）只有太陽的33%。它的年齡大約29億年，自轉緩慢的無法測量，投影自轉速度為0km/s。翼宿七輻射出171.4±9.0倍太陽光度，表面溫度4,510±15K。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
