<div class="wi-intro"><p>蝘蜓座是南天深處的一個很暗的星座，位於船底座和南極座之間。</p></div><div class="wi-rest"><h2>星座神話</h2><p>荷蘭探險家彼得·德克斯宗·凱澤和弗雷德里克·德·豪特曼所創，代表變色龍。</p><h2>深空天體</h2><p>蝘蜓座δ星：這是一個兩子星相距很寬的微弱雙星，用裸眼可以看見，通過雙筒望遠鏡可以看的更為清楚。雙星中比較明亮的子星叫δ1，它本身又是一顆雙星，它的兩子星相距很近。 NGC 3195：這是一個行星狀星雲，從地球看上去是一個藍色的圓盤。中央星星等的+15.3，用小型望遠鏡是看不見它的。</p><h2>重要主星</h2><p>小斗Little Dipper（極9）</p></div>
