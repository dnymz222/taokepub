<div class="wi-intro"><p>騎官十（α Lup / 豺狼座α）是豺狼座的最亮星，也是一顆藍巨星。R. H. Allen在他的著作Star Names: Their Lore and Meaning中建議使用其巴比倫名字Kakkab Su-gub Gud-Elim，意為「帶角公牛的左手」。其中文名意為「騎官第十星」。 騎官十在1956年被分類為仙王座β變星。光變周期為0.29585天(超過7小時6分)，是已知同類型中最長周期之一。 騎官十的光度變化約為0.03，這大約是總光度的3%。在其附近的一顆恆星可能是它的光學伴星。騎官十是距離太陽最近的OB星協——天蠍-半人馬星協的成員。</p></div><div class="wi-rest"><h2>參考資料</h2></div>
