<div class="wi-intro"><p>羅盤座α，又名CD-32 5651，HD 74575、SAO 199546、HR 3468，是羅盤座的一顆恆星，視星等為3.68，位於銀經254.99，銀緯5.77，其B1900.0坐標為赤經8h 39m 34.4s，赤緯-32° 5.77′ 33″。這個恆星雖然只是一個4等的暗星，但實際上這個恆星距離遠至850光年，是一個相當大的藍色巨星。其光譜分類為B1.5III。它的絕對星等約為-3.39，在可見光波段比太陽要亮1908倍大，因此它的生命將十分短暫，最後會成為一個壯麗的超新星。</p></div><div class="wi-rest"></div>
