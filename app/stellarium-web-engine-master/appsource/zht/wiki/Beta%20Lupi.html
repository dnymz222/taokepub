<div class="wi-intro"><p>騎官四（β Lup/豺狼座β），是一顆位於南天星座豺狼座的恆星。視星等2.68，可以用肉眼看見。基於視差測量，該星距離地球大約383光年。</p></div><div class="wi-rest"><h2>特性</h2><p>恆星分類B2IV代表它是一個次巨星。表面溫度24,090K，散發着藍白色的光芒。年齡大約2500萬年，它已經接近氫聚變階段的尾聲了，將會膨脹成紅超巨星。有大約9.5太陽質量，它可能有足夠的質量以II型超新星爆炸結束生命，也有可能變成一顆大質量的白矮星。 這是一顆多重周期的仙王座β型變星，主要震盪周期0.232天。它是距離太陽最近的OB星協——天蠍-半人馬星協的上半人馬-豺狼子分群的成員。 騎官四在SN 1006超新星殘骸附近。</p></div>
