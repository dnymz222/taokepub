<div class="wi-intro"><p>獵戶座V883（V883 Orionis）是一顆在天球上位於獵戶座的原恆星。</p></div><div class="wi-rest"><h2>概要</h2><p>獵戶座V883與天體IC 430（Haro 13A）有關聯，而後者是天文學家吉列爾莫·哈羅在1952年時觀測過的特殊Hα輻射天體。該恆星距離地球約1350光年（414秒差距），並且與獵戶座大星雲相關。 獵戶座V883和許多原恆星一樣周圍有塵埃形成的星周盤環繞。恆星周圍的雪線是恆星輻射量低到一定程度，讓水凍結成冰的界線。該恆星周圍的雪線已經在阿塔卡馬大型毫米波/亞毫米波陣列（ALMA）的觀測中成像。當恆星的輻射量升高時，雪線的邊界將會距離恆星更遠。</p><h2>圖集</h2><h2>參考資料</h2></div>
