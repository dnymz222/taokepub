<div class="wi-intro"><p>飛魚座（Volans）是荷蘭人彼得·德克斯宗·凱澤和弗雷德里克·德·豪特曼於1595年-1597年觀測和創立的12個南天星座之一,1603年被包括在拜耳恆星命名中。該星座部分恆星屬於中國近南極星區飛魚星官。</p></div><div class="wi-rest"><h2>重要主星</h2><p>來源：The Bright Star Catalogue, 5th Revised Ed., The Hipparcos Catalogue, ESA SP-1200</p><h2>深空天體</h2><p>NGC 2442/2443：中間螺旋星系 NGC 2397：螺旋星系</p></div>
