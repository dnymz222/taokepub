<div class="wi-intro"><p>鶴一（α Gru / 天鶴座α）是天鶴座最亮的恆星。 鶴一有一個專名Alnair或Al Nair（有時寫作Al Na'ir），來自於阿拉伯語al-nayyir [an-nai:r]，意為「最亮的」。該詞派生於鶴一的阿拉伯名稱al-Nayyir min Dhanab al-ḥūt (al-Janūbiyy),意為「屬於(南)魚（座）的尾巴的最亮的（恆星）」。 在20世紀中期的星曆表中，Alnair也是半人馬座ζ的專名。 在傳統阿拉伯天文中，鶴一和天鶴座β, δ, θ,ι,以及 λ都屬於南魚座。</p></div><div class="wi-rest"><h2>參考</h2></div>
