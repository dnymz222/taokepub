<div class="wi-intro"><p>NGC 5253是位於半人馬座的一個不規則星系。此星系亦是已知在地球附近的藍緻密矮星系之一，距地球約一千一百萬光年。它也被視為半人馬座 A/M83星系團的一員。</p></div><div class="wi-rest"><h2>星系特點</h2><p>NGC 5253擁有相比起其他同類星系更多的塵埃及重元素，不過比起銀河系這些一般星系還是很少。星系中心是活躍的恆星生成點，而在中心的星爆區則有一大量熾熱和年輕的明亮恆星。不過，星系的光度卻為熾熱和混有塵埃的氣體雲所掩蓋。大學物理學與天文學教授吉恩-特納和他的同事對NGC 5253星系進行了詳細的研究，發現NGC 5253擁有其數百個星團和一些年輕的星體，特別是還擁有大量的暗物質。</p></div>
